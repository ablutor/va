<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Rafael · Planeta de Anéis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
:root{ --ambar:#ffb547; --creme:#f6e7cf; --dim:#a48f76; --linha:rgba(255,181,71,.16) }
body{ background:#090604; color:var(--creme); font-family:"Space Grotesk",sans-serif }
.cartao{ position:absolute; left:330px; top:140px; width:1260px; height:620px; border-radius:34px;
  background:
    repeating-linear-gradient(0deg, rgba(255,181,71,.025) 0 1px, transparent 1px 34px),
    repeating-linear-gradient(90deg, rgba(255,181,71,.025) 0 1px, transparent 1px 34px),
    linear-gradient(140deg, #1a110a, #0d0805);
  border:1px solid var(--linha); box-shadow:0 50px 100px -30px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,220,170,.08) }
.conteudo{ position:absolute; left:64px; top:56px; width:600px }
.deck{ display:flex; justify-content:space-between; font:500 11.5px "IBM Plex Mono",monospace; letter-spacing:.22em; text-transform:uppercase; color:var(--dim) }
.deck b{ color:var(--ambar); font-weight:500; display:flex; align-items:center; gap:9px }
.deck b::before{ content:""; width:8px; height:8px; border-radius:2px; background:var(--ambar); box-shadow:0 0 10px var(--ambar) }
.quem{ display:flex; align-items:center; gap:26px; margin-top:44px }
.foto{ width:112px; height:112px; border-radius:50%; position:relative; flex:none }
.foto img{ width:100%; height:100%; border-radius:50%; object-fit:cover; object-position:50% 25% }
.foto::after{ content:""; position:absolute; inset:-9px; border-radius:50%; border:1.5px dashed rgba(255,181,71,.55) }
h1{ margin:0; font:700 88px/.9 "Space Grotesk"; letter-spacing:-.04em; color:var(--creme) }
h1 span{ color:var(--ambar) }
.tag{ margin-top:12px; font:400 13px "IBM Plex Mono",monospace; color:var(--dim); display:flex; gap:18px; align-items:center }
.tag svg{ width:14px; height:14px; display:inline-block; vertical-align:-2px; margin-left:6px }
.tag .on{ color:#9dffb5 }
.bio{ margin:30px 0 0; font-size:17.5px; line-height:1.65; color:#d6c4ab; max-width:560px }
.frase{ margin-top:22px; padding:14px 18px; border:1px solid var(--linha); border-radius:14px; font:400 14px/1.6 "IBM Plex Mono",monospace; color:#ecd3a9; background:rgba(255,181,71,.04) }
.frase::before{ content:"> "; color:var(--ambar) }

.console{ position:absolute; left:64px; bottom:50px; width:600px; display:grid; grid-template-columns:auto 1fr; gap:10px 18px; align-items:center }
.tocar{ grid-row:span 2; width:64px; height:64px; border-radius:18px; background:var(--ambar); color:#1d1002; display:grid; place-items:center; box-shadow:0 0 0 1px #ffd593 inset, 0 12px 30px -6px rgba(255,160,40,.55) }
.tocar svg{ width:26px; height:26px; margin-left:3px }
.faixa{ display:flex; justify-content:space-between; font:500 12.5px "IBM Plex Mono",monospace; letter-spacing:.08em; text-transform:uppercase }
.faixa span{ color:var(--dim) }
.leds{ display:flex; gap:4px; height:14px }
.leds b{ flex:1; border-radius:2px; background:rgba(255,181,71,.12) }
.leds b.on{ background:var(--ambar); box-shadow:0 0 8px rgba(255,181,71,.6) }

.escotilha{ position:absolute; left:770px; top:40px; width:540px; height:540px; border-radius:50%;
  background:conic-gradient(from 20deg, #3a2a1b, #8a6a45, #2b1f14, #a07c50, #3a2a1b, #6e5235, #2b1f14, #8a6a45, #3a2a1b);
  box-shadow:0 30px 60px -10px rgba(0,0,0,.85), inset 0 0 0 1px rgba(255,220,170,.25), inset 0 2px 6px rgba(255,230,190,.25) }
.escotilha::before{ content:""; position:absolute; inset:16px; border-radius:50%; background:#0a0705; box-shadow:inset 0 0 0 2px #1a120b }
.janela{ position:absolute; inset:30px; border-radius:50%; overflow:hidden; box-shadow:inset 0 0 40px 10px rgba(0,0,0,.85) }
.janela canvas{ position:absolute; inset:0; width:100%; height:100% }
.janela::after{ content:""; position:absolute; inset:0; border-radius:50%; background:linear-gradient(135deg, rgba(255,255,255,.10), transparent 30%, transparent 70%, rgba(255,200,140,.05)) }
.parafuso{ position:absolute; width:12px; height:12px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #e6c79a, #6a4f30 70%); box-shadow:0 1px 2px rgba(0,0,0,.7) }
.plaquinha{ position:absolute; left:940px; top:588px; width:200px; white-space:nowrap; padding:7px 0; text-align:center; border-radius:8px; background:#1c130b; border:1px solid var(--linha); font:500 10.5px "IBM Plex Mono",monospace; letter-spacing:.2em; color:var(--dim) }
</style>
</head>
<body>
<canvas id="ceu" class="fundo"></canvas>
<div class="cartao">
  <div class="conteudo">
    <div class="deck"><b>estação orbital</b><span>vista · anel de Kepler-7</span></div>
    <div class="quem">
      <div class="foto"><img src="../clientes/exemplo/perfil-masculino.jpg" alt=""></div>
      <div>
        <h1>Rafael<span>.</span></h1>
        <div class="tag">tripulante 82460885<i data-i="copy"></i><span class="on">● a bordo</span></div>
      </div>
    </div>
    <p class="bio">Engenheiro de dia, astronauta de madrugada. Se a conversa for boa, a gente dá mais uma volta em torno do planeta.</p>
    <div class="frase">a gravidade daqui é menor, mas ainda assim eu caio fácil.</div>
  </div>
  <div class="console">
    <div class="tocar"><i data-i="play"></i></div>
    <div class="faixa"><b>Arctic Monkeys · Do I Wanna Know?</b><span>1:58 / 4:32</span></div>
    <div class="leds" id="leds"></div>
  </div>
  <div class="escotilha" id="esc"><div class="janela"><canvas id="jan"></canvas></div></div>
</div>

<script src="cosmos.js"></script>
<script>
const C = Cosmos; C.icones();
document.getElementById("leds").innerHTML = Array.from({ length: 36 }, (_, i) => `<b class="${i < 16 ? "on" : ""}"></b>`).join("");
const esc = document.getElementById("esc");
for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2, p = document.createElement("i"); p.className = "parafuso";
  p.style.left = 270 - 6 + Math.cos(a) * 254 + "px"; p.style.top = 270 - 6 + Math.sin(a) * 254 + "px"; esc.appendChild(p); }
{ // fundo da página
  const { ctx, w, h } = C.tela("#ceu");
  C.gradiente(ctx, w, h, [[0, "#0c0805"], [1, "#050302"]]);
  C.nebulosa(ctx, w, h, { semente: 77, freq: 1 / 700, limiar: .55, suave: .4, forca: .12, cores: [[0, "#120802"], [1, "#6b3a12"]] });
  C.estrelas(ctx, w, h, { n: 500, semente: 12, max: 1.3, cores: ["#ffffff", "#ffe8c4"] });
}
{ // vista pela escotilha
  const { ctx, w, h } = C.tela("#jan");
  C.gradiente(ctx, w, h, [[0, "#06040a"], [1, "#120a06"]]);
  C.nebulosa(ctx, w, h, { semente: 19, freq: 1 / 260, esc: 2, limiar: .5, suave: .4, forca: .45, cores: [[0, "#100604"], [.6, "#7a3412"], [1, "#e8a060"]] });
  C.estrelas(ctx, w, h, { n: 500, semente: 4, max: 1.4, cores: ["#ffffff", "#ffeccc", "#cfe0ff"] });
  const P = { x: 205, y: 290, r: 160 };
  const banda = C.rampa([[0, "#4a230c"], [.3, "#9b5524"], [.55, "#dc9b56"], [.75, "#f2cf97"], [1, "#fff1d6"]]);
  const anel = { ...P, angulo: -.32, achatamento: .24, de: 1.32, ate: 2.35, semente: 3, cores: [[0, "#7a5636"], [.4, "#f0d3a0"], [.7, "#c69a62"], [1, "#e8c894"]] };
  C.aneis(ctx, { ...anel, parte: "tras" });
  C.planeta(ctx, { ...P, luz: [-.75, -.35, .55], inclinacao: -.32, atmosfera: "#ffcf8a", halo: .05, forcaHalo: .6,
    textura: (sx, sy, sz) => {
      const t = C.fbm(sx * 3, sy * 3, sz * 3, 5, 4), f = C.fbm(sx * 3, sy * 40, sz * 3, 9, 4);
      let c = banda(C.cl(.52 + .3 * Math.sin(sy * 30 + (t - .5) * 1.6) + .18 * Math.sin(sy * 9 + 1) + (f - .5) * .5));
      const dx = sx - .55, dy = sy - .32, dz = sz - .77, d = Math.hypot(dx * .7, dy * 1.6, dz * .7);   // a grande tempestade
      const k = C.ss(.16, .06, d);
      return [C.mix(c[0], 205, k), C.mix(c[1], 92, k), C.mix(c[2], 52, k)];
    } });
  C.aneis(ctx, { ...anel, parte: "frente" });
  C.planeta(ctx, { x: 392, y: 104, r: 20, luz: [-.75, -.35, .55], textura: (sx, sy, sz) => { const n = C.fbm(sx * 4, sy * 4, sz * 4, 2, 4) * 150 + 70; return [n, n * .95, n * .9]; } });
}
</script>
</body>
</html>
