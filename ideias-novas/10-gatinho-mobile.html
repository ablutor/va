  .insta { display: inline-flex; align-items: center; gap: 5px; padding: 8px 10px; border-radius: 14px; background: var(--gato); color: #fff; font-weight: 800; font-size: 12.5px; box-shadow: 0 5px 12px rgba(47,43,69,.28); white-space: nowrap; }

  /* frase */

  /* player */

  .capa { flex: none; width: 46px; height: 46px; border-radius: 14px; position: relative; overflow: hidden; background: linear-gradient(150deg, #8a6cff, #5b7bff); border: 2.5px solid var(--gato); }

  .pinfo b { display: block; font-family: "Fredoka"; font-weight: 600; font-size: 17px; line-height: 1.15; } .pinfo span { font-size: 13px; font-weight: 700; color: var(--muted); }

  .ctrl { display: flex; align-items: center; justify-content: center; gap: 22px; margin-top: 8px; }

  .ctrl .play { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: linear-gradient(160deg, #a58cff, var(--lilas)); box-shadow: 0 6px 14px rgba(138,108,255,.5), inset 0 -3px 0 rgba(0,0,0,.08); margin-top: -4px; }
  .ctrl .play svg { width: 20px; height: 20px; }

  /* cena */
  .cena { position: absolute; inset: 0; pointer-events: none; }
  .balao { position: absolute; left: 25px; top: 12px; width: 340px; padding: 8px 18px; display: flex; align-items: center; justify-content: center; gap: 14px;
    background: var(--card); border-radius: 26px; box-shadow: var(--sombra); border: 1.5px solid rgba(201,186,255,.55); animation: flutuar 4s ease-in-out infinite; }
  .balao::after { content: ""; position: absolute; left: 50%; bottom: -9px; width: 18px; height: 18px; margin-left: -9px; background: var(--card); border-radius: 4px; transform: rotate(45deg); border-right: 1.5px solid rgba(201,186,255,.55); border-bottom: 1.5px solid rgba(201,186,255,.55); }
  @keyframes flutuar { 50% { transform: translateY(-4px); } }
  .balao .num { font-family: "Fredoka"; font-weight: 600; font-size: 40px; line-height: 1; color: var(--lilas); min-width: 28px; text-align: center; }
  .balao p { font-size: 14px; font-weight: 700; margin-top: 1px; } .balao p em { font-style: normal; color: #ec6aa0; }
  .bicho { position: absolute; left: 41px; top: 66px; width: 330px; height: 343px; cursor: pointer; pointer-events: auto; }
  .bicho svg { width: 100%; height: 100%; overflow: visible; display: block; }
  .corpo-todo { transform-box: fill-box; transform-origin: 50% 96%; animation: respirar 3.2s ease-in-out infinite; }
  @keyframes respirar { 0%,100% { transform: translateY(0) scale(1,1); } 50% { transform: translateY(-4px) scale(1.012,.99); } }
  .rabo { transform-box: view-box; transform-origin: 372px 478px; animation: abanar 3.4s ease-in-out infinite; }
  @keyframes abanar { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(5deg); } }
  .olhos-abertos { transform-box: fill-box; transform-origin: center; animation: pestanejar 5s infinite; }

  .bochecha { transform-box: fill-box; transform-origin: center; animation: corar 2.8s ease-in-out infinite; }
  @keyframes corar { 50% { transform: scale(1.14); opacity: .85; } }
  .sino { transform-box: view-box; transform-origin: 250px 340px; animation: balancar 2.2s ease-in-out infinite; }
  @keyframes balancar { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  .novelo { transform-box: fill-box; transform-origin: center; animation: rolar 3.6s ease-in-out infinite; }
  @keyframes rolar { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(8deg); } }
  .olhos-felizes { display: none; } .bicho.feliz .olhos-abertos { display: none; } .bicho.feliz .olhos-felizes { display: inline; }
  .miau { animation: flutuar 3s ease-in-out infinite; }
  .coracao { position: absolute; pointer-events: none; color: #ff7fb0; font-size: 24px; animation: subir 1.2s ease-out forwards; z-index: 30; }
  @keyframes subir { from { opacity: 1; transform: translate(0,0) scale(.6); } to { opacity: 0; transform: translate(var(--dx), -110px) scale(1.2); } }
  .selo { position: absolute; right: 8px; bottom: 6px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.75); box-shadow: 0 3px 8px rgba(110,88,200,.25); border: 1.5px solid rgba(201,186,255,.8); }
  .selo svg { width: 16px; height: 16px; }
</style>
</head>

<script>
  (function () {
    var box = document.getElementById('pegadas');
    function rastro(x0, y0, x1, y1, n, op) {
      var dx = x1 - x0, dy = y1 - y0, len = Math.sqrt(dx*dx + dy*dy), ang = Math.atan2(dy, dx) * 180 / Math.PI + 90, px = -dy/len, py = dx/len;
      for (var i = 0; i < n; i++) {
        var t = i / Math.max(1, n - 1), lado = i % 2 ? 1 : -1;
        var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        s.setAttribute('viewBox', '0 0 100 100');
        s.style.left = (x0 + dx*t + px*8*lado) + 'px'; s.style.top = (y0 + dy*t + py*8*lado) + 'px';
        s.style.transform = 'rotate(' + (ang + lado*6) + 'deg)'; s.style.opacity = (op * (0.45 + 0.55*t)).toFixed(2);
        s.innerHTML = '<use href="#pata"/>'; box.appendChild(s);
      }
    }
    rastro(8, 400, 22, 150, 5, .6);
    rastro(382, 110, 372, 400, 5, .6);
    rastro(300, 800, 372, 770, 0, 0);
  })();
  (function () {
    var n = 0, el = document.getElementById('bicho'), c = document.getElementById('contador'), t;
    el.addEventListener('click', function (e) {
      c.textContent = ++n; el.classList.add('feliz'); clearTimeout(t); t = setTimeout(function () { el.classList.remove('feliz'); }, 900);
      var h = document.createElement('span'); h.className = 'coracao'; h.textContent = '♥';
      h.style.left = (e.clientX - 10) + 'px'; h.style.top = (e.clientY - 16) + 'px'; h.style.setProperty('--dx', (Math.random()*60 - 30) + 'px');
      document.body.appendChild(h); setTimeout(function () { h.remove(); }, 1250);
    });
  })();
</script>
