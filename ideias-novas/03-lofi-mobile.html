<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Marina Costa · Madrugada lo-fi (mobile)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Pacifico&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:390px;height:844px;overflow:hidden;background:#120d2e}
  *{box-sizing:border-box}
  body{position:relative;font-family:"Quicksand",system-ui,sans-serif;color:#f3e9ff}
  svg.layer{position:absolute;left:0;top:0;width:390px;height:844px;display:block}
  .abs{position:absolute}

  /* quadro na parede */
  .quadro{position:absolute;left:97px;top:254px;width:196px;height:214px;box-sizing:border-box;padding:8px;transform:rotate(-1deg);
    background:linear-gradient(145deg,#6a4529,#3b2415 55%,#52341e);border-radius:2px;
    box-shadow:0 10px 16px rgba(4,2,20,.62),0 2px 3px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,205,150,.20),inset 0 0 0 3px rgba(0,0,0,.30)}
  .quadro .mat{position:relative;height:100%;box-sizing:border-box;padding:12px 12px 0;background:#eee4d0;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.22),inset 0 2px 6px rgba(0,0,0,.28)}
  .quadro .foto{position:relative;height:140px;overflow:hidden;background:#3b2f63;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 0 0 2px #e5d9c1}
  .quadro .foto img{width:100%;height:100%;object-fit:cover;object-position:50% 24%;display:block;filter:saturate(.9) contrast(1.04) brightness(.96) sepia(.1)}
  .quadro .foto::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,176,110,.20),rgba(88,56,170,.30));mix-blend-mode:soft-light}
  .quadro .foto::before{content:"";position:absolute;inset:0;z-index:2;box-shadow:inset 0 0 10px rgba(30,10,60,.45);pointer-events:none}
  .quadro .nome{position:absolute;left:0;right:0;bottom:7px;text-align:center;font-family:"Caveat",cursive;font-weight:700;font-size:26px;line-height:1;color:#4a3a63;white-space:nowrap}
  .quadro .vidro{position:absolute;inset:8px;z-index:4;pointer-events:none;
    background:linear-gradient(118deg,rgba(255,255,255,.17) 0,rgba(255,255,255,.06) 24%,transparent 25%,transparent 52%,rgba(255,255,255,.07) 53%,transparent 66%)}
  .quadro .luz{position:absolute;left:-18px;right:-18px;top:-26px;height:170px;z-index:3;pointer-events:none;
    background:radial-gradient(ellipse 60% 100% at 50% 0,rgba(255,214,140,.36),rgba(255,190,110,.10) 55%,transparent 75%);mix-blend-mode:screen}
  .quadro .lamp{position:absolute;left:50%;top:-22px;width:120px;height:26px;margin-left:-60px;z-index:5;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}

  /* neon */
  .neon{left:12px;top:476px;transform:rotate(-4deg);transform-origin:0 50%}
  .neon .t{font-family:"Pacifico",cursive;font-size:46px;line-height:1.1;color:#ffe3f3;
    text-shadow:0 0 2px #fff,0 0 6px #ff9bd6,0 0 14px #ff4fb4,0 0 26px #ff2f9f,0 0 50px #ff2f9f}
  .neon .t.off{position:absolute;left:0;top:0;color:transparent;-webkit-text-stroke:1px rgba(255,160,215,.45);text-shadow:none}
  .neon svg{position:absolute;left:0;top:0;overflow:visible}

  /* post-it */
  .postit{left:234px;top:466px;width:142px;height:88px;padding:16px 12px 6px;transform:rotate(3deg);
    background:linear-gradient(170deg,#ffe98a 0%,#ffd95c 100%);color:#5a3d12;
    font-family:"Caveat",cursive;font-weight:700;font-size:21px;line-height:.98;
    box-shadow:0 6px 10px rgba(6,3,24,.5),0 1px 2px rgba(0,0,0,.35)}
  .postit::before{content:"";position:absolute;left:50%;top:-8px;width:50px;height:15px;margin-left:-25px;transform:rotate(-2deg);
    background:rgba(255,250,235,.55);box-shadow:0 1px 2px rgba(0,0,0,.25)}
  .postit::after{content:"";position:absolute;right:0;bottom:0;width:18px;height:18px;
    background:linear-gradient(315deg,rgba(0,0,0,.20) 0%,rgba(0,0,0,0) 50%),linear-gradient(315deg,#f3dc7a 50%,transparent 50%)}

  /* pill */
  .pill{left:34px;top:30px;height:28px;padding:0 12px 0 9px;display:flex;align-items:center;gap:6px;border-radius:20px;
    background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(6px);
    box-shadow:0 4px 12px rgba(0,0,0,.3);font-weight:600;font-size:12px;letter-spacing:.2px;color:#e9ddff;white-space:nowrap}
  .pill b{color:#ffcf8a;font-weight:700}

  /* radio */
  .radio{left:10px;top:608px;width:370px;height:160px;border-radius:18px 18px 12px 12px;padding:8px 12px 8px;
    background:linear-gradient(180deg,#6a4f9a 0%,#4b3a7c 40%,#3a2c63 100%);
    box-shadow:0 2px 0 #8f78c4 inset,0 -5px 10px rgba(0,0,0,.35) inset,0 12px 18px rgba(3,1,18,.6);
    border:1px solid rgba(190,165,255,.25)}
  .radio::before{content:"";position:absolute;left:24px;right:24px;top:-8px;height:10px;border-radius:8px 8px 0 0;
    background:linear-gradient(180deg,#8f78c4,#5b4690);box-shadow:0 -2px 5px rgba(0,0,0,.3)}
  .radio .top{display:flex;align-items:center;justify-content:space-between;height:16px;font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:#e7d8ff;opacity:.92;white-space:nowrap}
  .radio .live{display:flex;align-items:center;gap:5px;color:#ff9cc4}
  .radio .live i{width:7px;height:7px;border-radius:50%;background:#ff5d9c;box-shadow:0 0 6px #ff3d86,0 0 12px #ff3d86}
  .radio .row{display:flex;gap:10px;margin-top:6px}
  .grille{width:66px;height:66px;border-radius:50%;flex:none;position:relative;
    background:radial-gradient(circle,#1e1540 0 1.2px,transparent 1.6px) 0 0/7px 7px,radial-gradient(circle at 40% 35%,#52418a,#2b2050);
    box-shadow:inset 0 3px 8px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.2);align-self:center}
  .visor{flex:1;height:66px;border-radius:10px;padding:8px 11px 7px;position:relative;overflow:hidden;
    background:linear-gradient(180deg,#2a1a14,#1a0f10);border:2px solid #20163f;
    box-shadow:inset 0 0 16px rgba(255,150,40,.28),inset 0 2px 6px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.18)}
  .visor::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.12) 0,rgba(255,255,255,0) 40%);pointer-events:none}
  .visor .ti{font-weight:700;font-size:14px;color:#ffc46b;text-shadow:0 0 6px rgba(255,160,50,.8);white-space:nowrap;line-height:1.1}
  .visor .ar{font-size:11.5px;font-weight:600;color:#d98f4a;margin-top:1px;text-shadow:0 0 5px rgba(255,140,40,.6)}
  .eq{position:absolute;right:9px;top:9px;display:flex;gap:2px;align-items:flex-end;height:20px}
  .eq i{width:3px;border-radius:2px;background:linear-gradient(0deg,#ff8f3a,#ffd27a);box-shadow:0 0 4px rgba(255,150,50,.8)}
  .prog{position:absolute;left:11px;right:11px;bottom:5px;font-size:11px;font-weight:700;color:#d98f4a;display:flex;align-items:center;gap:7px}
  .prog .bar{flex:1;height:3px;border-radius:3px;background:rgba(255,160,60,.22);position:relative}
  .prog .bar i{position:absolute;left:0;top:0;bottom:0;width:41%;border-radius:3px;background:linear-gradient(90deg,#ff8f3a,#ffcf7a);box-shadow:0 0 6px rgba(255,150,50,.9)}
  .prog .bar i::after{content:"";position:absolute;right:-4px;top:-3px;width:9px;height:9px;border-radius:50%;background:#ffe3a8;box-shadow:0 0 6px #ffb04a}
  .btns{display:flex;align-items:center;gap:12px;margin-top:9px;padding-left:2px}
  .btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
    background:linear-gradient(180deg,#8a73c4,#4f3d86);box-shadow:0 3px 0 #2d2056,0 4px 7px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35)}
  .btn.play{width:48px;height:48px;background:linear-gradient(180deg,#ffc977,#f08a3a);box-shadow:0 3px 0 #a14f1c,0 5px 10px rgba(0,0,0,.5),0 0 14px rgba(255,160,60,.45),inset 0 1px 0 rgba(255,255,255,.6)}
  .btn svg{display:block}
  .sp{flex:1}
  .knob{width:30px;height:30px;border-radius:50%;background:conic-gradient(from 20deg,#6d57a8,#a58fe0,#5b4690,#7f69bb,#6d57a8);box-shadow:0 3px 5px rgba(0,0,0,.5),inset 0 0 0 3px rgba(30,20,70,.55);position:relative}
  .knob::after{content:"";position:absolute;left:50%;top:3px;width:3px;height:9px;margin-left:-1.5px;border-radius:2px;background:#ffd9a0;transform-origin:50% 12px;transform:rotate(40deg)}

  /* adesivos / info */
  .st{position:absolute;top:774px;display:flex;align-items:center;gap:6px;height:32px;padding:0 13px 0 5px;border-radius:20px;background:#fdf8ee;color:#3d2c63;font-weight:700;font-size:13.5px;
      border:2px solid #fff;box-shadow:0 0 0 1px rgba(60,40,110,.25),0 4px 7px rgba(0,0,0,.45);white-space:nowrap}
  .st .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
  .info{left:10px;top:811px;width:324px;height:28px;display:flex;align-items:center;justify-content:space-between}
  .tag{height:28px;padding:0 12px 0 9px;display:flex;align-items:center;gap:7px;border-radius:6px;font-weight:700;font-size:13px;letter-spacing:.2px;color:#3b2810;
    background:linear-gradient(135deg,#f0d8a0 0%,#c9a465 45%,#e8cf93 70%,#b58f4f 100%);box-shadow:0 4px 8px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.4)}
  .on{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:#d9ccf5}
  .on i{width:8px;height:8px;border-radius:50%;background:#4dff9a;box-shadow:0 0 0 2px rgba(0,0,0,.25),0 0 8px #3dff8a}

  .selo{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
    background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.28);color:#ffe3a8;font-size:17px;backdrop-filter:blur(4px);opacity:.9}
</style>
</head>
<body>

<!-- ===== camada 1: parede, janela, mesa ===== -->
<svg class="layer" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1546"/><stop offset=".6" stop-color="#241a57"/><stop offset="1" stop-color="#1a1240"/></linearGradient>
    <pattern id="stripes" width="40" height="10" patternUnits="userSpaceOnUse"><rect width="20" height="10" fill="rgba(255,255,255,.028)"/></pattern>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1.1" fill="rgba(200,180,255,.07)"/><circle cx="23" cy="23" r="1.1" fill="rgba(200,180,255,.07)"/></pattern>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0829"/><stop offset=".45" stop-color="#25175a"/><stop offset=".78" stop-color="#6a3a8c"/><stop offset="1" stop-color="#d56f8e"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6e4630"/><stop offset=".6" stop-color="#8a5a3c"/><stop offset="1" stop-color="#6e4630"/></linearGradient>
    <linearGradient id="woodFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5c3b2c"/><stop offset="1" stop-color="#2f1d1c"/></linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4b3a74"/><stop offset="1" stop-color="#2a1f4d"/></linearGradient>
    <radialGradient id="moonGlow"><stop offset="0" stop-color="#fff2c8" stop-opacity=".55"/><stop offset=".4" stop-color="#ffe6a8" stop-opacity=".14"/><stop offset="1" stop-color="#ffe6a8" stop-opacity="0"/></radialGradient>
    <radialGradient id="horizon" cx=".5" cy="1" r=".7"><stop offset="0" stop-color="#ff8fa8" stop-opacity=".5"/><stop offset="1" stop-color="#ff8fa8" stop-opacity="0"/></radialGradient>
    <radialGradient id="drop" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset=".3" stop-color="#cfd9ff" stop-opacity=".18"/><stop offset="1" stop-color="#9fb0ff" stop-opacity=".12"/></radialGradient>
    <clipPath id="glass"><rect x="24" y="22" width="342" height="178" rx="3"/></clipPath>
    <mask id="crescent"><rect x="260" y="20" width="120" height="100" fill="#000"/><circle cx="326" cy="62" r="19" fill="#fff"/><circle cx="334" cy="56" r="17" fill="#000"/></mask>
    <filter id="blur4"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="blur1"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>

  <rect width="390" height="844" fill="url(#wall)"/>
  <rect width="390" height="620" fill="url(#stripes)"/>
  <rect width="390" height="620" fill="url(#dots)"/>

  <!-- janela -->
  <g clip-path="url(#glass)">
    <rect x="24" y="22" width="342" height="178" fill="url(#sky)"/>
    <g id="stars"></g>
    <circle cx="326" cy="62" r="64" fill="url(#moonGlow)"/>
    <g mask="url(#crescent)"><circle cx="326" cy="62" r="19" fill="#fff6d8"/></g>
    <g fill="#7a5aa8" opacity=".35" filter="url(#blur4)"><ellipse cx="120" cy="96" rx="60" ry="8"/><ellipse cx="270" cy="120" rx="70" ry="7"/></g>
    <rect x="24" y="90" width="342" height="110" fill="url(#horizon)"/>
    <g id="city"></g>
    <g id="rain"></g>
    <g id="drops"></g>
    <polygon points="44,22 84,22 24,120 24,84" fill="#fff" opacity=".07"/>
    <polygon points="110,22 126,22 24,170 24,150" fill="#fff" opacity=".05"/>
    <polygon points="300,200 330,200 366,130 366,98" fill="#fff" opacity=".05"/>
    <rect x="24" y="22" width="342" height="178" fill="rgba(255,170,80,.05)"/>
  </g>
  <g>
    <rect x="10" y="8" width="370" height="14" fill="url(#frame)"/>
    <rect x="10" y="200" width="370" height="14" fill="url(#frame)"/>
    <rect x="10" y="8" width="14" height="206" fill="url(#frame)"/>
    <rect x="366" y="8" width="14" height="206" fill="url(#frame)"/>
    <rect x="186" y="22" width="8" height="178" fill="url(#frame)"/>
    <rect x="24" y="106" width="342" height="8" fill="url(#frame)"/>
    <path d="M10 8H380M10 22H380M10 200H380" stroke="rgba(190,170,255,.28)" stroke-width="1" fill="none"/>
    <rect x="2" y="212" width="386" height="10" rx="2" fill="#5c4a8a"/>
    <rect x="2" y="212" width="386" height="2" fill="rgba(255,255,255,.22)"/>
    <rect x="2" y="222" width="386" height="6" fill="rgba(0,0,0,.3)"/>
  </g>

  <!-- mesa -->
  <rect x="0" y="596" width="390" height="48" fill="url(#wood)"/>
  <g stroke="rgba(30,15,10,.25)" stroke-width=".8" fill="none"><path d="M0 608C100 606 200 611 390 607"/><path d="M0 620C120 623 250 618 390 621"/><path d="M0 632C90 630 220 634 390 631"/></g>
  <rect x="0" y="596" width="390" height="2" fill="rgba(255,210,160,.28)"/>
  <rect x="0" y="644" width="390" height="7" fill="#a06b48"/>
  <rect x="0" y="644" width="390" height="1.5" fill="rgba(255,220,180,.35)"/>
  <rect x="0" y="651" width="390" height="193" fill="url(#woodFront)"/>
  <rect x="0" y="651" width="390" height="14" fill="rgba(0,0,0,.35)"/>
  <rect x="6" y="668" width="378" height="168" rx="5" fill="#3d2723" stroke="rgba(255,200,150,.25)" stroke-width="1"/>
  <rect x="14" y="676" width="362" height="152" rx="3" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="1.5"/>
</svg>

<!-- varal -->
<svg class="layer" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bulb"><stop offset="0" stop-color="#fff3c9"/><stop offset=".35" stop-color="#ffd27a"/><stop offset="1" stop-color="#ffb04a" stop-opacity="0"/></radialGradient>
    <radialGradient id="bulbP"><stop offset="0" stop-color="#ffe0f0"/><stop offset=".35" stop-color="#ff9cc9"/><stop offset="1" stop-color="#ff5fa8" stop-opacity="0"/></radialGradient>
  </defs>
  <g id="wireG"></g>
</svg>

<div class="abs pill"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="#ffe3a8"/></svg><span>Recife · <b>03:12</b> da manhã</span></div>

<div class="abs neon">
  <svg width="170" height="70" viewBox="0 0 170 70"><g fill="#8a78c0"><circle cx="8" cy="10" r="2.6"/><circle cx="140" cy="6" r="2.6"/></g></svg>
  <div class="t off">Marina</div>
  <div class="t">Marina</div>
  <svg width="170" height="70" viewBox="0 0 170 70">
    <path d="M10 56C40 62 90 64 140 58" stroke="#ffe3f3" stroke-width="2" fill="none" stroke-linecap="round" style="filter:drop-shadow(0 0 3px #ff9bd6) drop-shadow(0 0 7px #ff3fa8)"/>
    <path d="M158 6l2.6 6.4 6.4 2.6-6.4 2.6-2.6 6.4-2.6-6.4-6.4-2.6 6.4-2.6z" fill="#ffe3f3" style="filter:drop-shadow(0 0 3px #ff9bd6) drop-shadow(0 0 7px #ff3fa8)"/>
  </svg>
</div>

<div class="abs postit">Sou feita de mar, café e dias de sol.</div>

<div class="quadro">
  <div class="luz"></div>
  <svg class="lamp" viewBox="0 0 210 44"><defs><linearGradient id="brassL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5e1b0"/><stop offset="1" stop-color="#a9803f"/></linearGradient></defs>
    <path d="M105 0V12M105 12C70 12 52 20 44 34M105 12C140 12 158 20 166 34" stroke="#b58d52" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="30" y="30" width="150" height="10" rx="5" fill="url(#brassL)"/><ellipse cx="105" cy="41" rx="62" ry="2.5" fill="#ffe3a8" opacity=".9"/></svg>
  <div class="mat">
    <div class="foto"><img src="../clientes/exemplo/perfil-feminino.jpg" alt=""></div>
    <div class="nome">Marina Costa</div>
  </div>
  <div class="vidro"></div>
</div>

<!-- ===== camada 2: objetos da mesa ===== -->
<svg class="layer" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fe3ff"/><stop offset=".55" stop-color="#7a8cff"/><stop offset="1" stop-color="#d97bff"/></linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c26a4a"/><stop offset=".5" stop-color="#e08a62"/><stop offset="1" stop-color="#9c4e38"/></linearGradient>
    <linearGradient id="mug" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f1e7d6"/><stop offset=".6" stop-color="#d8c8ae"/><stop offset="1" stop-color="#a8977e"/></linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9b57a"/><stop offset=".5" stop-color="#f5e1b0"/><stop offset="1" stop-color="#b58d52"/></linearGradient>
    <radialGradient id="bulbGlow"><stop offset="0" stop-color="#fff6d0"/><stop offset=".3" stop-color="#ffd37a"/><stop offset="1" stop-color="#ff9a30" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="steamBlur"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <g fill="rgba(10,4,22,.55)" filter="url(#soft)">
    <ellipse cx="164" cy="600" rx="62" ry="5"/><ellipse cx="330" cy="601" rx="62" ry="5"/><ellipse cx="262" cy="600" rx="14" ry="3"/><ellipse cx="40" cy="600" rx="40" ry="4"/><ellipse cx="94" cy="600" rx="18" ry="3"/>
  </g>

  <!-- livros -->
  <g>
    <rect x="6" y="584" width="70" height="14" rx="2" fill="#2f5b73"/><rect x="6" y="584" width="70" height="2" fill="rgba(255,255,255,.18)"/><rect x="9" y="591" width="64" height="2" fill="#e8d9b5" opacity=".85"/>
    <rect x="12" y="570" width="62" height="14" rx="2" fill="#b0486a"/><rect x="12" y="570" width="62" height="2" fill="rgba(255,255,255,.2)"/><rect x="20" y="576" width="12" height="2" fill="#ffd9a0" opacity=".8"/>

<script>
(function(){
  var NS='http://www.w3.org/2000/svg';
  function mk(tag,attrs,parent){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
  var seed=11;function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}
  function pick(a){return a[Math.floor(rnd()*a.length)];}

  var st=document.getElementById('stars');
  for(var i=0;i<60;i++){mk('circle',{cx:24+rnd()*342,cy:22+rnd()*110,r:(rnd()<.15?1.3:rnd()*.8+.3).toFixed(2),fill:'#fff',opacity:(.35+rnd()*.6).toFixed(2)},st);}

  var city=document.getElementById('city');
  var layers=[{col:'#3a2a78',min:36,max:80,wmin:16,wmax:34,lit:.10},{col:'#2a1d62',min:50,max:104,wmin:18,wmax:40,lit:.18},{col:'#190f42',min:40,max:118,wmin:22,wmax:46,lit:.28}];
  var lc=['#ffc86b','#ffc86b','#ffc86b','#ff9ac8','#8fe3ff','#ffe6a8'];
  layers.forEach(function(L){
    var x=14,Y=200;
    while(x<366){
      var w=L.wmin+rnd()*(L.wmax-L.wmin),h=L.min+rnd()*(L.max-L.min);
      mk('rect',{x:x,y:Y-h,width:w,height:h,fill:L.col},city);
      if(rnd()<.25)mk('rect',{x:x+w*.45,y:Y-h-9,width:1.4,height:9,fill:L.col},city);
      for(var yy=Y-h+6;yy<Y-4;yy+=8){for(var xx=x+4;xx<x+w-5;xx+=7){if(rnd()<L.lit)mk('rect',{x:xx,y:yy,width:3,height:4,fill:pick(lc),opacity:(.55+rnd()*.45).toFixed(2)},city);}}
      x+=w+(rnd()<.3?rnd()*4:0);
    }
  });
  var g=mk('linearGradient',{id:'fog',x1:0,y1:0,x2:0,y2:1},document.querySelector('defs'));
  mk('stop',{offset:0,'stop-color':'#b36bb5','stop-opacity':0},g);mk('stop',{offset:1,'stop-color':'#b36bb5','stop-opacity':.38},g);
  mk('rect',{x:24,y:150,width:342,height:50,fill:'url(#fog)'},city);

  var rain=document.getElementById('rain');
  for(var i=0;i<120;i++){var x=18+rnd()*360,y=14+rnd()*190,l=9+rnd()*22;
    mk('line',{x1:x,y1:y,x2:x-l*.22,y2:y+l,stroke:'#cfd8ff','stroke-width':(rnd()<.2?1.2:.8),opacity:(.14+rnd()*.3).toFixed(2)},rain);}

  var dr=document.getElementById('drops'),drops=[];
  for(var i=0;i<18;i++){var x=30+rnd()*330,y=30+rnd()*160,r=1.4+rnd()*3;drops.push([x,y,r]);
    if(rnd()<.4){var l=10+rnd()*28;mk('path',{d:'M'+x+' '+(y-l)+'Q'+(x+(rnd()*4-2))+' '+(y-l/2)+' '+x+' '+y,stroke:'rgba(205,220,255,.28)','stroke-width':Math.max(.8,r*.4),fill:'none','stroke-linecap':'round'},dr);}}
  drops.forEach(function(d){
    mk('ellipse',{cx:d[0],cy:d[1],rx:d[2],ry:d[2]*1.25,fill:'url(#drop)',stroke:'rgba(220,230,255,.45)','stroke-width':.5},dr);
    mk('circle',{cx:d[0]-d[2]*.3,cy:d[1]-d[2]*.4,r:Math.max(.5,d[2]*.22),fill:'#fff',opacity:.9},dr);});
  [[70,170,8,'#ffc86b'],[120,160,5,'#ff9ac8'],[290,172,7,'#8fe3ff'],[230,168,5,'#ffc86b']].forEach(function(b){mk('circle',{cx:b[0],cy:b[1],r:b[2],fill:b[3],opacity:.13,filter:'url(#blur1)'},dr);});

  function leaf(parent,x,y,ang,len,col,hi){
    var w=len*.36,g=mk('g',{transform:'translate('+x+' '+y+') rotate('+ang+')'},parent);
    mk('path',{d:'M0 0C'+(len*.25)+' '+(-w)+' '+(len*.8)+' '+(-w*.85)+' '+len+' 0C'+(len*.8)+' '+(w*.85)+' '+(len*.25)+' '+w+' 0 0z',fill:col},g);
    mk('path',{d:'M0 0L'+(len*.96)+' 0',stroke:hi,'stroke-width':.8,opacity:.55,fill:'none'},g);
  }
  var p1=document.getElementById('plant1'),cols=['#3f9a7e','#2f7f6c','#52b08f','#2a6a5f'];
  [[-60,26],[-35,32],[-12,28],[12,30],[36,26],[62,22]].forEach(function(a,i){
    var bx=98,by=577,len=a[1],rad=a[0]*Math.PI/180,ex=bx+Math.sin(rad)*len*1.4,ey=by-Math.cos(rad)*len*1.4;
    mk('path',{d:'M'+bx+' '+by+'Q'+(bx+Math.sin(rad)*len)+' '+(by-len*1.2)+' '+ex+' '+ey,stroke:'#3f9a7e','stroke-width':1.4,fill:'none'},p1);
    leaf(p1,ex,ey,a[0]-90+(a[0]>0?30:-30)+(i%2?20:-20),len*.6,cols[i%4],'#d8ffe9');
  });
  [[84,584,-12],[112,584,14]].forEach(function(t,i){
    mk('path',{d:'M'+t[0]+' '+t[1]+'Q'+(t[0]+t[2])+' '+(t[1]+8)+' '+(t[0]+t[2]*.8)+' '+(t[1]+14),stroke:'#3f9a7e','stroke-width':1.2,fill:'none'},p1);
    leaf(p1,t[0]+t[2]*.8,t[1]+14,90+(t[2]>0?-20:20),10,cols[i],'#d8ffe9');
  });

  var eq=document.getElementById('eq');
  [6,11,16,9,18,13,7,14,10,17,5,12].forEach(function(h){var i=document.createElement('i');i.style.height=h+'px';eq.appendChild(i);});

  /* fio de luzes */
  var nails=[[-10,228],[100,240],[290,232],[400,242]],sag=36;
  var wg=document.getElementById('wireG');
  function bez(p0,c,p2,t){var u=1-t;return [u*u*p0[0]+2*u*t*c[0]+t*t*p2[0],u*u*p0[1]+2*u*t*c[1]+t*t*p2[1]];}
  var d='M'+nails[0][0]+' '+nails[0][1],mids=[];
  for(var i=0;i<3;i++){var a=nails[i],b=nails[i+1],c=[(a[0]+b[0])/2,(a[1]+b[1])/2+sag];d+='Q'+c[0]+' '+c[1]+' '+b[0]+' '+b[1];mids.push(bez(a,c,b,.5));}
  mk('path',{d:d,stroke:'#0f0b26','stroke-width':1.6,fill:'none'},wg);
  for(var i=0;i<3;i++){
    var a=nails[i],b=nails[i+1],c=[(a[0]+b[0])/2,(a[1]+b[1])/2+sag],n=(i==1)?9:6;
    for(var k=1;k<=n;k++){
      var t=k/(n+1),pt=bez(a,c,b,t);
      var hw=(i==1)?96:52; if(Math.abs(pt[0]-mids[i][0])<hw*.5)continue;
      var col=(k%2)?'bulb':'bulbP';
      mk('circle',{cx:pt[0],cy:pt[1]+4,r:8,fill:'url(#'+col+')',opacity:.75},wg);
      mk('ellipse',{cx:pt[0],cy:pt[1]+4,rx:1.8,ry:2.6,fill:(k%2)?'#fff2c4':'#ffd9ec'},wg);
      mk('rect',{x:pt[0]-1.2,y:pt[1]-1,width:2.4,height:2.4,fill:'#0f0b26'},wg);
    }
    mk('circle',{cx:nails[i+1][0],cy:nails[i+1][1],r:2.4,fill:'#8a78c0'},wg);
  }
})();
</script>
