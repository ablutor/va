<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Proposta no celular</title>
  <style>
    /* Mostra a proposta do jeito que aparece num celular de 390×844.
       celular.html?t=01-cafe (com &foto, sem a moldura, para as imagens) */
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #2b2733; }
    iframe { width: 390px; height: 844px; border: 0; display: block; }
    .aparelho { padding: 14px; border-radius: 48px; background: #111; box-shadow: 0 20px 60px #0008; }
    .aparelho iframe { border-radius: 36px; }
    body.foto { display: block; }
    body.foto .aparelho { position: fixed; left: 0; top: 0; padding: 0; border-radius: 0; box-shadow: none; }
    body.foto .aparelho iframe { border-radius: 0; }
  </style>
</head>
<body>
  <div class="aparelho"><iframe></iframe></div>
  <script>
    var params = new URLSearchParams(location.search);
    if (params.has("foto")) document.body.classList.add("foto");
    params.delete("foto");
    document.querySelector("iframe").src = "index.html?" + params;
  </script>
</body>
</html>
