  <!-- Desenhos usados mais de uma vez: a pegada e o bichinho -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- Pegada de Chikorita: patinha de dinossauro com três dedinhos pontudos -->
      <symbol id="pegada" viewBox="0 0 100 100">
        <g fill="currentColor">
          <path d="M50 52 C64 52 72 64 70 78 C68 90 58 92 50 90 C42 92 32 90 30 78 C28 64 36 52 50 52 Z"/>
          <path d="M30 56 C22 46 18 34 20 22 C28 30 36 42 40 52 Z"/>
          <path d="M44 48 C44 34 46 20 50 8 C54 20 56 34 56 48 Z"/>
          <path d="M70 56 C78 46 82 34 80 22 C72 30 64 42 60 52 Z"/>
        </g>
      </symbol>

      <!-- Pele verde-clarinha, folha e brotinhos do pescoço -->
      <radialGradient id="ck-pele" cx="40%" cy="30%" r="75%">
        <stop offset="0" stop-color="var(--pele-luz)"/>
        <stop offset=".55" stop-color="var(--pele)"/>
        <stop offset="1" stop-color="var(--pele-sombra)"/>
      </radialGradient>
      <linearGradient id="ck-folha" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="var(--folha-sombra)"/>
        <stop offset=".5" stop-color="var(--folha)"/>
        <stop offset="1" stop-color="var(--folha-luz)"/>
      </linearGradient>
      <radialGradient id="ck-broto" cx="40%" cy="30%" r="80%">
        <stop offset="0" stop-color="var(--folha-luz)"/>
        <stop offset="1" stop-color="var(--folha-sombra)"/>
      </radialGradient>
      <radialGradient id="ck-olho" cx="50%" cy="65%" r="60%">
        <stop offset="0" stop-color="var(--olho-luz)"/>
        <stop offset="1" stop-color="var(--olho)"/>
      </radialGradient>
      <!-- Contorno fino: encolhe só a borda de fora da silhueta preta -->
      <filter id="ck-contorno-fino" x="-5%" y="-5%" width="110%" height="110%">
        <feMorphology operator="erode" radius=".3"/>
      </filter>
      <!-- A borda da folha é mais fina no desenho, então encolhe menos -->
      <filter id="ck-contorno-folha" x="-5%" y="-5%" width="110%" height="110%">
        <feMorphology operator="erode" radius=".6"/>
      </filter>
    </defs>
  </svg>
