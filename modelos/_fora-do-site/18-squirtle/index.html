<!DOCTYPE html>
<html lang="pt-BR" data-cores="original masculino feminino feminino-2">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xatspace · Squirtle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../core/base.css">
  <link rel="stylesheet" href="../../_fofinhos/fofinhos.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Desenhos usados mais de uma vez: a pegada e o bichinho -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- Pegada de Squirtle: patinha redondinha de tartaruga com três unhas curtas -->
      <symbol id="pegada" viewBox="0 0 100 100">
        <g fill="currentColor">
          <ellipse cx="50" cy="64" rx="28" ry="26"/>
          <path d="M28 44 C24 36 26 28 30 24 C36 30 38 38 36 44 Z"/>
          <path d="M45 38 C44 30 47 22 50 18 C53 22 56 30 55 38 Z"/>
          <path d="M72 44 C76 36 74 28 70 24 C64 30 62 38 64 44 Z"/>
        </g>
      </symbol>

      <!-- Pele azul-clara, casco marrom e barriga creme -->
      <radialGradient id="sq-pele" cx="40%" cy="30%" r="75%">
        <stop offset="0" stop-color="var(--pele-luz)"/>
        <stop offset=".55" stop-color="var(--pele)"/>
        <stop offset="1" stop-color="var(--pele-sombra)"/>
      </radialGradient>
      <radialGradient id="sq-casco" cx="40%" cy="30%" r="80%">
        <stop offset="0" stop-color="var(--casco-luz)"/>
        <stop offset="1" stop-color="var(--casco)"/>
      </radialGradient>
      <radialGradient id="sq-barriga" cx="45%" cy="30%" r="80%">
        <stop offset="0" stop-color="var(--barriga-luz)"/>
        <stop offset="1" stop-color="var(--barriga)"/>
      </radialGradient>
      <radialGradient id="sq-olho" cx="50%" cy="65%" r="60%">
        <stop offset="0" stop-color="var(--olho-luz)"/>
        <stop offset="1" stop-color="var(--olho)"/>
      </radialGradient>
      <clipPath id="sq-barriga-forma"><ellipse cx="190" cy="322" rx="76" ry="66"/></clipPath>
    </defs>
  </svg>

  <!-- O bichinho: o fofinhos.js copia este desenho para dentro de cada .bicho -->
  <template id="bichinho">
    <svg viewBox="0 0 380 400">
        <!-- bolhas grandes subindo ao redor (não recebem clique) -->
        <g class="bolhas-fundo" pointer-events="none" fill="var(--bolha)" stroke="var(--bolha-borda)" stroke-width="2">
          <g transform="translate(-50 330)"><g class="bolhona b1"><circle r="16"/><circle cx="-5" cy="-5" r="4" fill="#fff" stroke="none"/></g></g>
          <g transform="translate(20 380)"><g class="bolhona b2"><circle r="9"/><circle cx="-3" cy="-3" r="2.4" fill="#fff" stroke="none"/></g></g>
          <g transform="translate(400 360)"><g class="bolhona b3"><circle r="13"/><circle cx="-4" cy="-4" r="3.2" fill="#fff" stroke="none"/></g></g>
          <g transform="translate(450 300)"><g class="bolhona b4"><circle r="8"/><circle cx="-2.5" cy="-2.5" r="2" fill="#fff" stroke="none"/></g></g>
        </g>
        <g class="pulo-todo">
          <g class="corpo-todo">
            <!-- rabinho enroladinho -->
            <g class="rabo">
              <path d="M258 352 C330 370 378 330 368 280 C360 240 306 238 304 274 C302 298 330 302 338 284" fill="none" stroke="var(--pele-sombra)" stroke-width="26" stroke-linecap="round"/>
              <path d="M258 352 C330 370 378 330 368 280 C360 240 306 238 304 274 C302 298 330 302 338 284" fill="none" stroke="url(#sq-pele)" stroke-width="20" stroke-linecap="round"/>
              <path d="M300 354 C334 352 358 330 360 300" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".4"/>
            </g>
            <!-- pezinhos -->
            <ellipse cx="126" cy="382" rx="40" ry="18" fill="url(#sq-pele)"/>
            <ellipse cx="254" cy="382" rx="40" ry="18" fill="url(#sq-pele)"/>
            <!-- casco marrom com a borda creme -->
            <ellipse cx="190" cy="318" rx="116" ry="80" fill="url(#sq-casco)"/>
            <ellipse cx="190" cy="320" rx="96" ry="74" fill="var(--borda-casco)"/>
            <!-- barriga creme com os gomos -->
            <ellipse cx="190" cy="322" rx="76" ry="66" fill="url(#sq-barriga)"/>
            <g clip-path="url(#sq-barriga-forma)" fill="none" stroke="var(--barriga-linha)" stroke-width="3" stroke-linecap="round">
              <path d="M190 256 L190 390"/>
              <path d="M110 300 Q190 314 270 300"/>
              <path d="M110 340 Q190 354 270 340"/>
            </g>
            <!-- bracinhos -->
            <ellipse cx="98" cy="300" rx="20" ry="32" transform="rotate(26 98 300)" fill="url(#sq-pele)"/>
            <ellipse cx="282" cy="300" rx="20" ry="32" transform="rotate(-26 282 300)" fill="url(#sq-pele)"/>
            <!-- cabeça -->
            <ellipse cx="190" cy="180" rx="118" ry="104" fill="url(#sq-pele)"/>
            <!-- bochechas -->
            <ellipse cx="108" cy="226" rx="22" ry="12" fill="var(--bochecha)" opacity=".6"/>
            <ellipse cx="272" cy="226" rx="22" ry="12" fill="var(--bochecha)" opacity=".6"/>
            <!-- olhos grandes castanho-avermelhados -->
            <g class="olhos-abertos">
              <ellipse cx="138" cy="186" rx="20" ry="25" fill="url(#sq-olho)"/>
              <ellipse cx="242" cy="186" rx="20" ry="25" fill="url(#sq-olho)"/>
              <ellipse cx="138" cy="189" rx="11" ry="15" fill="var(--pupila)"/>
              <ellipse cx="242" cy="189" rx="11" ry="15" fill="var(--pupila)"/>
              <circle cx="145" cy="176" r="7.5" fill="#fff"/>
              <circle cx="249" cy="176" r="7.5" fill="#fff"/>
              <circle cx="132" cy="199" r="3" fill="#fff"/>
              <circle cx="236" cy="199" r="3" fill="#fff"/>
            </g>
            <g class="olhos-felizes" fill="none" stroke="var(--pupila)" stroke-width="6" stroke-linecap="round">
              <path d="M120 192 q18 -22 36 0"/>
              <path d="M224 192 q18 -22 36 0"/>
            </g>
            <!-- sorrisão aberto -->
            <path d="M160 224 Q190 260 220 224 Q190 232 160 224 Z" fill="var(--boca)"/>
            <path d="M174 238 Q190 252 206 238 Q190 234 174 238 Z" fill="var(--lingua)"/>
            <path d="M152 222 Q190 236 228 222" fill="none" stroke="var(--pupila)" stroke-width="3.5" stroke-linecap="round"/>
            <!-- bolhinhas saindo da boca -->
            <g class="bolhinhas" pointer-events="none" fill="var(--bolha)" stroke="var(--bolha-borda)" stroke-width="2">
              <g transform="translate(226 232)"><circle class="bolhinha" r="7"/></g>
              <g transform="translate(232 226)"><circle class="bolhinha" r="5"/></g>
              <g transform="translate(228 230)"><circle class="bolhinha" r="9"/></g>
            </g>
          </g>
        </g>
    </svg>
  </template>

  <!-- Fundo da tela toda, com rastros de pegadas -->
  <div class="xs-fundo fundo"><div class="pegadas" data-pegadas="6"></div></div>

  <!-- Desktop: desenhado em 1920×900 -->
  <div class="xs-palco desk" data-largura="1920" data-altura="900">
    <section class="perfil card">
      <div class="topo">
        <div class="foto" data-xs-bg="fotos.perfil"></div>
        <div>
          <h1 class="nome" data-xs="nome">Albert</h1>
          <div class="sobrenome nome" data-xs="sobrenome">Alves</div>
        </div>
      </div>
      <div class="linha-online">
        <span class="online" data-xs-se="online">online</span>
      </div>
      <p class="local" data-xs-se="local">📍 <span data-xs="local"></span></p>
      <div class="cap">Meu mundinho</div>
      <ul class="chips" data-gostos style="margin-top:10px"></ul>
      <a class="insta" data-xs-link="instagramUrl" data-xs-se="instagram">@<span data-xs="instagram"></span> ↗</a>
    </section>

    <div class="cena">
      <p class="balao" data-balao></p>
      <button class="bicho" type="button" aria-label="Fazer carinho no Squirtle"></button>
      <div class="chao"></div>
    </div>

    <section class="lado">
      <div class="card carinho">
        <span class="num" data-carinhos>0</span>
        <div><span class="cap">Carinhos no Squirtle</span><p>Clica nele para dar mais um ♥</p></div>
      </div>
      <div class="card citacao" data-xs-se="citacao.texto">
        <span class="cap">Frase favorita</span>
        <p data-xs="citacao.texto"></p>
        <small>— <span data-xs="citacao.autor"></span></small>
      </div>
      <div class="card player" data-xs-player>
        <span class="xs-controles">
          <button class="xs-pular" type="button" data-xs-anterior aria-label="Música anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM19 5v14L9 12z"/></svg></button>
          <button class="play" type="button" data-xs-tocar aria-label="Tocar música">
            <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
          </button>
          <button class="xs-pular" type="button" data-xs-proxima aria-label="Próxima música"><svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM5 5v14l10-7z"/></svg></button>
        </span>
        <div class="info">
          <b data-xs="musica.titulo"></b><i data-xs="musica.artista"></i>
          <div class="barra"><span data-xs-barra></span></div>
        </div>
        <span class="eq"><i></i><i></i><i></i><i></i></span>
      </div>
    </section>
  </div>

  <!-- Mobile: desenhado em 390×844 -->
  <div class="xs-palco xs-palco--mobile mob" data-largura="390" data-altura="844">
    <div class="cabeca">
      <div class="foto" data-xs-bg="fotos.perfil"></div>
      <div>
        <h1 class="nome" data-xs="nome">Albert</h1>
        <span class="online" data-xs-se="online">online</span>
      </div>
    </div>

    <div class="cena">
      <p class="balao" data-balao></p>
      <button class="bicho" type="button" aria-label="Fazer carinho no Squirtle"></button>
      <div class="chao"></div>
    </div>

    <section class="perfil card">
      <div class="cap" style="margin-bottom:8px">Meu mundinho</div>
      <ul class="chips" data-gostos></ul>
      <div class="rodape">
        <div class="carinho"><span class="num" data-carinhos>0</span><p>carinhos ♥</p></div>
        <a class="insta" data-xs-link="instagramUrl" data-xs-se="instagram">@<span data-xs="instagram"></span></a>
      </div>
    </section>

    <div class="card player" data-xs-player>
      <span class="xs-controles">
        <button class="xs-pular" type="button" data-xs-anterior aria-label="Música anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM19 5v14L9 12z"/></svg></button>
        <button class="play" type="button" data-xs-tocar aria-label="Tocar música">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
        </button>
        <button class="xs-pular" type="button" data-xs-proxima aria-label="Próxima música"><svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM5 5v14l10-7z"/></svg></button>
      </span>
      <div class="info">
        <b data-xs="musica.titulo"></b><i data-xs="musica.artista"></i>
        <div class="barra"><span data-xs-barra></span></div>
      </div>
      <span class="eq"><i></i><i></i><i></i><i></i></span>
    </div>
  </div>

  <script src="../../../core/config.js"></script>
  <script src="../../../core/xatspace.js"></script>
  <script src="../../_fofinhos/fofinhos.js"></script>
  <script src="script.js"></script>
</body>
</html>
