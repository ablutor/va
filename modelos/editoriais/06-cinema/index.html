<!DOCTYPE html>
<html lang="pt-BR" data-cores="original masculino feminino feminino-2 pastel-rosa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xatspace · Cinema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../core/base.css">
  <link rel="stylesheet" href="../../../core/cores.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- A faixa da cena ocupa a largura toda da tela, fora do palco -->
  <div class="xs-fundo"><div class="scope ph" data-xs-bg="fotos.cenario"></div></div>

  <!-- Desktop: desenhado em 1920×900 -->
  <div class="xs-palco desk" data-largura="1920" data-altura="900">
    <div class="pre">xatspace apresenta · um filme de <span data-xs="nomeCompleto"></span></div>
    <div class="rate">LIVRE · <span data-ano>2026</span><span data-xs-se="online"> · ● ONLINE</span></div>
    <div class="title"><small><span data-xs="nomeCompleto"></span> em</small><h1 class="serif"><em data-xs="titulo"></em></h1></div>
    <div class="sub">— <span data-xs="frase"></span></div>
    <div class="credits">
      <div><span>Locação</span><b data-xs="local"></b></div>
      <div><span>Direção de fotografia</span><b data-xs="nomeCompleto"></b></div>
      <div><span>Gêneros</span><b data-xs-lista="gostos" data-xs-sep=" · "></b></div>
      <div data-xs-se="instagram"><span>Contato</span><b><a data-xs-link="instagramUrl">@<span data-xs="instagram"></span></a></b></div>
    </div>
    <div class="player" data-xs-player>
      <span class="xs-controles">
        <button class="xs-pular" type="button" data-xs-anterior aria-label="Música anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM19 5v14L9 12z"/></svg></button>
        <button class="play" type="button" data-xs-tocar aria-label="Tocar música">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
        </button>
        <button class="xs-pular" type="button" data-xs-proxima aria-label="Próxima música"><svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM5 5v14l10-7z"/></svg></button>
      </span>
      <div class="info">Trilha sonora original · <span data-xs="musica.titulo"></span> — <span data-xs="musica.artista"></span></div>
      <div class="line"><span data-xs-barra></span></div>
      <div class="tempo" data-xs-tempo>0:00</div>
    </div>
  </div>

  <!-- Mobile: desenhado em 390×844 -->
  <div class="xs-palco xs-palco--mobile mob" data-largura="390" data-altura="844">
    <div class="pre">um filme de <span data-xs="nomeCompleto"></span></div>
    <div class="scope ph" data-xs-bg="fotos.cenario"><div class="sub">— <span data-xs="frase"></span></div></div>
    <div class="title"><small><span data-xs="nomeCompleto"></span> em</small><h1 class="serif"><em data-xs="titulo"></em></h1></div>
    <div class="credits">
      <div><span>Locação</span><b data-xs="local"></b></div>
      <div><span>Fotografia</span><b data-xs="nomeCompleto"></b></div>
      <div><span>Gêneros</span><b data-xs-lista="gostos" data-xs-sep=" · "></b></div>
      <div data-xs-se="instagram"><span>Contato</span><b><a data-xs-link="instagramUrl">@<span data-xs="instagram"></span></a></b></div>
      <div class="status" data-xs-se="online"><span>Status</span><b>● online no xat</b></div>
    </div>
    <div class="player" data-xs-player>
      <span class="xs-controles">
        <button class="xs-pular" type="button" data-xs-anterior aria-label="Música anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM19 5v14L9 12z"/></svg></button>
        <button class="play" type="button" data-xs-tocar aria-label="Tocar música">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
        </button>
        <button class="xs-pular" type="button" data-xs-proxima aria-label="Próxima música"><svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM5 5v14l10-7z"/></svg></button>
      </span>
      <div class="info">Trilha sonora original<br><b data-xs="musica.titulo"></b></div>
      <div class="line"><span data-xs-barra></span></div>
    </div>
  </div>

  <script src="../../../core/config.js"></script>
  <script src="../../../core/xatspace.js"></script>
  <script src="script.js"></script>
</body>
</html>
