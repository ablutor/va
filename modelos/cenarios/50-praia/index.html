<!DOCTYPE html>
<html lang="pt-BR" data-cores="original masculino feminino">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xatspace · Praia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../core/base.css">
  <link rel="stylesheet" href="../../../core/cores.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- A própria praia, desfocada, cobre a tela atrás do cartão -->
  <div class="xs-fundo fundo"></div>

  <!-- Desktop: desenhado em 1920×900 -->
  <div class="xs-palco desk" data-largura="1920" data-altura="900">
    <div class="cartao">
      <div class="painel">
        <span class="etiqueta" data-xs-se="local"><svg viewBox="0 0 24 24"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg><span data-xs="local"></span></span>
        <div class="clima"><span>pôr do sol<b>17h48</b></span><span>água<b>26 °C</b></span></div>
      </div>
      <div class="conteudo">
        <div class="topo">
          <div class="foto"><div class="ph" data-xs-bg="fotos.perfil"></div><i class="selo"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-9.2-8.6C1.2 8.2 3 4.8 6.3 4.6c2-.1 3.7 1 4.6 2.6.9-1.6 2.6-2.7 4.6-2.6 3.3.2 5.1 3.6 3.5 6.8C19 15.6 12 20 12 20z"/></svg></i></div>
          <div class="nome">
            <span class="cap">bem-vind<span data-xs="o">o</span> à minha praia</span>
            <h1 data-xs="nome">Albert</h1>
          </div>
        </div>
        <div class="chips">
          <span class="chip on" data-xs-se="online" hidden><i class="pt"></i>online</span>
          <button class="chip" type="button" data-xs-se="xat" data-copiar>ID <span data-xs="xat"></span><svg viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2.5"/><path d="M5 15.5V6.5A1.5 1.5 0 0 1 6.5 5h9"/></svg></button>
          <a class="chip" data-xs-se="instagram" data-xs-link="instagramUrl"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.8"/></svg><span>@<span data-xs="instagram"></span></span></a>
        </div>
        <p class="bio" data-xs="frase"></p>
        <blockquote class="citacao" data-xs-se="citacao.texto"><span data-xs="citacao.texto"></span><small data-xs="citacao.autor"></small></blockquote>
      </div>
      <div class="player" data-xs-player>
        <span class="xs-controles">
          <button class="xs-pular" type="button" data-xs-anterior aria-label="Música anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM19 5v14L9 12z"/></svg></button>
          <button class="play" type="button" data-xs-tocar aria-label="Tocar música">
            <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
          </button>
          <button class="xs-pular" type="button" data-xs-proxima aria-label="Próxima música"><svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM5 5v14l10-7z"/></svg></button>
        </span>
        <div class="info"><b data-xs="musica.titulo"></b><span data-xs="musica.artista"></span></div>
        <span class="tempo"><span data-xs-tempo>0:00</span> / <span data-xs-duracao>0:00</span></span>
        <div class="onda" data-barras="64"></div>
      </div>
    </div>
  </div>

  <!-- Mobile: desenhado em 390×844 -->
  <div class="xs-palco xs-palco--mobile mob" data-largura="390" data-altura="844">
    <div class="painel">
      <span class="etiqueta" data-xs-se="local"><svg viewBox="0 0 24 24"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg><span data-xs="local"></span></span>
      <div class="clima"><span>pôr do sol<b>17h48</b></span><span>água<b>26 °C</b></span></div>
    </div>
    <div class="corpo">
      <div class="topo">
        <div class="foto"><div class="ph" data-xs-bg="fotos.perfil"></div></div>
        <div class="nome">
          <span class="cap">bem-vind<span data-xs="o">o</span> à minha praia</span>

        </div>
      </div>
      <div class="chips">
        <span class="chip on" data-xs-se="online" hidden><i class="pt"></i>online</span>
        <button class="chip" type="button" data-xs-se="xat" data-copiar>ID <span data-xs="xat"></span></button>
        <a class="chip" data-xs-se="instagram" data-xs-link="instagramUrl"><span>@<span data-xs="instagram"></span></span></a>
      </div>
      <p class="bio" data-xs="frase"></p>
      <blockquote class="citacao" data-xs-se="citacao.texto"><span data-xs="citacao.texto"></span><small data-xs="citacao.autor"></small></blockquote>
    </div>
    <div class="player" data-xs-player>
      <span class="xs-controles">
        <button class="xs-pular" type="button" data-xs-anterior aria-label="Música anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM19 5v14L9 12z"/></svg></button>
        <button class="play" type="button" data-xs-tocar aria-label="Tocar música">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
        </button>
        <button class="xs-pular" type="button" data-xs-proxima aria-label="Próxima música"><svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM5 5v14l10-7z"/></svg></button>
      </span>
      <div class="info"><b data-xs="musica.titulo"></b><span data-xs="musica.artista"></span></div>
      <div class="onda" data-barras="34"></div>
    </div>
  </div>

  <script src="../../../core/config.js"></script>
  <script src="../../../core/xatspace.js"></script>
  <script src="script.js"></script>

</html>
