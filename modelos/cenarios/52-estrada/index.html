<!DOCTYPE html>
<html lang="pt-BR" data-cores="original masculino feminino">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xatspace · Estrada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../core/base.css">
  <link rel="stylesheet" href="../../../core/cores.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- A estrada, desfocada, cobre a tela atrás dos blocos -->
  <div class="xs-fundo fundo"></div>

  <!-- Desktop: desenhado em 1920×900 -->
  <div class="xs-palco desk" data-largura="1920" data-altura="900">
    <div class="bloco poster">
      <div class="topo"><span>km 482</span><span>sem destino ↗</span></div>
      <div class="sobre">
        <div class="lugar">pé na estrada</div>
        <h1 data-xs="nome">Albert</h1>
        <div class="pilulas">
          <span class="pilula" data-xs-se="online" hidden><i class="on"></i>online</span>
          <button class="pilula" type="button" data-xs-se="xat" data-copiar>ID <span data-xs="xat"></span></button>
          <span class="pilula" data-xs-se="local"><svg viewBox="0 0 24 24"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg><span data-xs="local"></span></span>
        </div>
      </div>
    </div>

    <div class="bloco perfil">
      <div class="foto ph" data-xs-bg="fotos.perfil"></div>
      <div class="txt">
        <div class="rotulo">sobre mim</div>
        <p data-xs="frase"></p>
        <a class="pilula" data-xs-se="instagram" data-xs-link="instagramUrl"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.8"/></svg><span>@<span data-xs="instagram"></span></span></a>
      </div>
    </div>

    <div class="bloco frase" data-xs-se="citacao.texto">
      <q data-xs="citacao.texto"></q>
      <div class="rotulo" data-xs="citacao.autor">frase do perfil</div>
      <span class="placa">US-163</span>
    </div>

    <div class="bloco player" data-xs-player>
      <div class="capa"></div>
      <div class="dados">
        <div class="rotulo">trilha da viagem</div>
        <h3 data-xs="musica.titulo"></h3>
        <span class="artista" data-xs="musica.artista"></span>
        <div class="barra"><i data-xs-barra></i></div>
        <div class="tempos"><span data-xs-tempo>0:00</span><span data-xs-duracao>0:00</span></div>
        <span class="xs-controles">
          <button class="xs-pular" type="button" data-xs-anterior aria-label="Música anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM19 5v14L9 12z"/></svg></button>
          <button class="play" type="button" data-xs-tocar aria-label="Tocar música">
            <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
          </button>
          <button class="xs-pular" type="button" data-xs-proxima aria-label="Próxima música"><svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM5 5v14l10-7z"/></svg></button>
        </span>
      </div>
    </div>
  </div>

  <!-- Mobile: desenhado em 390×844 -->
  <div class="xs-palco xs-palco--mobile mob" data-largura="390" data-altura="844">
    <div class="bloco poster">
      <div class="topo"><span>km 482</span></div>
      <div class="sobre">
        <div class="lugar">pé na estrada</div>
        <h1 data-xs="nome">Albert</h1>
        <div class="pilulas">
          <span class="pilula" data-xs-se="online" hidden><i class="on"></i>online</span>
          <button class="pilula" type="button" data-xs-se="xat" data-copiar>ID <span data-xs="xat"></span></button>
          <span class="pilula" data-xs-se="local"><span data-xs="local"></span></span>
        </div>
      </div>
    </div>
    <div class="bloco perfil">
      <div class="foto ph" data-xs-bg="fotos.perfil"></div>
      <div class="txt"><div class="rotulo">sobre mim</div><p data-xs="frase"></p></div>
    </div>
    <div class="bloco frase" data-xs-se="citacao.texto"><q data-xs="citacao.texto"></q></div>
    <div class="bloco player" data-xs-player>
      <div class="capa"></div>
      <div class="dados"><h3 data-xs="musica.titulo"></h3><span class="artista" data-xs="musica.artista"></span><div class="barra"><i data-xs-barra></i></div></div>
      <span class="xs-controles">
        <button class="play" type="button" data-xs-tocar aria-label="Tocar música">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
        </button>
        <button class="xs-pular" type="button" data-xs-proxima aria-label="Próxima música"><svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM5 5v14l10-7z"/></svg></button>
      </span>
    </div>
  </div>

  <script src="../../../core/config.js"></script>
  <script src="../../../core/xatspace.js"></script>
  <script src="script.js"></script>
</body>
</html>
