<!DOCTYPE html>
<html lang="pt-BR" data-cores="original masculino feminino">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xatspace · Rua noturna</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;700&family=Inter:wght@400;500;600&family=Space+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../core/base.css">
  <link rel="stylesheet" href="../../../core/cores.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- A rua cobre a tela inteira -->
  <div class="xs-fundo fundo"></div>

  <!-- Desktop: desenhado em 1920×900 -->
  <div class="xs-palco desk" data-largura="1920" data-altura="900">
    <div class="hud e"><b>● ao vivo da rua</b><br>23h47 · asfalto molhado<br>a cidade nunca dorme</div>
    <div class="hud d" data-xs-se="local">direto de<br><b data-xs="local"></b></div>
    <div class="frase" data-xs-se="citacao.texto"><span data-xs="citacao.texto"></span><small data-xs="citacao.autor"></small></div>

    <div class="foto ph" data-xs-bg="fotos.perfil"></div>
    <div class="nome">
      <h1 data-xs="nome">ALBERT</h1>
      <div class="meta">
        <span data-xs-se="online" hidden><i class="on"></i>online agora</span>
        <button type="button" data-xs-se="xat" data-copiar>ID <span data-xs="xat"></span></button>
        <a data-xs-se="instagram" data-xs-link="instagramUrl"><span>@<span data-xs="instagram"></span></span></a>
      </div>
      <p class="bio" data-xs="frase"></p>
    </div>

    <div class="player" data-xs-player>
      <span class="xs-controles">
        <button class="xs-pular" type="button" data-xs-anterior aria-label="Música anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM19 5v14L9 12z"/></svg></button>
        <button class="play" type="button" data-xs-tocar aria-label="Tocar música">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
        </button>
        <button class="xs-pular" type="button" data-xs-proxima aria-label="Próxima música"><svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM5 5v14l10-7z"/></svg></button>
      </span>
      <div class="info"><b data-xs="musica.titulo"></b><span data-xs="musica.artista"></span></div>
      <span class="tempo" data-xs-tempo>0:00</span>
      <div class="barra"><i data-xs-barra></i></div>
      <span class="tempo" data-xs-duracao>0:00</span>
    </div>
  </div>

  <!-- Mobile: desenhado em 390×844 -->
  <div class="xs-palco xs-palco--mobile mob" data-largura="390" data-altura="844">
    <div class="hud e"><b>● ao vivo da rua</b><br>23h47</div>
    <div class="foto ph" data-xs-bg="fotos.perfil"></div>
    <div class="nome">
      <h1 data-xs="nome">ALBERT</h1>
      <div class="meta">
        <span data-xs-se="online" hidden><i class="on"></i>online</span>
        <button type="button" data-xs-se="xat" data-copiar>ID <span data-xs="xat"></span></button>
        <span data-xs-se="local" data-xs="local"></span>
      </div>
      <p class="bio" data-xs="frase"></p>
    </div>
    <div class="player" data-xs-player>
      <span class="xs-controles">
        <button class="play" type="button" data-xs-tocar aria-label="Tocar música">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
        </button>
      </span>
      <div class="info"><b data-xs="musica.titulo"></b><span data-xs="musica.artista"></span><div class="barra"><i data-xs-barra></i></div></div>
      <button class="xs-pular" type="button" data-xs-proxima aria-label="Próxima música"><svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM5 5v14l10-7z"/></svg></button>
    </div>
  </div>

  <script src="../../../core/config.js"></script>
  <script src="../../../core/xatspace.js"></script>
  <script src="script.js"></script>
</body>
</html>
