<!DOCTYPE html>
<html lang="pt-BR" data-cores="original homem mulher">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xatspace · Mural de cortiça</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Special+Elite&family=Abril+Fatface&family=Playfair+Display:ital,wght@1,700&family=Archivo+Black&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../core/base.css">
  <link rel="stylesheet" href="../../../core/cores.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--
    Modelo 29 · Mural de cortiça
    A cortiça, as polaroides, o bilhete, o post-it, o ingresso, as fitas e as tachinhas
    são HTML e CSS de verdade, vazios por dentro. Só as fotos do cliente entram nas polaroides
    (data-xs-img). Os textos vêm dos dados do cliente e do TEXTOS no topo do script.js.
  -->

  <!-- Desktop: desenhado em 1920×900 -->
  <div class="xs-palco desk" data-largura="1920" data-altura="900">
    <div class="cortica"></div>

    <!-- Nome em letras recortadas de revista: montado pelo script.js -->
    <h1 class="recorte" data-recorte></h1>

    <!-- Barbante vermelho ligando as tachinhas -->
    <svg class="barbante" viewBox="0 0 1920 900" aria-hidden="true"><polyline points="273,237 1052,112 1557,85"/></svg>

    <figure class="pol p1"><div class="ft"><img data-xs-img="fotos.perfil" alt=""></div><figcaption><span data-legenda="0"></span></figcaption></figure>
    <figure class="pol p2"><i class="fita"></i><div class="ft"><img data-xs-img="fotos.destaque" alt=""></div><figcaption><span data-legenda="1"></span></figcaption></figure>
    <figure class="pol p3"><div class="ft"><img data-xs-img="fotos.cenario" alt=""></div><figcaption><span data-legenda="3"></span></figcaption></figure>
    <figure class="pol p4"><i class="fita"></i><div class="ft"><img data-xs-img="fotos.verso" alt=""></div><figcaption><span data-legenda="2"></span></figcaption></figure>

    <!-- Post-it com a frase -->
    <p class="postit" data-xs="frase"></p>

    <!-- Ficha pautada com os dados -->
    <div class="ficha" data-ficha></div>

    <!-- Ingresso: é o player de música -->
    <div class="ingresso" data-xs-player>
      <i class="fita"></i>
      <span class="comandos">
        <button class="xs-pular" type="button" data-xs-anterior aria-label="Música anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM19 5v14L9 12z"/></svg></button>
        <button class="play" type="button" data-xs-tocar aria-label="Tocar música">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
        </button>
        <button class="xs-pular" type="button" data-xs-proxima aria-label="Próxima música"><svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM5 5v14l10-7z"/></svg></button>
      </span>
      <span class="info">
        <small data-texto="ingresso"></small>
        <b data-xs="musica.titulo"></b>
        <span class="artista" data-xs="musica.artista"></span>
      </span>
    </div>

    <!-- Tachinhas por cima de tudo, nas pontas do barbante -->
    <i class="tacha" style="left:273px;top:237px"></i>
    <i class="tacha" style="left:1052px;top:112px"></i>
    <i class="tacha" style="left:1557px;top:85px"></i>
    <i class="tacha" style="left:1572px;top:474px"></i>
  </div>

  <!-- Mobile: desenhado em 390×844 -->
  <div class="xs-palco xs-palco--mobile mob" data-largura="390" data-altura="844">
    <div class="cortica"></div>

    <h1 class="recorte" data-recorte></h1>

    <figure class="pol p1"><div class="ft"><img data-xs-img="fotos.perfil" alt=""></div><figcaption><span data-legenda="0"></span></figcaption></figure>
    <p class="postit" data-xs="frase"></p>
    <figure class="pol p2"><i class="fita"></i><div class="ft"><img data-xs-img="fotos.destaque" alt=""></div><figcaption><span data-legenda="1"></span></figcaption></figure>
    <figure class="pol p4"><div class="ft"><img data-xs-img="fotos.verso" alt=""></div><figcaption><span data-legenda="2"></span></figcaption></figure>

    <div class="ingresso" data-xs-player>
      <i class="fita"></i>
      <span class="comandos">
        <button class="xs-pular" type="button" data-xs-anterior aria-label="Música anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM19 5v14L9 12z"/></svg></button>
        <button class="play" type="button" data-xs-tocar aria-label="Tocar música">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
        </button>
        <button class="xs-pular" type="button" data-xs-proxima aria-label="Próxima música"><svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM5 5v14l10-7z"/></svg></button>
      </span>
      <span class="info">
        <small data-texto="ingresso"></small>
        <b data-xs="musica.titulo"></b>
        <span class="artista"><span data-xs="musica.artista"></span><span data-xs-se="instagram"> · <a data-xs-link="instagramUrl" data-texto="arroba"></a></span></span>
      </span>
    </div>

    <i class="tacha" style="left:135px;top:126px"></i>
    <i class="tacha" style="left:299px;top:151px"></i>
    <i class="tacha" style="left:281px;top:421px"></i>
  </div>

  <script src="../../../core/config.js"></script>
  <script src="../../../core/xatspace.js"></script>
  <script src="script.js"></script>
</body>
</html>
