<!DOCTYPE html>
<html lang="pt-BR" data-cores="original masculino masculino-2 feminino">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xatspace · Quadrinhos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../core/base.css">
  <link rel="stylesheet" href="../../../core/cores.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--
    Modelo 31 · Quadrinhos
    A página de gibi é HTML e CSS de verdade: quadros com borda, retícula, balões, caixas de narração
    e onomatopeias. Só as fotos do cliente entram nos quadros (data-xs-img).
    Os textos vêm dos dados do cliente e do TEXTOS no topo do script.js.
  -->

  <!-- Desktop: desenhado em 1920×900 -->
  <div class="xs-palco desk" data-largura="1920" data-altura="900">

    <!-- Quadro alto da esquerda: foto de perfil e a frase no balão -->
    <section class="q q-perfil">
      <img class="foto" data-xs-img="fotos.perfil" alt=""><i class="reticula"></i>
      <p class="nar" data-texto="capitulo"></p>
      <p class="bal bal-frase cauda-cima"><span data-texto="frase"></span></p>
    </section>

    <!-- Capa: raios de sol e o nome do cliente -->
    <section class="q q-capa">
      <div class="capa">
        <p class="chamada" data-texto="chamada"></p>
        <h1 class="nome" data-xs="nomeCompleto"></h1>
        <p class="edicao" data-texto="edicao"></p>
      </div>
    </section>

    <!-- No xat: foto de corpo inteiro e o status -->
    <section class="q q-xat">
      <img class="foto" data-xs-img="fotos.verso" alt=""><i class="reticula"></i>
      <p class="nar direita" data-texto="noXat"></p>
      <p class="bal bal-online cauda-baixo" data-xs-se="online" hidden><span data-texto="online"></span><i class="ponto">●</i></p>
    </section>

    <!-- Treino (ou look do dia) com a estrela do POW -->
    <section class="q q-treino">
      <img class="foto" data-xs-img="fotos.destaque" alt=""><i class="reticula"></i>
      <div class="estrela"><b class="sfx" data-texto="sfxTreino"></b></div>
      <p class="nar baixo direita" data-texto="treino"></p>
    </section>

    <!-- Paisagem com o CLICK -->
    <section class="q q-cenario">
      <img class="foto" data-xs-img="fotos.cenario" alt=""><i class="reticula"></i>
      <p class="nar" data-texto="fotografia"></p>
      <b class="sfx sfx-click" data-texto="sfxFoto"></b>
    </section>

    <!-- Música -->
    <section class="q q-som">
      <div class="som" data-xs-player>
        <p class="som-tit" data-texto="som"></p>
        <div class="player">
          <span class="xs-controles">
            <button class="xs-pular" type="button" data-xs-anterior aria-label="Música anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM19 5v14L9 12z"/></svg></button>
            <button class="play" type="button" data-xs-tocar aria-label="Tocar música">
              <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
              <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
            </button>
            <button class="xs-pular" type="button" data-xs-proxima aria-label="Próxima música"><svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM5 5v14l10-7z"/></svg></button>
          </span>
          <span class="faixa"><b data-xs="musica.titulo"></b><small data-xs="musica.artista"></small></span>
        </div>
        <a class="continua" data-xs-link="instagramUrl" data-xs-se="instagram"><span data-texto="continua"></span> @<span data-xs="instagram"></span> ✦</a>
      </div>
    </section>
  </div>

  <!-- Mobile: desenhado em 390×844 -->
  <div class="xs-palco xs-palco--mobile mob" data-largura="390" data-altura="844">
    <section class="q q-capa">
      <div class="capa">
        <p class="chamada" data-texto="chamada"></p>
        <h1 class="nome" data-xs="nomeCompleto"></h1>
        <p class="edicao" data-texto="edicaoCurta"></p>
      </div>
    </section>

    <section class="q q-perfil">
      <img class="foto" data-xs-img="fotos.perfil" alt=""><i class="reticula"></i>
      <p class="nar" data-texto="capitulo"></p>
      <p class="bal bal-frase"><span data-texto="frase"></span></p>
    </section>

    <section class="q q-treino">
      <img class="foto" data-xs-img="fotos.destaque" alt=""><i class="reticula"></i>
      <div class="estrela"><b class="sfx" data-texto="sfxTreino"></b></div>
    </section>

    <section class="q q-xat">
      <img class="foto" data-xs-img="fotos.verso" alt=""><i class="reticula"></i>
      <p class="nar direita" data-texto="noXatCurto"></p>
      <p class="bal bal-online" data-xs-se="online" hidden><span data-texto="online"></span><i class="ponto">●</i></p>
    </section>

    <section class="q q-som">
      <div class="som" data-xs-player>
        <p class="som-tit" data-texto="som"></p>
        <div class="player">
          <span class="xs-controles">
            <button class="xs-pular" type="button" data-xs-anterior aria-label="Música anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM19 5v14L9 12z"/></svg></button>
            <button class="play" type="button" data-xs-tocar aria-label="Tocar música">
              <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
              <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
            </button>
            <button class="xs-pular" type="button" data-xs-proxima aria-label="Próxima música"><svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM5 5v14l10-7z"/></svg></button>
          </span>
          <span class="faixa"><b data-xs="musica.titulo"></b><small><span data-xs="musica.artista"></span><a data-xs-link="instagramUrl" data-xs-se="instagram"> · @<span data-xs="instagram"></span></a></small></span>
        </div>
      </div>
    </section>
  </div>

  <script src="../../../core/config.js"></script>
  <script src="../../../core/xatspace.js"></script>
  <script src="script.js"></script>
</body>
</html>
