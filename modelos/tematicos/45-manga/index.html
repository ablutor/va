<!DOCTYPE html>
<html lang="pt-BR" data-cores="original masculino feminino feminino-2 pastel-rosa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xatspace · Mangá</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Kalam:wght@400;700&family=Anton&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../core/base.css">
  <link rel="stylesheet" href="../../../core/cores.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Desktop: desenhado em 1920×900 -->
  <div class="xs-palco desk" data-largura="1920" data-altura="900">
    <div class="pagina">
      <div class="quadros">
        <div class="q q1">
          <div class="foto f1" data-foto="q1"></div><div class="tom"></div><div class="vel"></div>
          <div class="nar" data-texto="cena"></div>
          <div class="sfx s1">DOKI<br>DOKI!</div>
          <div class="titulo"><small data-texto="capitulo"></small><b data-texto="titulo"></b></div>
        </div>
        <div class="q q2">
          <div class="foto f2" data-foto="q2"></div><div class="tom"></div>
          <div class="bal b1"><span data-texto="balao-gosto"></span></div>
          <div class="ci"><span data-texto="legenda"></span></div>
        </div>
        <div class="q q3">
          <div class="foto f3" data-foto="q3"></div><div class="tom"></div>
          <div class="bal b2"><span data-texto="balao-frase"></span></div>
          <div class="nar baixo" data-texto="manchete"></div>
        </div>
        <div class="q q4">
          <div class="foto f4" data-foto="q4"></div><div class="tom"></div><div class="vel leve"></div>
          <div class="nar" data-texto="dia"></div>
          <div class="sfx s2">SWOOSH!</div>
        </div>
        <div class="q q5">
          <div class="card" data-xs-player>
            <h3 data-texto="ficha"></h3>
            <p class="poderes" data-texto="poderes"><span>Poderes:</span> <b></b></p>
            <p data-xs-se="instagram">Contato: <a data-xs-link="instagramUrl">@<span data-xs="instagram"></span></a></p>
            <p><span class="status" data-xs-se="online">● ONLINE AGORA</span></p>
            <div class="barra">
              <span class="xs-controles">
                <button class="xs-pular" type="button" data-xs-anterior aria-label="Música anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM19 5v14L9 12z"/></svg></button>
                <button class="play" type="button" data-xs-tocar aria-label="Tocar música">
                  <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
                  <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
                </button>
                <button class="xs-pular" type="button" data-xs-proxima aria-label="Próxima música"><svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM5 5v14l10-7z"/></svg></button>
              </span>
              <p class="faixa"><span class="tit">♪ <span data-xs="musica.titulo"></span></span><small data-xs="musica.artista"></small></p>
            </div>
            <div class="prog"><span data-xs-barra></span></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile: desenhado em 390×844 -->
  <div class="xs-palco xs-palco--mobile mob" data-largura="390" data-altura="844">
    <div class="pagina">
      <div class="quadros">
        <div class="q q1">
          <div class="foto f1" data-foto="q1"></div><div class="tom"></div><div class="vel"></div>
          <div class="nar" data-texto="cena"></div>
          <div class="sfx s1">DOKI<br>DOKI!</div>
          <div class="titulo"><small data-texto="capitulo"></small><b data-texto="titulo"></b></div>
        </div>
        <div class="q q2">
          <div class="foto f2" data-foto="q2"></div><div class="tom"></div>
          <div class="bal b1"><span data-texto="balao-gosto"></span></div>
          <div class="ci"><span data-texto="nome-curto"></span></div>
        </div>
        <div class="q q3">
          <div class="foto f3" data-foto="q3"></div><div class="tom"></div>
          <div class="bal b2"><span data-texto="balao-frase"></span></div>
          <div class="nar baixo" data-texto="manchete-curta"></div>
        </div>
        <div class="q q4">
          <div class="card" data-xs-player>
            <h3 data-texto="ficha"></h3>
            <p class="poderes" data-texto="poderes"><span>Poderes:</span> <b></b></p>
            <p><a data-xs-link="instagramUrl" data-xs-se="instagram">@<span data-xs="instagram"></span></a> <span class="status" data-xs-se="online">● ONLINE</span></p>
            <div class="barra">
              <span class="xs-controles">
                <button class="xs-pular" type="button" data-xs-anterior aria-label="Música anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM19 5v14L9 12z"/></svg></button>
                <button class="play" type="button" data-xs-tocar aria-label="Tocar música">
                  <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
                  <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
                </button>
                <button class="xs-pular" type="button" data-xs-proxima aria-label="Próxima música"><svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM5 5v14l10-7z"/></svg></button>
              </span>
              <p class="faixa"><span class="tit">♪ <span data-xs="musica.titulo"></span></span><small data-xs="musica.artista"></small></p>
            </div>
            <div class="prog"><span data-xs-barra></span></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../../core/config.js"></script>
  <script src="../../../core/xatspace.js"></script>
  <script src="script.js"></script>
</body>
</html>
