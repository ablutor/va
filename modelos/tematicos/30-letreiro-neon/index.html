<!DOCTYPE html>
<html lang="pt-BR" data-cores="original masculino masculino-2 feminino feminino-2">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xatspace · Letreiro neon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Lexend:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../core/base.css">
  <link rel="stylesheet" href="../../../core/cores.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--
    Modelo 30 · Letreiro neon
    O letreiro é texto HTML com brilho de CSS (text-shadow), e a moldura da foto são dois
    tubos de neon em CSS, vazios por dentro. Só a foto do cliente entra nela (data-xs-img).
    Os textos vêm dos dados do cliente e do TEXTOS no topo do script.js.
  -->

  <!-- A parede de azulejos cobre a tela inteira, fora do palco -->
  <div class="xs-fundo parede"></div>

  <!-- Desktop: desenhado em 1920×900 -->
  <div class="xs-palco desk" data-largura="1920" data-altura="900">
    <h1 class="nome neon" data-xs="nome"></h1>
    <p class="cidade" data-xs="local"></p>

    <a class="online" data-xs-se="online" hidden data-texto="online"></a>

    <p class="frase" data-texto="frase"></p>

    <!-- Moldura de neon: dois tubos e o enfeite no canto; a foto só ocupa o espaço de dentro -->
    <div class="quadro">
      <div class="tubo-dentro"><div class="foto"><img data-xs-img="fotos.destaque" alt=""></div></div>
      <i class="enfeite"></i>
    </div>

    <div class="player" data-xs-player>
      <button class="xs-pular" type="button" data-xs-anterior aria-label="Música anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM19 5v14L9 12z"/></svg></button>
      <button class="play" type="button" data-xs-tocar aria-label="Tocar música">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
      </button>
      <button class="xs-pular" type="button" data-xs-proxima aria-label="Próxima música"><svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM5 5v14l10-7z"/></svg></button>
      <span class="faixa"><span data-xs="musica.titulo"></span><span data-texto="separador"></span><span data-xs="musica.artista"></span></span>
    </div>
  </div>

  <!-- Mobile: desenhado em 390×844 -->
  <div class="xs-palco xs-palco--mobile mob" data-largura="390" data-altura="844">
    <h1 class="nome neon" data-xs="nome"></h1>
    <p class="cidade" data-xs="local"></p>

    <div class="quadro">
      <div class="tubo-dentro"><div class="foto"><img data-xs-img="fotos.destaque" alt=""></div></div>
      <i class="enfeite"></i>
    </div>

    <a class="online" data-xs-se="online" hidden data-texto="online"></a>

    <p class="frase" data-texto="frase"></p>

    <div class="player" data-xs-player>
      <button class="xs-pular" type="button" data-xs-anterior aria-label="Música anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM19 5v14L9 12z"/></svg></button>
      <button class="play" type="button" data-xs-tocar aria-label="Tocar música">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
      </button>
      <button class="xs-pular" type="button" data-xs-proxima aria-label="Próxima música"><svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM5 5v14l10-7z"/></svg></button>
      <span class="faixa" data-xs="musica.titulo"></span>
    </div>
  </div>

  <script src="../../../core/config.js"></script>
  <script src="../../../core/xatspace.js"></script>
  <script src="script.js"></script>
</body>
</html>
