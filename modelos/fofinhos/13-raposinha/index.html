<!DOCTYPE html>
<html lang="pt-BR" data-cores="original masculino feminino feminino-2">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xatspace · Raposinha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../core/base.css">
  <link rel="stylesheet" href="../../_fofinhos/fofinhos.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Desenhos usados mais de uma vez: a pegada e o bichinho -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- Pegada de raposinha: almofada oval e quatro dedinhos ovais -->
      <symbol id="pegada" viewBox="0 0 100 100">
        <g fill="currentColor">
          <path d="M50 54 C64 54 74 66 72 78 C70 88 60 88 50 86 C40 88 30 88 28 78 C26 66 36 54 50 54 Z"/>
          <ellipse cx="22" cy="44" rx="8" ry="11" transform="rotate(-25 22 44)"/>
          <ellipse cx="40" cy="26" rx="8.5" ry="12" transform="rotate(-8 40 26)"/>
          <ellipse cx="60" cy="26" rx="8.5" ry="12" transform="rotate(8 60 26)"/>
          <ellipse cx="78" cy="44" rx="8" ry="11" transform="rotate(25 78 44)"/>
        </g>
      </symbol>

      <!-- Pelo laranja, peitinho branco e as "meias" escuras das patas -->
      <radialGradient id="pelo" cx="40%" cy="30%" r="75%">
        <stop offset="0" stop-color="var(--pelo-luz)"/>
        <stop offset=".5" stop-color="var(--pelo)"/>
        <stop offset="1" stop-color="var(--pelo-sombra)"/>
      </radialGradient>
      <radialGradient id="peito" cx="45%" cy="30%" r="80%">
        <stop offset="0" stop-color="var(--branco)"/>
        <stop offset=".6" stop-color="var(--branco)"/>
        <stop offset="1" stop-color="var(--branco-sombra)"/>
      </radialGradient>
      <linearGradient id="meia" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--pelo)"/>
        <stop offset=".55" stop-color="var(--pelo-sombra)"/>
        <stop offset=".86" stop-color="var(--escuro)"/>
      </linearGradient>
      <linearGradient id="orelha-fora" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--escuro)"/>
        <stop offset=".24" stop-color="var(--escuro)"/>
        <stop offset=".36" stop-color="var(--pelo)"/>
        <stop offset="1" stop-color="var(--pelo-sombra)"/>
      </linearGradient>
      <clipPath id="rabo-forma">
        <path d="M236 380 C322 398 408 362 404 272 C402 220 376 180 346 168 C330 162 320 176 328 190 C348 222 346 262 322 290 C300 314 268 330 236 342 Z"/>
      </clipPath>

    </defs>
  </svg>

  <!-- O bichinho: o fofinhos.js copia este desenho para dentro de cada .bicho -->
  <template id="bichinho">
    <svg viewBox="0 0 380 400">
        <!-- folhinhas de outono caindo (não recebem clique) -->
        <g class="folhas" pointer-events="none">
              <g transform="translate(-40 -80) rotate(0)"><g class="folha f1"><path d="M0 -16 C11 -9 11 9 0 16 C-11 9 -11 -9 0 -16 Z" fill="var(--folha1)"/><path d="M0 -13 L0 20" stroke="var(--folha-veia)" stroke-width="1.6" stroke-linecap="round"/></g></g>
              <g transform="translate(70 -140) rotate(0)"><g class="folha f2"><path d="M0 -16 C11 -9 11 9 0 16 C-11 9 -11 -9 0 -16 Z" fill="var(--folha2)"/><path d="M0 -13 L0 20" stroke="var(--folha-veia)" stroke-width="1.6" stroke-linecap="round"/></g></g>
              <g transform="translate(330 -120) rotate(0)"><g class="folha f3"><path d="M0 -16 C11 -9 11 9 0 16 C-11 9 -11 -9 0 -16 Z" fill="var(--folha3)"/><path d="M0 -13 L0 20" stroke="var(--folha-veia)" stroke-width="1.6" stroke-linecap="round"/></g></g>
              <g transform="translate(430 -40) rotate(0)"><g class="folha f4"><path d="M0 -16 C11 -9 11 9 0 16 C-11 9 -11 -9 0 -16 Z" fill="var(--folha2)"/><path d="M0 -13 L0 20" stroke="var(--folha-veia)" stroke-width="1.6" stroke-linecap="round"/></g></g>
        </g>
        <g class="pulo-todo">
          <g class="corpo-todo">
            <!-- rabo fofinho com a pontinha branca -->
            <g class="rabo">
              <g clip-path="url(#rabo-forma)">
                <rect x="220" y="150" width="200" height="250" fill="url(#pelo)"/>
                <ellipse cx="364" cy="176" rx="58" ry="40" transform="rotate(32 364 176)" fill="url(#peito)"/>
              </g>
            </g>
            <!-- orelhas -->
            <g class="orelha orelha-esq">
              <path d="M84 160 C78 112 88 66 106 42 C114 32 124 34 132 44 C152 70 170 100 182 126 Z" fill="url(#orelha-fora)"/>
              <path d="M106 146 C104 116 110 88 118 70 C134 90 148 110 158 130 Z" fill="var(--orelha-dentro)"/>
            </g>
            <g class="orelha orelha-dir">
              <g transform="matrix(-1 0 0 1 380 0)">
                <path d="M84 160 C78 112 88 66 106 42 C114 32 124 34 132 44 C152 70 170 100 182 126 Z" fill="url(#orelha-fora)"/>
                <path d="M106 146 C104 116 110 88 118 70 C134 90 148 110 158 130 Z" fill="var(--orelha-dentro)"/>
              </g>
            </g>
            <!-- corpinho sentado -->
            <ellipse cx="112" cy="356" rx="56" ry="42" fill="url(#pelo)"/>
            <ellipse cx="268" cy="356" rx="56" ry="42" fill="url(#pelo)"/>
            <ellipse cx="190" cy="320" rx="102" ry="80" fill="url(#pelo)"/>
            <ellipse cx="190" cy="304" rx="54" ry="64" fill="url(#peito)"/>
            <!-- patinhas da frente com meias escuras -->
            <ellipse cx="160" cy="352" rx="22" ry="42" fill="url(#meia)"/>
            <ellipse cx="220" cy="352" rx="22" ry="42" fill="url(#meia)"/>
            <ellipse cx="158" cy="388" rx="27" ry="13" fill="var(--escuro)"/>
            <ellipse cx="222" cy="388" rx="27" ry="13" fill="var(--escuro)"/>
            <path d="M151 384 l-2 8 M165 384 l2 8 M215 384 l-2 8 M229 384 l2 8" stroke="var(--dedos)" stroke-width="2.5" stroke-linecap="round" opacity=".6"/>
            <!-- cabeça com bochechas fofas -->
            <path d="M72 196 C72 124 126 88 190 88 C254 88 308 124 308 196 C308 222 302 238 326 258 C300 272 262 286 190 286 C118 286 80 272 54 258 C78 238 72 222 72 196 Z" fill="url(#pelo)"/>
            <path d="M190 172 C168 172 152 188 138 208 C126 224 104 236 74 252 C102 272 142 284 190 284 C238 284 278 272 306 252 C276 236 254 224 242 208 C228 188 212 172 190 172 Z" fill="url(#peito)"/>
            <!-- brilho no pelo -->
            <ellipse cx="140" cy="118" rx="36" ry="15" transform="rotate(-22 140 118)" fill="#fff" opacity=".18"/>
            <!-- bochechas -->
            <ellipse cx="114" cy="236" rx="20" ry="11" fill="var(--bochecha)" opacity=".7"/>
            <ellipse cx="266" cy="236" rx="20" ry="11" fill="var(--bochecha)" opacity=".7"/>
            <!-- olhos -->
            <g class="olhos-abertos">
              <circle cx="142" cy="190" r="18" fill="var(--olho)"/>
              <circle cx="238" cy="190" r="18" fill="var(--olho)"/>
              <circle cx="148" cy="183" r="6.5" fill="#fff"/>
              <circle cx="244" cy="183" r="6.5" fill="#fff"/>
              <circle cx="137" cy="198" r="2.6" fill="#fff"/>
              <circle cx="233" cy="198" r="2.6" fill="#fff"/>
            </g>
            <g class="olhos-felizes" fill="none" stroke="var(--olho)" stroke-width="6" stroke-linecap="round">
              <path d="M126 194 q16 -18 32 0"/>
              <path d="M222 194 q16 -18 32 0"/>
            </g>
            <!-- focinho -->
            <path d="M178 222 Q190 215 202 222 Q199 233 190 236 Q181 233 178 222 Z" fill="var(--nariz)"/>
            <ellipse cx="186" cy="221" rx="4" ry="2" fill="#fff" opacity=".5"/>
            <path d="M190 236 q-5 10 -15 7 M190 236 q5 10 15 7" fill="none" stroke="var(--olho)" stroke-width="3.5" stroke-linecap="round"/>
          </g>
        </g>
        <!-- folhinhas já no chão -->
        <g pointer-events="none">
              <g transform="translate(30 392) rotate(70)"><g class="folha "><path d="M0 -16 C11 -9 11 9 0 16 C-11 9 -11 -9 0 -16 Z" fill="var(--folha1)"/><path d="M0 -13 L0 20" stroke="var(--folha-veia)" stroke-width="1.6" stroke-linecap="round"/></g></g>
              <g transform="translate(58 398) rotate(110)"><g class="folha "><path d="M0 -16 C11 -9 11 9 0 16 C-11 9 -11 -9 0 -16 Z" fill="var(--folha3)"/><path d="M0 -13 L0 20" stroke="var(--folha-veia)" stroke-width="1.6" stroke-linecap="round"/></g></g>
              <g transform="translate(338 394) rotate(-60)"><g class="folha "><path d="M0 -16 C11 -9 11 9 0 16 C-11 9 -11 -9 0 -16 Z" fill="var(--folha2)"/><path d="M0 -13 L0 20" stroke="var(--folha-veia)" stroke-width="1.6" stroke-linecap="round"/></g></g>
        </g>
    </svg>
  </template>

  <!-- Fundo da tela toda, com rastros de pegadas -->
  <div class="xs-fundo fundo"><div class="pegadas" data-pegadas="6"></div></div>

  <!-- Desktop: desenhado em 1920×900 -->
  <div class="xs-palco desk" data-largura="1920" data-altura="900">
    <section class="perfil card">
      <div class="topo">
        <div class="foto" data-xs-bg="fotos.perfil"></div>
        <div>
          <h1 class="nome" data-xs="nome">Albert</h1>
          <div class="sobrenome nome" data-xs="sobrenome">Alves</div>
        </div>
      </div>
      <div class="linha-online">
        <span class="online" data-xs-se="online">online</span>
      </div>
      <p class="local" data-xs-se="local">📍 <span data-xs="local"></span></p>
      <ul class="chips" data-gostos style="margin-top:10px"></ul>
      <a class="insta" data-xs-link="instagramUrl" data-xs-se="instagram">@<span data-xs="instagram"></span> ↗</a>
    </section>

    <div class="cena">
      <div class="balao carinho"><span class="num" data-carinhos>0</span><div><span class="cap">Carinhos na raposinha</span><p>Clica nela para dar mais um ♥</p></div></div>
      <button class="bicho" type="button" aria-label="Fazer carinho na raposinha">
        
      </button>
      <div class="chao"></div>
    </div>

    <section class="lado">
      <div class="card citacao" data-xs-se="citacao.texto">
        <span class="cap">Frase favorita</span>
        <p data-xs="citacao.texto"></p>
        <small>— <span data-xs="citacao.autor"></span></small>
      </div>
      <div class="card player" data-xs-player>
        <span class="xs-controles">
          <button class="xs-pular" type="button" data-xs-anterior aria-label="Música anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM19 5v14L9 12z"/></svg></button>
          <button class="play" type="button" data-xs-tocar aria-label="Tocar música">
            <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
          </button>
          <button class="xs-pular" type="button" data-xs-proxima aria-label="Próxima música"><svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM5 5v14l10-7z"/></svg></button>
        </span>
        <div class="info">
          <b data-xs="musica.titulo"></b><i data-xs="musica.artista"></i>
          <div class="barra"><span data-xs-barra></span></div>
        </div>
        <span class="eq"><i></i><i></i><i></i><i></i></span>
      </div>
    </section>
  </div>

  <!-- Mobile: desenhado em 390×844 -->
  <div class="xs-palco xs-palco--mobile mob" data-largura="390" data-altura="844">
    <div class="cabeca">
      <div class="foto" data-xs-bg="fotos.perfil"></div>
      <div>
        <h1 class="nome" data-xs="nome">Albert</h1>
        <span class="online" data-xs-se="online">online</span>
      </div>
    </div>

    <div class="cena">
      <div class="balao carinho"><span class="num" data-carinhos>0</span><div><span class="cap">Carinhos na raposinha</span><p>Clica nela para dar mais um ♥</p></div></div>
      <button class="bicho" type="button" aria-label="Fazer carinho na raposinha">
        
      </button>
      <div class="chao"></div>
    </div>

    <section class="perfil card">
      <div class="citacao" data-xs-se="citacao.texto">
        <span class="cap">Frase favorita</span>
        <p data-xs="citacao.texto"></p>
        <small>— <span data-xs="citacao.autor"></span></small>
      </div>
      <ul class="chips" data-gostos></ul>
      <div class="rodape">
        <a class="insta" data-xs-link="instagramUrl" data-xs-se="instagram">@<span data-xs="instagram"></span></a>
      </div>
    </section>

    <div class="card player" data-xs-player>
      <span class="xs-controles">
        <button class="xs-pular" type="button" data-xs-anterior aria-label="Música anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM19 5v14L9 12z"/></svg></button>
        <button class="play" type="button" data-xs-tocar aria-label="Tocar música">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
        </button>
        <button class="xs-pular" type="button" data-xs-proxima aria-label="Próxima música"><svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM5 5v14l10-7z"/></svg></button>
      </span>
      <div class="info">
        <b data-xs="musica.titulo"></b><i data-xs="musica.artista"></i>
        <div class="barra"><span data-xs-barra></span></div>
      </div>
      <span class="eq"><i></i><i></i><i></i><i></i></span>
    </div>
  </div>

  <script src="../../../core/config.js"></script>
  <script src="../../../core/xatspace.js"></script>
  <script src="../../_fofinhos/fofinhos.js"></script>
  <script src="script.js"></script>
</body>
</html>
