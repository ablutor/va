<!DOCTYPE html>
<html lang="pt-BR" data-cores="original masculino feminino feminino-2">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xatspace · Coelhinho</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../core/base.css">
  <link rel="stylesheet" href="../../_fofinhos/fofinhos.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Desenhos usados mais de uma vez: a pegada e o bichinho -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- Pegada de coelho: duas patas compridas na frente e duas redondinhas atrás -->
      <symbol id="pegada" viewBox="0 0 100 100">
        <g fill="currentColor">
          <ellipse cx="34" cy="30" rx="12" ry="25"/>
          <ellipse cx="66" cy="30" rx="12" ry="25"/>
          <circle cx="43" cy="76" r="10"/>
          <circle cx="57" cy="92" r="8"/>
        </g>
      </symbol>

      <radialGradient id="pelo" cx="40%" cy="30%" r="75%">
        <stop offset="0" stop-color="var(--pelo)"/>
        <stop offset="1" stop-color="var(--pelo-sombra)"/>
      </radialGradient>

    </defs>
  </svg>

  <!-- O bichinho: o fofinhos.js copia este desenho para dentro de cada .bicho -->
  <template id="bichinho">
    <svg viewBox="0 0 380 400">
        <g class="pulo-todo">
          <g class="corpo-todo">
            <!-- rabinho -->
            <circle cx="300" cy="330" r="28" fill="url(#pelo)"/>
            <!-- orelhas -->
            <g class="orelha orelha-esq">
              <ellipse cx="140" cy="92" rx="34" ry="92" fill="url(#pelo)"/>
              <ellipse cx="140" cy="100" rx="16" ry="66" fill="var(--orelha)"/>
            </g>
            <g class="orelha orelha-dir">
              <ellipse cx="240" cy="92" rx="34" ry="92" fill="url(#pelo)"/>
              <ellipse cx="240" cy="100" rx="16" ry="66" fill="var(--orelha)"/>
            </g>
            <!-- corpo e cabeça -->
            <ellipse cx="190" cy="318" rx="122" ry="78" fill="url(#pelo)"/>
            <ellipse cx="190" cy="222" rx="118" ry="102" fill="url(#pelo)"/>
            <!-- patinhas -->
            <ellipse cx="128" cy="388" rx="44" ry="18" fill="url(#pelo)"/>
            <ellipse cx="252" cy="388" rx="44" ry="18" fill="url(#pelo)"/>
            <ellipse cx="152" cy="336" rx="22" ry="26" fill="var(--pelo)"/>
            <ellipse cx="228" cy="336" rx="22" ry="26" fill="var(--pelo)"/>
            <!-- bochechas -->
            <ellipse cx="118" cy="250" rx="24" ry="14" fill="var(--bochecha)" opacity=".7"/>
            <ellipse cx="262" cy="250" rx="24" ry="14" fill="var(--bochecha)" opacity=".7"/>
            <!-- olhos -->
            <g class="olhos-abertos">
              <circle cx="146" cy="214" r="17" fill="var(--olho)"/>
              <circle cx="234" cy="214" r="17" fill="var(--olho)"/>
              <circle cx="152" cy="207" r="6" fill="#fff"/>
              <circle cx="240" cy="207" r="6" fill="#fff"/>
              <circle cx="141" cy="221" r="2.5" fill="#fff"/>
              <circle cx="229" cy="221" r="2.5" fill="#fff"/>
            </g>
            <g class="olhos-felizes" fill="none" stroke="var(--olho)" stroke-width="6" stroke-linecap="round">
              <path d="M130 218 q16 -18 32 0"/>
              <path d="M218 218 q16 -18 32 0"/>
            </g>
            <!-- focinho -->
            <path d="M180 238 q10 -6 20 0 q-4 9 -10 10 q-6 -1 -10 -10z" fill="var(--nariz)"/>
            <path d="M190 248 q-6 12 -18 8 M190 248 q6 12 18 8" fill="none" stroke="var(--olho)" stroke-width="3.5" stroke-linecap="round"/>
            <!-- bigodes -->
            <g stroke="var(--olho)" stroke-width="2" stroke-linecap="round" opacity=".35">
              <path d="M96 236 l-38 -6 M98 248 l-38 6"/>
              <path d="M284 236 l38 -6 M282 248 l38 6"/>
            </g>
          </g>
        </g>
    </svg>
  </template>

  <!-- Fundo da tela toda, com rastros de pegadas -->
  <div class="xs-fundo fundo"><div class="pegadas" data-pegadas="6"></div></div>

  <!-- Desktop: desenhado em 1920×900 -->
  <div class="xs-palco desk" data-largura="1920" data-altura="900">
    <section class="perfil card">
      <div class="topo">
        <div class="foto" data-xs-bg="fotos.perfil"></div>
        <div>
          <h1 class="nome" data-xs="nome">Albert</h1>
          <div class="sobrenome nome" data-xs="sobrenome">Alves</div>
        </div>
      </div>
      <div class="linha-online">
        <span class="online" data-xs-se="online">online</span>
      </div>
      <p class="local" data-xs-se="local">📍 <span data-xs="local"></span></p>
      <ul class="chips" data-gostos style="margin-top:10px"></ul>
      <a class="insta" data-xs-link="instagramUrl" data-xs-se="instagram">@<span data-xs="instagram"></span> ↗</a>
    </section>

    <div class="cena">
      <div class="balao carinho"><span class="num" data-carinhos>0</span><div><span class="cap">Carinhos no coelhinho</span><p>Clica nele para dar mais um ♥</p></div></div>
      <button class="bicho" type="button" aria-label="Fazer carinho no coelhinho">
        
      </button>
      <div class="chao"></div>
    </div>

    <section class="lado">
      <div class="card citacao" data-xs-se="citacao.texto">
        <span class="cap">Frase favorita</span>
        <p data-xs="citacao.texto"></p>
        <small>— <span data-xs="citacao.autor"></span></small>
      </div>
      <div class="card player" data-xs-player>
        <span class="xs-controles">
          <button class="xs-pular" type="button" data-xs-anterior aria-label="Música anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM19 5v14L9 12z"/></svg></button>
          <button class="play" type="button" data-xs-tocar aria-label="Tocar música">
            <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
          </button>
          <button class="xs-pular" type="button" data-xs-proxima aria-label="Próxima música"><svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM5 5v14l10-7z"/></svg></button>
        </span>
        <div class="info">
          <b data-xs="musica.titulo"></b><i data-xs="musica.artista"></i>
          <div class="barra"><span data-xs-barra></span></div>
        </div>
        <span class="eq"><i></i><i></i><i></i><i></i></span>
      </div>
    </section>
  </div>

  <!-- Mobile: desenhado em 390×844 -->
  <div class="xs-palco xs-palco--mobile mob" data-largura="390" data-altura="844">
    <div class="cabeca">
      <div class="foto" data-xs-bg="fotos.perfil"></div>
      <div>
        <h1 class="nome" data-xs="nome">Albert</h1>
        <span class="online" data-xs-se="online">online</span>
      </div>
    </div>

    <div class="cena">
      <div class="balao carinho"><span class="num" data-carinhos>0</span><div><span class="cap">Carinhos no coelhinho</span><p>Clica nele para dar mais um ♥</p></div></div>
      <button class="bicho" type="button" aria-label="Fazer carinho no coelhinho">
        
      </button>
      <div class="chao"></div>
    </div>

    <section class="perfil card">
      <div class="citacao" data-xs-se="citacao.texto">
        <span class="cap">Frase favorita</span>
        <p data-xs="citacao.texto"></p>
        <small>— <span data-xs="citacao.autor"></span></small>
      </div>
      <ul class="chips" data-gostos></ul>
      <div class="rodape">
        <a class="insta" data-xs-link="instagramUrl" data-xs-se="instagram">@<span data-xs="instagram"></span></a>
      </div>
    </section>

    <div class="card player" data-xs-player>
      <span class="xs-controles">
        <button class="xs-pular" type="button" data-xs-anterior aria-label="Música anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM19 5v14L9 12z"/></svg></button>
        <button class="play" type="button" data-xs-tocar aria-label="Tocar música">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
        </button>
        <button class="xs-pular" type="button" data-xs-proxima aria-label="Próxima música"><svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM5 5v14l10-7z"/></svg></button>
      </span>
      <div class="info">
        <b data-xs="musica.titulo"></b><i data-xs="musica.artista"></i>
        <div class="barra"><span data-xs-barra></span></div>
      </div>
      <span class="eq"><i></i><i></i><i></i><i></i></span>
    </div>
  </div>

  <script src="../../../core/config.js"></script>
  <script src="../../../core/xatspace.js"></script>
  <script src="../../_fofinhos/fofinhos.js"></script>
  <script src="script.js"></script>
</body>
</html>
