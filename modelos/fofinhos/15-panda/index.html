<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<body>
  <!-- Desenhos usados mais de uma vez: a pegada e o panda -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- Pegada de urso: almofada larga e cinco dedinhos redondos -->
      <symbol id="pegada" viewBox="0 0 100 100">
        <g fill="currentColor">
          <path d="M50 52 C68 52 82 64 80 80 C78 94 64 96 50 92 C36 96 22 94 20 80 C18 64 32 52 50 52Z"/>
          <circle cx="14" cy="44" r="8"/>
          <circle cx="30" cy="26" r="9"/>
          <circle cx="50" cy="20" r="9.5"/>
          <circle cx="70" cy="26" r="9"/>
          <circle cx="86" cy="44" r="8"/>
        </g>
      </symbol>

      <!-- Pelo branquinho, com luz no alto -->
      <radialGradient id="pelo" cx="40%" cy="30%" r="75%">
        <stop offset="0" stop-color="var(--pelo)"/>
        <stop offset="1" stop-color="var(--pelo-sombra)"/>
      </radialGradient>

      <!-- Partes pretas: orelhas, manchas, braços e pernas -->
      <radialGradient id="mancha" cx="35%" cy="28%" r="80%">
        <stop offset="0" stop-color="var(--mancha-luz)"/>
        <stop offset="1" stop-color="var(--mancha)"/>
      </radialGradient>
    </defs>
  </svg>

  <!-- O bichinho: o fofinhos.js copia este desenho para dentro de cada .bicho -->
  <template id="bichinho">
    <svg viewBox="0 0 380 400">
        <g class="pulo-todo">
          <g class="corpo-todo">
            <!-- orelhas -->
            <g class="orelha orelha-esq">
              <circle cx="88" cy="84" r="42" fill="url(#mancha)"/>
              <circle cx="92" cy="88" r="20" fill="var(--mancha-luz)" opacity=".8"/>
            </g>
            <g class="orelha orelha-dir">
              <circle cx="292" cy="84" r="42" fill="url(#mancha)"/>
              <circle cx="288" cy="88" r="20" fill="var(--mancha-luz)" opacity=".8"/>
            </g>
            <!-- corpo sentadinho -->
            <ellipse cx="190" cy="306" rx="124" ry="88" fill="url(#pelo)"/>
            <!-- perninhas com almofadinhas -->
            <g class="perna">
              <ellipse cx="108" cy="356" rx="54" ry="40" fill="url(#mancha)"/>
              <ellipse cx="100" cy="364" rx="20" ry="16" fill="var(--almofada)"/>
              <circle cx="80" cy="342" r="6.5" fill="var(--almofada)"/>
              <circle cx="96" cy="336" r="6.5" fill="var(--almofada)"/>
              <circle cx="113" cy="338" r="6.5" fill="var(--almofada)"/>
            </g>
            <g class="perna">
              <ellipse cx="272" cy="356" rx="54" ry="40" fill="url(#mancha)"/>
              <ellipse cx="280" cy="364" rx="20" ry="16" fill="var(--almofada)"/>
              <circle cx="300" cy="342" r="6.5" fill="var(--almofada)"/>
              <circle cx="284" cy="336" r="6.5" fill="var(--almofada)"/>
              <circle cx="267" cy="338" r="6.5" fill="var(--almofada)"/>
            </g>
            <!-- cabeça -->
            <ellipse cx="190" cy="172" rx="128" ry="106" fill="url(#pelo)"/>
            <ellipse cx="150" cy="110" rx="46" ry="22" transform="rotate(-18 150 110)" fill="#fff" opacity=".7"/>
            <!-- manchas dos olhos -->
            <ellipse cx="138" cy="184" rx="30" ry="40" transform="rotate(32 138 184)" fill="url(#mancha)"/>
            <ellipse cx="242" cy="184" rx="30" ry="40" transform="rotate(-32 242 184)" fill="url(#mancha)"/>
            <!-- bochechas -->
            <ellipse cx="96" cy="236" rx="22" ry="13" fill="var(--bochecha)" opacity=".75"/>
            <ellipse cx="284" cy="236" rx="22" ry="13" fill="var(--bochecha)" opacity=".75"/>
            <!-- olhos -->
            <g class="olhos-abertos">
              <circle cx="146" cy="180" r="15" fill="#fff"/>
              <circle cx="234" cy="180" r="15" fill="#fff"/>
              <circle cx="147" cy="181" r="12" fill="var(--olho)"/>
              <circle cx="233" cy="181" r="12" fill="var(--olho)"/>
              <circle cx="151" cy="176" r="5" fill="#fff"/>
              <circle cx="237" cy="176" r="5" fill="#fff"/>
              <circle cx="143" cy="186" r="2.2" fill="#fff"/>
              <circle cx="229" cy="186" r="2.2" fill="#fff"/>
            </g>
            <g class="olhos-felizes" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round">
              <path d="M131 186 q15 -17 30 0"/>
              <path d="M219 186 q15 -17 30 0"/>
            </g>
            <!-- focinho -->
            <ellipse cx="190" cy="232" rx="34" ry="22" fill="#fff" opacity=".8"/>
            <path d="M178 222 q12 -6 24 0 q-4 10 -12 11 q-8 -1 -12 -11z" fill="var(--mancha)"/>
            <path d="M190 233 q-5 10 -15 6 M190 233 q5 10 15 6" fill="none" stroke="var(--mancha)" stroke-width="3.5" stroke-linecap="round"/>
            <!-- raminho de bambu que ele abraça -->
            <g class="bambu">
              <path d="M182 382 L322 196" stroke="var(--bambu)" stroke-width="15" stroke-linecap="round"/>
              <path d="M182 382 L322 196" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".3" transform="translate(-4 -3)"/>
              <path d="M236 318 l14 10 M286 252 l14 10" stroke="var(--bambu-escuro)" stroke-width="4" stroke-linecap="round"/>
              <path d="M322 196 Q328 160 352 142 Q350 176 322 196Z" fill="var(--bambu)"/>
              <path d="M322 196 Q352 192 372 206 Q344 220 322 196Z" fill="var(--bambu-escuro)"/>
              <path d="M300 226 Q318 212 346 222 Q320 238 300 226Z" fill="var(--bambu)"/>
            </g>
            <!-- bracinhos abraçando o bambu -->
            <path d="M104 290 Q146 326 212 324" fill="none" stroke="url(#mancha)" stroke-width="40" stroke-linecap="round"/>
            <path d="M286 280 Q284 318 250 330" fill="none" stroke="url(#mancha)" stroke-width="42" stroke-linecap="round"/>
          </g>
        </g>
    </svg>
  </template>

  <!-- Fundo da tela toda, com rastros de pegadas -->
  <div class="xs-fundo fundo"><div class="pegadas" data-pegadas="6"></div></div>

  <!-- Desktop: desenhado em 1920×900 -->

 -62 18z" fill="var(--bambu)"/><path d="M140 190 q-28 -24 -58 -14 q28 20 58 14z" fill="var(--bambu)"/></svg></div>
    <div class="bambuzal bambuzal-dir" aria-hidden="true"><svg viewBox="0 0 220 400" preserveAspectRatio="xMidYMax meet"><rect x="60" y="110" width="18" height="310" rx="9" fill="var(--bambu-claro)"/><rect x="58" y="170" width="22" height="5" rx="2.5" fill="var(--bambu-escuro)" opacity=".55"/><rect x="58" y="240" width="22" height="5" rx="2.5" fill="var(--bambu-escuro)" opacity=".55"/><rect x="58" y="310" width="22" height="5" rx="2.5" fill="var(--bambu-escuro)" opacity=".55"/><rect x="58" y="380" width="22" height="5" rx="2.5" fill="var(--bambu-escuro)" opacity=".55"/><path d="M78 160 q30 -26 62 -18 q-30 20 -62 18z" fill="var(--bambu-claro)"/><path d="M60 230 q-28 -24 -58 -14 q28 20 58 14z" fill="var(--bambu-claro)"/><rect x="110" y="60" width="22" height="360" rx="11" fill="var(--bambu)"/><rect x="108" y="120" width="26" height="5" rx="2.5" fill="var(--bambu-escuro)" opacity=".55"/><rect x="108" y="190" width="26" height="5" rx="2.5" fill="var(--bambu-escuro)" opacity=".55"/><rect x="108" y="260" width="26" height="5" rx="2.5" fill="var(--bambu-escuro)" opacity=".55"/><rect x="108" y="330" width="26" height="5" rx="2.5" fill="var(--bambu-escuro)" opacity=".55"/><rect x="108" y="400" width="26" height="5" rx="2.5" fill="var(--bambu-escuro)" opacity=".55"/><path d="M132 110 q30 -26 62 -18 q-30 20 -62 18z" fill="var(--bambu)"/><path d="M110 180 q-28 -24 -58 -14 q28 20 58 14z" fill="var(--bambu)"/><rect x="160" y="150" width="16" height="270" rx="8" fill="var(--bambu-claro)"/><rect x="158" y="210" width="20" height="5" rx="2.5" fill="var(--bambu-escuro)" opacity=".55"/><rect x="158" y="280" width="20" height="5" rx="2.5" fill="var(--bambu-escuro)" opacity=".55"/><rect x="158" y="350" width="20" height="5" rx="2.5" fill="var(--bambu-escuro)" opacity=".55"/><path d="M176 200 q30 -26 62 -18 q-30 20 -62 18z" fill="var(--bambu-claro)"/><path d="M160 270 q-28 -24 -58 -14 q28 20 58 14z" fill="var(--bambu-claro)"/></svg></div>

    <section class="perfil card">
      <div class="topo">
        <div class="foto" data-xs-bg="fotos.perfil"></div>
        <div>
          <h1 class="nome" data-xs="nome">Albert</h1>
          <div class="sobrenome nome" data-xs="sobrenome">Alves</div>
        </div>
      </div>
      <div class="linha-online">
        <span class="online" data-xs-se="online">online</span>
      </div>
      <p class="local" data-xs-se="local">📍 <span data-xs="local"></span></p>
      <ul class="chips" data-gostos style="margin-top:10px"></ul>
      <a class="insta" data-xs-link="instagramUrl" data-xs-se="instagram">@<span data-xs="instagram"></span> ↗</a>
    </section>

    <div class="cena">
      <div class="balao carinho"><span class="num" data-carinhos>0</span><div><span class="cap">Carinhos no panda</span><p>Clica nele para dar mais um ♥</p></div></div>
      <!-- Folhinhas de bambu caindo devagar -->
      <span class="folha f1" aria-hidden="true"><svg viewBox="0 0 60 28"><path d="M2 14 Q24 -2 58 12 Q30 30 2 14Z"/><path d="M6 14 L52 12" fill="none" stroke="#fff" stroke-width="1.6" opacity=".5"/></svg></span>
      <span class="folha f2" aria-hidden="true"><svg viewBox="0 0 60 28"><path d="M2 14 Q24 -2 58 12 Q30 30 2 14Z"/><path d="M6 14 L52 12" fill="none" stroke="#fff" stroke-width="1.6" opacity=".5"/></svg></span>
      <span class="folha f3" aria-hidden="true"><svg viewBox="0 0 60 28"><path d="M2 14 Q24 -2 58 12 Q30 30 2 14Z"/><path d="M6 14 L52 12" fill="none" stroke="#fff" stroke-width="1.6" opacity=".5"/></svg></span>
      <span class="folha f4" aria-hidden="true"><svg viewBox="0 0 60 28"><path d="M2 14 Q24 -2 58 12 Q30 30 2 14Z"/><path d="M6 14 L52 12" fill="none" stroke="#fff" stroke-width="1.6" opacity=".5"/></svg></span>
      <button class="bicho" type="button" aria-label="Fazer carinho no panda">
        
      </button>
      <div class="chao"></div>
    </div>

    <section class="lado">
      <div class="card citacao" data-xs-se="citacao.texto">
        <span class="cap">Frase favorita</span>
        <p data-xs="citacao.texto"></p>
        <small>— <span data-xs="citacao.autor"></span></small>
      </div>
      <div class="card player" data-xs-player>
        <span class="xs-controles">
          <button class="xs-pular" type="button" data-xs-anterior aria-label="Música anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM19 5v14L9 12z"/></svg></button>
          <button class="play" type="button" data-xs-tocar aria-label="Tocar música">
            <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
          </button>
          <button class="xs-pular" type="button" data-xs-proxima aria-label="Próxima música"><svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM5 5v14l10-7z"/></svg></button>
        </span>
        <div class="info">
          <b data-xs="musica.titulo"></b><i data-xs="musica.artista"></i>
          <div class="barra"><span data-xs-barra></span></div>
        </div>
        <span class="eq"><i></i><i></i><i></i><i></i></span>
      </div>
    </section>
  </div>
