<!DOCTYPE html>
<html lang="pt-BR" data-cores="original masculino feminino feminino-2">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xatspace · Patinho</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../core/base.css">
  <link rel="stylesheet" href="../../_fofinhos/fofinhos.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Desenhos usados mais de uma vez: a pegada e o patinho -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- Pegada de patinho: três dedos unidos pela membrana, quase um triângulo -->
      <symbol id="pegada" viewBox="0 0 100 100">
        <g fill="currentColor" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round">
          <path stroke-width="12" d="M50 84 L18 32 Q34 40 50 14 Q66 40 82 32 Z"/>
          <circle cx="50" cy="88" r="8" stroke="none"/>
        </g>
      </symbol>

      <!-- Penugem amarelinha, com luz no alto -->
      <radialGradient id="pena" cx="40%" cy="30%" r="75%">
        <stop offset="0" stop-color="var(--pena)"/>
        <stop offset=".65" stop-color="var(--pena-meio)"/>
        <stop offset="1" stop-color="var(--pena-sombra)"/>
      </radialGradient>

      <radialGradient id="bico" cx="40%" cy="25%" r="80%">
        <stop offset="0" stop-color="var(--bico-luz)"/>
        <stop offset="1" stop-color="var(--bico)"/>
      </radialGradient>

      <!-- Poça d'água embaixo do patinho -->
      <radialGradient id="agua" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="var(--agua)" stop-opacity=".95"/>
        <stop offset=".75" stop-color="var(--agua)" stop-opacity=".7"/>
        <stop offset="1" stop-color="var(--agua)" stop-opacity="0"/>
      </radialGradient>
    </defs>
  </svg>

  <!-- O bichinho: o fofinhos.js copia este desenho para dentro de cada .bicho -->
  <template id="bichinho">
    <svg viewBox="0 0 380 400">
        <!-- poça com ondinhas (fica parada quando ele pula) -->
        <g class="poca">
          <ellipse cx="190" cy="386" rx="178" ry="30" fill="url(#agua)"/>
          <ellipse class="onda onda-1" cx="190" cy="386" rx="130" ry="20" fill="none" stroke="#fff" stroke-width="3"/>
          <ellipse class="onda onda-2" cx="190" cy="386" rx="130" ry="20" fill="none" stroke="#fff" stroke-width="3"/>
          <ellipse cx="120" cy="380" rx="22" ry="4" fill="#fff" opacity=".55"/>
        </g>
        <g class="pulo-todo">
          <g class="corpo-todo">
            <!-- pezinhos de pato -->
            <g fill="var(--bico)" stroke="var(--bico)" stroke-width="8" stroke-linejoin="round">
              <path d="M138 362 L112 390 Q119 396 126 390 Q133 398 140 391 Q147 398 154 390 Q161 396 166 390 Z"/>
              <path d="M242 362 L214 390 Q219 396 226 390 Q233 398 240 391 Q247 398 254 390 Q261 396 268 390 Z"/>
            </g>
            <!-- rabinho arrebitado -->
            <path d="M286 292 Q336 232 338 274 Q338 316 290 324 Z" fill="url(#pena)"/>
            <!-- corpinho -->
            <ellipse cx="190" cy="300" rx="130" ry="88" fill="url(#pena)"/>
            <ellipse cx="190" cy="326" rx="76" ry="48" fill="#fff" opacity=".14"/>
            <!-- asinhas -->
            <g class="asa asa-esq">
              <ellipse cx="74" cy="292" rx="30" ry="50" transform="rotate(24 74 292)" fill="url(#pena)"/>
              <path d="M58 318 q8 8 18 6 M66 330 q8 6 16 2" fill="none" stroke="var(--pena-sombra)" stroke-width="4" stroke-linecap="round"/>
            </g>
            <g class="asa asa-dir">
              <ellipse cx="306" cy="292" rx="30" ry="50" transform="rotate(-24 306 292)" fill="url(#pena)"/>
              <path d="M322 318 q-8 8 -18 6 M314 330 q-8 6 -16 2" fill="none" stroke="var(--pena-sombra)" stroke-width="4" stroke-linecap="round"/>
            </g>
            <!-- cabeça (balança sozinha) -->
            <g class="cabeca">
              <!-- topetinho -->
              <path d="M178 74 C164 50 172 30 192 26 C182 42 188 58 198 70 Z" fill="var(--pena-meio)"/>
              <path d="M196 72 C200 50 216 40 232 46 C216 52 210 62 208 76 Z" fill="var(--pena-meio)"/>
              <circle cx="190" cy="168" r="104" fill="url(#pena)"/>
              <ellipse cx="160" cy="112" rx="40" ry="20" transform="rotate(-20 160 112)" fill="#fff" opacity=".35"/>
              <!-- bochechas -->
              <ellipse cx="116" cy="204" rx="24" ry="14" fill="var(--bochecha)" opacity=".75"/>
              <ellipse cx="264" cy="204" rx="24" ry="14" fill="var(--bochecha)" opacity=".75"/>
              <!-- olhos -->
              <g class="olhos-abertos">
                <circle cx="146" cy="168" r="18" fill="var(--olho)"/>
                <circle cx="234" cy="168" r="18" fill="var(--olho)"/>
                <circle cx="152" cy="161" r="7" fill="#fff"/>
                <circle cx="240" cy="161" r="7" fill="#fff"/>
                <circle cx="140" cy="175" r="3" fill="#fff"/>
                <circle cx="228" cy="175" r="3" fill="#fff"/>
              </g>
              <g class="olhos-felizes" fill="none" stroke="var(--olho)" stroke-width="6" stroke-linecap="round">
                <path d="M129 172 q17 -19 34 0"/>
                <path d="M217 172 q17 -19 34 0"/>
              </g>
              <!-- biquinho -->
              <ellipse cx="190" cy="214" rx="26" ry="11" fill="var(--bico-sombra)"/>
              <path d="M152 202 Q152 190 190 190 Q228 190 228 202 Q228 214 190 214 Q152 214 152 202 Z" fill="url(#bico)"/>
              <ellipse cx="176" cy="197" rx="11" ry="3.5" fill="#fff" opacity=".55"/>
              <circle cx="182" cy="199" r="2" fill="var(--bico-sombra)"/>
              <circle cx="198" cy="199" r="2" fill="var(--bico-sombra)"/>
            </g>
          </g>
        </g>
    </svg>
  </template>

  <!-- Fundo da tela toda, com rastros de pegadas -->
  <div class="xs-fundo fundo"><div class="pegadas" data-pegadas="6"></div></div>

  <!-- Desktop: desenhado em 1920×900 -->
  <div class="xs-palco desk" data-largura="1920" data-altura="900">
    <section class="perfil card">
      <div class="topo">
        <div class="foto" data-xs-bg="fotos.perfil"></div>
        <div>
          <h1 class="nome" data-xs="nome">Albert</h1>
          <div class="sobrenome nome" data-xs="sobrenome">Alves</div>
        </div>
      </div>
      <div class="linha-online">
        <span class="online" data-xs-se="online">online</span>
      </div>
      <p class="local" data-xs-se="local">📍 <span data-xs="local"></span></p>
      <ul class="chips" data-gostos style="margin-top:10px"></ul>
      <a class="insta" data-xs-link="instagramUrl" data-xs-se="instagram">@<span data-xs="instagram"></span> ↗</a>
    </section>

    <div class="cena">
      <div class="balao carinho"><span class="num" data-carinhos>0</span><div><span class="cap">Carinhos no patinho</span><p>Clica nele para dar mais um ♥</p></div></div>
      <button class="bicho" type="button" aria-label="Fazer carinho no patinho">
        
      </button>
      <div class="chao"></div>
    </div>

    <section class="lado">
      <div class="card citacao" data-xs-se="citacao.texto">
        <span class="cap">Frase favorita</span>
        <p data-xs="citacao.texto"></p>
        <small>— <span data-xs="citacao.autor"></span></small>
      </div>
      <div class="card player" data-xs-player>
        <span class="xs-controles">
          <button class="xs-pular" type="button" data-xs-anterior aria-label="Música anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM19 5v14L9 12z"/></svg></button>
          <button class="play" type="button" data-xs-tocar aria-label="Tocar música">
            <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
          </button>
          <button class="xs-pular" type="button" data-xs-proxima aria-label="Próxima música"><svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM5 5v14l10-7z"/></svg></button>
        </span>
        <div class="info">
          <b data-xs="musica.titulo"></b><i data-xs="musica.artista"></i>
          <div class="barra"><span data-xs-barra></span></div>
        </div>
        <span class="eq"><i></i><i></i><i></i><i></i></span>
      </div>
    </section>
  </div>

  <!-- Mobile: desenhado em 390×844 -->
  <div class="xs-palco xs-palco--mobile mob" data-largura="390" data-altura="844">
    <div class="cabeca">
      <div class="foto" data-xs-bg="fotos.perfil"></div>
      <div>
        <h1 class="nome" data-xs="nome">Albert</h1>
        <span class="online" data-xs-se="online">online</span>
      </div>
    </div>

    <div class="cena">
      <div class="balao carinho"><span class="num" data-carinhos>0</span><div><span class="cap">Carinhos no patinho</span><p>Clica nele para dar mais um ♥</p></div></div>
      <button class="bicho" type="button" aria-label="Fazer carinho no patinho">
        
      </button>
      <div class="chao"></div>
    </div>

    <section class="perfil card">
      <div class="citacao" data-xs-se="citacao.texto">
        <span class="cap">Frase favorita</span>
        <p data-xs="citacao.texto"></p>
        <small>— <span data-xs="citacao.autor"></span></small>
      </div>
      <ul class="chips" data-gostos></ul>
      <div class="rodape">
        <a class="insta" data-xs-link="instagramUrl" data-xs-se="instagram">@<span data-xs="instagram"></span></a>
      </div>
    </section>

    <div class="card player" data-xs-player>
      <span class="xs-controles">
        <button class="xs-pular" type="button" data-xs-anterior aria-label="Música anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM19 5v14L9 12z"/></svg></button>
        <button class="play" type="button" data-xs-tocar aria-label="Tocar música">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
        </button>
        <button class="xs-pular" type="button" data-xs-proxima aria-label="Próxima música"><svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM5 5v14l10-7z"/></svg></button>
      </span>
      <div class="info">
        <b data-xs="musica.titulo"></b><i data-xs="musica.artista"></i>
        <div class="barra"><span data-xs-barra></span></div>
      </div>
      <span class="eq"><i></i><i></i><i></i><i></i></span>
    </div>
  </div>

  <script src="../../../core/config.js"></script>
  <script src="../../../core/xatspace.js"></script>
  <script src="../../_fofinhos/fofinhos.js"></script>
  <script src="script.js"></script>
</body>
</html>
