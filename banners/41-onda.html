<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Banner · Onda</title>
  <!-- Banner do modelo 41 · Onda: fundo escuro, barras-fantasma de onda de áudio e a linha de progresso na cor de destaque.
       A moldura é um anel fino com barras de onda saindo para fora (em volta do quadrado ou do círculo), montadas em SVG por JS. -->
  <link rel="stylesheet" href="_base.css">
  <style>
    :root { --bg: #131313; --ink: #eee8de; --mudo: #8d877d; --ac: #d9c7a0; }
    [data-cor="original"]  { --bg: #131313; --ink: #eee8de; --mudo: #8d877d; --ac: #d9c7a0; }
    [data-cor="masculino"] { --bg: #0c1521; --ink: #e7eef7; --mudo: #7f93aa; --ac: #8fb7ee; }
    [data-cor="feminino"]  { --bg: #1f1017; --ink: #f6e8ea; --mudo: #a38890; --ac: #ee9db0; }
    html, body { background: var(--bg); }
    .tudo { background: radial-gradient(ellipse 50% 120% at 62% 50%, color-mix(in srgb, var(--ink) 5%, transparent), transparent 75%); }
    svg.onda { position: absolute; left: 0; top: 0; width: 380px; height: 100px; overflow: visible; }
    .moldura { background: var(--bg); }
    .moldura svg { position: absolute; left: -6px; top: -6px; width: 96px; height: 96px; overflow: visible; }
  </style>
</head>
<body>
  <div class="tudo">
    <svg class="onda" id="onda" viewBox="0 0 380 100"></svg>
    <div class="moldura" id="moldura"><svg id="anel" viewBox="-6 -6 96 96"></svg></div>
  </div>
  <script src="_base.js"></script>
  <script>
    XB.pronto.then(function () {
      var NS = "http://www.w3.org/2000/svg";
      function el(pai, nome, at) { var e = document.createElementNS(NS, nome); for (var k in at) e.setAttribute(k, at[k]); pai.appendChild(e); return e; }
      var mol = document.getElementById("moldura");
      if (XB.redonda) mol.classList.add("redonda");

      // ---------- onda de fundo: barras arredondadas, só no lado direito (x > 210); a zona das etiquetas fica limpa ----------
      var onda = document.getElementById("onda");
      var lg = el(onda, "linearGradient", { id: "g", x1: "0", x2: "1", y1: "0", y2: "0" });
      el(lg, "stop", { offset: "0", "stop-color": "var(--ink)", "stop-opacity": "0" });
      el(lg, "stop", { offset: ".25", "stop-color": "var(--ink)", "stop-opacity": ".1" });
      el(lg, "stop", { offset: "1", "stop-color": "var(--ink)", "stop-opacity": ".07" });
      // fio central fino na zona das etiquetas
      el(onda, "line", { x1: 112, x2: 212, y1: 50, y2: 50, stroke: "var(--ink)", "stroke-opacity": ".07", "stroke-width": 1, "stroke-linecap": "round" });
      var n = 0;
      for (var x = 222; x <= 372; x += 5.2, n++) {
        // envelope suave (onda de áudio), com algum ruído repetível
        var t = (x - 222) / 150;
        var env = Math.sin(Math.PI * Math.min(1, t * 1.05)) * .85 + .12;
        var h = Math.max(4, (14 + 62 * env * (.55 + .45 * Math.abs(Math.sin(n * 1.7 + 1.1) * Math.cos(n * .63)))));
        var tocada = false; // sem parte "tocada": nada de cursor nem de progresso, só a onda
        el(onda, "rect", { x: x - 1.5, y: 50 - h / 2, width: 3, height: h, rx: 1.5,
          fill: tocada ? "var(--ac)" : "var(--ink)", "fill-opacity": tocada ? (.16 + .18 * t) : .1 });
      }
      // ---------- anel da moldura: contorno fino + barras para fora ----------
      var anel = document.getElementById("anel"), c = 42;
      var contorno = XB.redonda
        ? el(anel, "circle", { cx: c, cy: c, r: 40.9 })
        : el(anel, "rect", { x: .9, y: .9, width: 82.2, height: 82.2, rx: 3 });
      contorno.setAttribute("fill", "none"); contorno.setAttribute("stroke", "var(--ink)"); contorno.setAttribute("stroke-opacity", ".4"); contorno.setAttribute("stroke-width", 1.6);
      // comprimento de cada barra (repetível); as de destaque ficam na cor acento
      var comp = function (i) { return 1.4 + 2.0 * Math.abs(Math.sin(i * 1.9 + .4) * Math.cos(i * .53 + 1)); };
      var N = 44, i, a, p, nx, ny, L, b;
      function barra(px, py, nx, ny, L, i) {
        var x0 = px + nx * 1.6, y0 = py + ny * 1.6, x1 = px + nx * (1.6 + L), y1 = py + ny * (1.6 + L);
        var acento = i % 11 === 3;
        el(anel, "line", { x1: x0, y1: y0, x2: x1, y2: y1, stroke: acento ? "var(--ac)" : "var(--ink)", "stroke-opacity": acento ? .95 : .45, "stroke-width": 1.9, "stroke-linecap": "round" });
      }
      if (XB.redonda) {
        for (i = 0; i < N; i++) {
          a = i / N * Math.PI * 2; nx = Math.cos(a); ny = Math.sin(a);
          barra(c + nx * 42, c + ny * 42, nx, ny, comp(i), i);
        }
      } else {
        // quadrado: onda de áudio espelhada em cima e embaixo (sem barras nos lados, para não parecer um chip)
        var K = 14, passo = 84 / K;
        for (i = 0; i < K; i++) {
          p = passo * (i + .5);
          var env = Math.sin(Math.PI * (i + .5) / K), L2 = 1.0 + 2.4 * (.35 + .65 * env) * (.55 + .45 * Math.abs(Math.sin(i * 2.3 + .5)));
          barra(p, 0, 0, -1, L2, i);
          barra(p, 84, 0, 1, L2, i);
        }
      }
      XB.pronto2();
    });
  </script>
</body>
</html>
