<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Banner · Retrato</title>
  <!-- Retrato: a paisagem do cliente desfocada, escurecida e sem cor no fundo (nunca uma foto de pessoa: o avatar o xat já insere), e uma plaquinha escura com fio de luz em volta do avatar -->
  <link rel="stylesheet" href="_base.css">
  <style>
    :root { --bg: #1c1c1c; --ink: #f2f2f0; --ac: #ffffff; --filtro: grayscale(1) contrast(1.06); }
    [data-cor="original"] { --bg: #1c1c1c; --ink: #f2f2f0; --ac: #ffffff; --filtro: grayscale(1) contrast(1.06); }
    [data-cor="sepia"]    { --bg: #221d16; --ink: #f4ecdd; --ac: #f0dfbf; --filtro: grayscale(1) sepia(.62) contrast(1.04); }
    [data-cor="normal"]   { --bg: #1d1f20; --ink: #f2f2f0; --ac: #ffffff; --filtro: saturate(1.05); }
    html, body { background: var(--bg); }
    .desfoque { position: absolute; inset: -20px; background: center 34% / cover no-repeat; filter: var(--filtro) blur(13px) brightness(.55); }
    .tudo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.18), rgba(0,0,0,0) 35%, rgba(0,0,0,0) 65%, rgba(0,0,0,.22)); }
    /* plaquinha escura plana; o fio de luz fica na borda */
    .moldura { background: var(--bg); border-radius: 2px; box-shadow: 0 0 0 1px color-mix(in srgb, var(--ink) 72%, transparent), 0 0 22px rgba(0, 0, 0, .55), 0 6px 14px rgba(0, 0, 0, .35); z-index: 2; }
    .moldura.redonda, .redonda .moldura { border-radius: 50%; }
    /* segundo fio, bem fino, abraçando o avatar a 2 px de distância */
    .moldura::before { content: ""; position: absolute; inset: 2px; border-radius: inherit; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 20%, transparent); }
    /* botão de play do modelo, discreto, à direita */
    .play { position: absolute; left: 322px; top: 37px; width: 26px; height: 26px; border: 1.2px solid color-mix(in srgb, var(--ink) 55%, transparent); border-radius: 50%; z-index: 2; }
    .play::after { content: ""; position: absolute; left: 9.5px; top: 7px; border-left: 8px solid color-mix(in srgb, var(--ink) 55%, transparent); border-top: 5.5px solid transparent; border-bottom: 5.5px solid transparent; }
    .fio { position: absolute; left: 218px; width: 90px; top: 49.5px; height: 1px; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--ink) 38%, transparent)); z-index: 2; }
  </style>
</head>
<body>
  <div class="tudo"><div class="desfoque" id="desf"></div><div class="fio"></div><div class="play"></div><div class="moldura" id="moldura"></div></div>
  <script src="_base.js"></script>
  <script>
    XB.pronto.then(function (d) {
      var f = "../clientes/exemplo/montanhas.jpg";
      document.getElementById("desf").style.backgroundImage = "url('" + f + "')";
      if (XB.redonda) document.getElementById("moldura").classList.add("redonda");
      XB.pronto2();
    });
  </script>
</body>
</html>
