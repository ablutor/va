<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Banner · Arco</title>
  <!-- Banner do modelo 25 · Arco: fundo liso na cor do papel e moldura de madeira (veio fino, chanfro e sombra), como a do arco do modelo.
       Quadrado: cantos de cima suavemente arredondados (sugerem o arco); redondo: círculo de madeira. -->
  <link rel="stylesheet" href="_base.css">
  <style>
    :root { --bg: #e9e1d6; --madeira: #9a6633; --madeira-clara: #b47c40; --madeira-escura: #6e4420; --vao: #1a1612; }
    [data-cor="original"]  { --bg: #e9e1d6; --madeira: #9a6633; --madeira-clara: #b47c40; --madeira-escura: #6e4420; }
    [data-cor="terracota"] { --bg: #ead3c5; --madeira: #9a6633; --madeira-clara: #b47c40; --madeira-escura: #6e4420; }
    [data-cor="oliva"]     { --bg: #dcdec9; --madeira: #5a3c21; --madeira-clara: #73502d; --madeira-escura: #3a2512; }
    html, body { background: var(--bg); }
    .tudo { background:
      radial-gradient(ellipse 60% 90% at 22% 45%, rgba(255,255,255,.28), transparent 70%),
      linear-gradient(180deg, rgba(0,0,0,0) 70%, rgba(60,40,20,.07)); }

    /* Ornamento à direita: arcos de madeira em silhueta, bem suaves */
    .arcos { position: absolute; left: 292px; top: 0; width: 88px; height: 100px; overflow: visible; }
    .arcos path { fill: color-mix(in srgb, var(--madeira) 9%, transparent); stroke: color-mix(in srgb, var(--madeira) 34%, transparent); stroke-width: 1.4; }
    .arcos .b path { fill: none; stroke: color-mix(in srgb, var(--madeira) 22%, transparent); }

    /* Moldura: madeira de 4 px em volta do vão (76×76) */
    .moldura {
      border-radius: 11px 11px 2px 2px;
      background:
        repeating-linear-gradient(89deg, transparent 0 2px, color-mix(in srgb, var(--madeira-escura) 30%, transparent) 2px 2.6px, transparent 2.6px 5.3px),
        repeating-linear-gradient(91deg, transparent 0 4px, color-mix(in srgb, var(--madeira-escura) 22%, transparent) 4px 5px, transparent 5px 7.7px, color-mix(in srgb, var(--madeira-clara) 40%, transparent) 7.7px 9px, transparent 9px 13.1px),
        linear-gradient(135deg, var(--madeira-clara), var(--madeira) 45%, var(--madeira-escura));
      box-shadow:
        inset 0 1.5px 1px rgba(255,255,255,.28),
        inset 0 -2px 2px rgba(0,0,0,.3),
        inset 1.5px 0 1px rgba(0,0,0,.14),
        inset -1.5px 0 1px rgba(0,0,0,.18),
        0 3px 5px rgba(60,40,20,.32),
        0 0 0 .6px rgba(50,30,12,.5);
    }
    .moldura.redonda, .redonda .moldura { border-radius: 50%; }
    /* Vão: plano; o rebaixo fica só na faixa de madeira (o avatar cobre o resto) */
    .vao { position: absolute; left: 4px; top: 4px; width: 76px; height: 76px; border-radius: 0; background: var(--vao); }
    .redonda .vao { border-radius: 50%; }
    .vao::after { content: ""; position: absolute; inset: -.8px; border-radius: inherit; box-shadow: inset 0 0 0 .8px rgba(20,12,6,.6); }
  </style>
</head>
<body>
  <div class="tudo">
    <svg class="arcos" viewBox="0 0 88 100">
      <path d="M20 88 V36 A24 24 0 0 1 68 36 V88 Z"/>
      <g class="b"><path d="M32 88 V50 A12 12 0 0 1 56 50 V88 Z"/></g>
    </svg>
    <div class="moldura" id="moldura"><div class="vao"></div></div>
  </div>
  <script src="_base.js"></script>
  <script>
    XB.pronto.then(function () {
      if (XB.redonda) document.getElementById("moldura").classList.add("redonda");
      XB.pronto2();
    });
  </script>
</body>
</html>
