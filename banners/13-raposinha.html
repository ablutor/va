<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Banner · Raposinha</title>
  <!-- Banner 380×100 do modelo Raposinha (família Fofinhos). Moldura em volta do avatar (84×84 em 15,6) que funciona quadrada e redonda. -->
  <link rel="stylesheet" href="_base.css">
  <style>
    :root,
    [data-cor="original"] { --bg: #fbeee2; --bg2: #fffaf4; --card: #fffcf8; --ink: #4a3226; --ac: #d4693a; --ac2: #f6d8c3; --pegada: #e4c1a7; --folha1: #e8843a; --folha2: #cf5a2e; --folha3: #f0b23e; }
    [data-cor="masculino"] { --bg: #e8efe4; --bg2: #f8fbf5; --card: #fdfefb; --ink: #25382a; --ac: #3d7a52; --ac2: #d1e4d2; --pegada: #b6cbb5; --folha1: #b5562b; --folha2: #8e3f22; --folha3: #c98a2e; }
    [data-cor="feminino"] { --bg: #fdeae6; --bg2: #fff9f7; --card: #fffcfb; --ink: #4d2b2b; --ac: #e46a64; --ac2: #f9d3cf; --pegada: #edbdb7; --folha1: #f08a7c; --folha2: #e0645e; --folha3: #f5b37a; }
    [data-cor="feminino-2"] { --bg: #f0ebf8; --bg2: #fbf9fe; --card: #fdfcff; --ink: #3b3052; --ac: #8c72c4; --ac2: #e0d6f3; --pegada: #cabedf; --folha1: #b39ade; --folha2: #e79a77; --folha3: #f1c46b; }
    html, body { background: var(--bg); }
    /* fundo: como o dos modelos, um brilho suave sobre a cor de base */
    .fundo { position: absolute; inset: 0;
      background: radial-gradient(ellipse 120px 80px at 57px 48px, var(--bg2), transparent 100%), radial-gradient(ellipse 260px 120px at 250px 40px, var(--bg2), transparent 100%), var(--bg); }
    .pegadas, .deco, .orna { position: absolute; left: 0; top: 0; width: 380px; height: 100px; overflow: visible; }
    .pegadas use { color: var(--pegada); opacity: .62; }
    html:not(.redonda) .r, .redonda .q { display: none; }
    /* moldura: papel do cartão, fio de cor por dentro e aro claro por fora; o interior fica liso */
    /* cantos: o avatar quadrado do xat tem quina reta, então o cartão arredonda só os 4 px em volta da foto (os aros de fora crescem daí) */
    .moldura { border-radius: 4px; background: var(--card);
      box-shadow: inset 0 0 0 2px var(--anel, var(--ac)), 0 0 0 2.5px var(--aro, var(--ac2)), 0 2px 5px color-mix(in srgb, var(--ac) 38%, transparent); }
    :root { --pelo: #f28a43; --pelo-sombra: #d9682c; --branco: #fffaf3; --escuro: #4b302a; --dentro: #ffd8c0; }
    .orna path { stroke: none; }
    .orna .veia { fill: none; stroke: color-mix(in srgb, var(--ink) 24%, transparent); stroke-width: .7; }
  </style>
</head>
<body>
  <div class="tudo">
    <div class="fundo"></div>
    <svg class="pegadas" id="pegadas" viewBox="0 0 380 100"><defs><symbol id="pegada" viewBox="0 0 100 100"><g fill="currentColor"><path d="M50 54 C64 54 74 66 72 78 C70 88 60 88 50 86 C40 88 30 88 28 78 C26 66 36 54 50 54 Z"/><ellipse cx="22" cy="44" rx="8" ry="11" transform="rotate(-25 22 44)"/><ellipse cx="40" cy="26" rx="8.5" ry="12" transform="rotate(-8 40 26)"/><ellipse cx="60" cy="26" rx="8.5" ry="12" transform="rotate(8 60 26)"/><ellipse cx="78" cy="44" rx="8" ry="11" transform="rotate(25 78 44)"/></g></symbol></defs></svg>
    <svg class="orna" viewBox="0 0 380 100">
      <defs>
        <g id="orelha">
          <path d="M-9 4 C-9 -6 -5 -13 0 -19 C5 -13 9 -6 9 4 Z" fill="var(--pelo)"/>
          <path d="M-4.6 3 C-4.6 -4 -2.6 -9 0 -13 C2.6 -9 4.6 -4 4.6 3 Z" fill="var(--dentro)"/>
          <path d="M-4.9 -12 C-3.2 -15 -1.6 -17.6 0 -19 C1.6 -17.6 3.2 -15 4.9 -12 C2.2 -13.2 -2.2 -13.2 -4.9 -12 Z" fill="var(--escuro)"/>
        </g>
        <g id="rabo">
          <path d="M0 3 C-10 1 -11 -9 -6 -14 C-3.5 -17 0 -17 0 -17 C0 -17 3.5 -17 6 -14 C11 -9 10 1 0 3 Z" fill="var(--pelo)"/>
          <path d="M-6.8 -11 C-3 -9 3 -9 6.8 -11 C5.6 -14 3.5 -17 0 -17 C-3.5 -17 -5.6 -14 -6.8 -11 Z" fill="var(--branco)"/>
        </g>
        <g id="folha"><path d="M0 0 C0 10 6 16 16 16 C16 6 10 0 0 0 Z"/><path class="veia" d="M2 2 L13 13"/></g>
      </defs>
      <g class="q">
        <use href="#rabo" transform="translate(89 79) rotate(135) scale(1.25)"/>
      </g>
      <g class="r">
        <use href="#rabo" transform="translate(57 48) rotate(135) translate(0 -37) scale(1.25)"/>
      </g>
      <g opacity=".95">
        <use href="#folha" fill="var(--folha1)" transform="translate(236 18) rotate(20) scale(.9)"/>
        <use href="#folha" fill="var(--folha3)" transform="translate(270 40) rotate(-50) scale(.75)"/>
        <use href="#folha" fill="var(--folha2)" transform="translate(300 12) rotate(75) scale(.85)"/>
        <use href="#folha" fill="var(--folha1)" transform="translate(332 36) rotate(-15) scale(1)"/>
        <use href="#folha" fill="var(--folha3)" transform="translate(354 14) rotate(40) scale(.7)"/>
      </g>
    </svg>
    <div class="moldura" id="moldura"></div>
    <svg class="orna" viewBox="0 0 380 100">
      <g class="q">
        <use href="#orelha" transform="translate(16.5 7.5) rotate(-45) scale(.58)"/>
        <use href="#orelha" transform="translate(97.5 7.5) rotate(45) scale(.58)"/>
      </g>
      <g class="r">
        <use href="#orelha" transform="translate(57 48) rotate(-42) translate(0 -42) scale(.85)"/>
        <use href="#orelha" transform="translate(57 48) rotate(42) translate(0 -42) scale(.85)"/>
      </g>
    </svg>
  </div>
  <script src="_base.js"></script>
  <script>
    // trilha de pegadinhas no lado direito e embaixo, longe das etiquetas do xat
    var P = [[226,82,72],[242,70,80],[258,82,76],[274,69,84],[290,81,80],[306,68,88],[322,80,84],[338,67,92],[354,79,88]];
    document.getElementById("pegadas").insertAdjacentHTML("beforeend", P.map(function (p) {
      var s = p[3] || 14;
      return '<use href="#pegada" x="' + (-s / 2) + '" y="' + (-s / 2) + '" width="' + s + '" height="' + s + '" transform="translate(' + p[0] + ' ' + p[1] + ') rotate(' + p[2] + ')"/>';
    }).join(""));
    XB.pronto.then(function () { XB.pronto2(); });
  </script>
</body>
</html>
