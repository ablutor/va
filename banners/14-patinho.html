<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Banner · Patinho</title>
  <!-- Banner 380×100 do modelo Patinho (família Fofinhos). Moldura em volta do avatar (84×84 em 15,6) que funciona quadrada e redonda. -->
  <link rel="stylesheet" href="_base.css">
  <style>
    :root,
    [data-cor="original"] { --bg: #fdf6e1; --bg2: #fffdf4; --card: #fffefa; --ink: #4a3a20; --ac: #e8921c; --ac2: #fbe5b0; --pegada: #e2cda4; --agua: #bfe3f4; }
    [data-cor="masculino"] { --bg: #e6f1fa; --bg2: #f7fbfe; --card: #fdfeff; --ink: #263a52; --ac: #4f8fd0; --ac2: #d0e4f5; --pegada: #b6cfe6; --agua: #b5daf2; }
    [data-cor="feminino"] { --bg: #fcece6; --bg2: #fffaf7; --card: #fffcfb; --ink: #4d2f2a; --ac: #e67d70; --ac2: #f9d6cd; --pegada: #eec4b8; --agua: #c3e0f0; }
    [data-cor="feminino-2"] { --bg: #e8f6ef; --bg2: #f8fdfa; --card: #fdfffe; --ink: #25443a; --ac: #3fa77f; --ac2: #cbeadb; --pegada: #b3dbc8; --agua: #b7e2e6; }
    html, body { background: var(--bg); }
    /* fundo: como o dos modelos, um brilho suave sobre a cor de base */
    .fundo { position: absolute; inset: 0;
      background: radial-gradient(ellipse 120px 80px at 57px 48px, var(--bg2), transparent 100%), radial-gradient(ellipse 260px 120px at 250px 40px, var(--bg2), transparent 100%), var(--bg); }
    .pegadas, .deco, .orna { position: absolute; left: 0; top: 0; width: 380px; height: 100px; overflow: visible; }
    .pegadas use { color: var(--pegada); opacity: .62; }
    html:not(.redonda) .r, .redonda .q { display: none; }
    /* moldura: papel do cartão, fio de cor por dentro e aro claro por fora; o interior fica liso */
    /* cantos: o avatar quadrado do xat tem quina reta, então o cartão arredonda só os 4 px em volta da foto (os aros de fora crescem daí) */
    .moldura { border-radius: 4px; background: var(--card);
      box-shadow: inset 0 0 0 2px var(--anel, var(--ac)), 0 0 0 2.5px var(--aro, var(--ac2)), 0 2px 5px color-mix(in srgb, var(--ac) 38%, transparent); }
    :root { --pena: #fff5bf; --pena-meio: #ffdf5e; --pena-sombra: #f5b83a; --bico: #ff9636; --bico-sombra: #e06c1e; }
    .moldura { --anel: var(--pena-meio); box-shadow: inset 0 0 0 2.5px var(--pena-meio), inset 0 0 0 3.5px var(--pena-sombra), 0 0 0 2.5px var(--ac2), 0 2px 5px color-mix(in srgb, var(--ac) 38%, transparent); }
    .lagoa { fill: var(--agua); }
    .onda { fill: none; stroke: color-mix(in srgb, var(--agua) 55%, #fff); stroke-width: 1.3; }
    .onda-s { stroke: color-mix(in srgb, var(--agua) 70%, var(--ink)); opacity: .5; }
    .pe { fill: var(--bico); stroke: var(--bico-sombra); stroke-width: 1; stroke-linejoin: round; }
    .tufo { fill: none; stroke-linecap: round; }
  </style>
</head>
<body>
  <div class="tudo">
    <div class="fundo"></div>
    <svg class="pegadas" id="pegadas" viewBox="0 0 380 100"><defs><symbol id="pegada" viewBox="0 0 100 100"><g fill="currentColor" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round"><path stroke-width="12" d="M50 84 L18 32 Q34 40 50 14 Q66 40 82 32 Z"/><circle cx="50" cy="88" r="8" stroke="none"/></g></symbol></defs></svg>
    <svg class="orna" viewBox="0 0 380 100">
      <defs>
        <radialGradient id="lg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="var(--agua)" stop-opacity=".9"/><stop offset=".7" stop-color="var(--agua)" stop-opacity=".55"/><stop offset="1" stop-color="var(--agua)" stop-opacity="0"/></radialGradient>
        <g id="pe"><path class="pe" d="M-3.4 -4 L3.4 -4 L7 4.6 Q5.2 3.9 4.6 5.6 Q2.4 4 0 5.8 Q-2.4 4 -4.6 5.6 Q-5.2 3.9 -7 4.6 Z"/></g>
      </defs>
      <ellipse cx="300" cy="94" rx="96" ry="17" fill="url(#lg)"/>
      <ellipse class="onda" cx="268" cy="90" rx="22" ry="5"/><ellipse class="onda" cx="268" cy="90" rx="12" ry="2.6"/>
      <ellipse class="onda" cx="338" cy="87" rx="26" ry="6"/><ellipse class="onda" cx="338" cy="87" rx="14" ry="3"/>
      <ellipse class="onda onda-s" cx="304" cy="96" rx="10" ry="2.2"/>
      <circle cx="238" cy="34" r="2.2" fill="var(--agua)"/><circle cx="246" cy="26" r="1.5" fill="var(--agua)"/>
      <circle cx="352" cy="22" r="2.6" fill="var(--agua)"/><circle cx="344" cy="14" r="1.6" fill="var(--agua)"/>
    </svg>
    <div class="moldura" id="moldura"></div>
    <svg class="orna" viewBox="0 0 380 100">
      <g class="q">
        <use href="#pe" transform="translate(44 91) rotate(-8) scale(1.05)"/><use href="#pe" transform="translate(70 91) rotate(8) scale(1.05)"/>
      </g>
      <g class="r">
        <use href="#pe" transform="translate(45 89.5) rotate(-14) scale(1.05)"/><use href="#pe" transform="translate(69 89.5) rotate(14) scale(1.05)"/>
      </g>
      <g class="tufo">
        <path d="M57 7 C56 3 52 1.5 49.5 2.2" stroke="var(--pena-sombra)" stroke-width="3.2"/>
        <path d="M57 7 C58 3 62 1.5 64.5 2.2" stroke="var(--pena-sombra)" stroke-width="3.2"/>
        <path d="M57 7 C57 4 57 2.6 57 1.4" stroke="var(--pena-sombra)" stroke-width="3.2"/>
        <path d="M57 7 C56 3 52 1.5 49.5 2.2" stroke="var(--pena-meio)" stroke-width="1.8"/>
        <path d="M57 7 C58 3 62 1.5 64.5 2.2" stroke="var(--pena-meio)" stroke-width="1.8"/>
        <path d="M57 7 C57 4 57 2.6 57 1.4" stroke="var(--pena-meio)" stroke-width="1.8"/>
      </g>
    </svg>
  </div>
  <script src="_base.js"></script>
  <script>
    // trilha de pegadinhas no lado direito e embaixo, longe das etiquetas do xat
    var P = [[222,64,80],[238,52,72],[254,62,72],[270,50,64],[286,60,74],[302,48,66],[318,58,76],[334,44,68],[350,52,78],[364,40,70]];
    document.getElementById("pegadas").insertAdjacentHTML("beforeend", P.map(function (p) {
      var s = p[3] || 14;
      return '<use href="#pegada" x="' + (-s / 2) + '" y="' + (-s / 2) + '" width="' + s + '" height="' + s + '" transform="translate(' + p[0] + ' ' + p[1] + ') rotate(' + p[2] + ')"/>';
    }).join(""));
    XB.pronto.then(function () { XB.pronto2(); });
  </script>
</body>
</html>
