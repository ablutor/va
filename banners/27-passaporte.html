<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Banner · Passaporte</title>
  <!-- Página de identificação de um passaporte: papel verde com linhas de segurança (guilhoché), dobra, zona de leitura
       em barrinhas, carimbos nos vistos. A moldura é o quadro da foto, com um carimbo que escapa pelo canto. -->
  <link rel="stylesheet" href="_base.css">
  <style>
    :root,
    [data-cor="original"] {
      --papel: #e9ece4; --papel-2: #e2e6dc;
      --guil: rgba(92, 128, 160, .16); --guil-2: rgba(96, 140, 110, .15);
      --dobra: rgba(40, 52, 50, .26);
      --tinta: #3a4a5e;
      --quadro: #f2f4ec; --quadro-linha: #4d6585;
      --vermelho: #b8373c; --azul: #3a63a0; --roxo: #7b44a3; --verde: #3e7a45;
    }
    html, body { background: var(--papel); }
    .tudo {
      background-color: var(--papel);
      background-image:
        repeating-radial-gradient(circle at -60% 260%, transparent 0 4px, var(--guil) 4.2px 5px),
        repeating-radial-gradient(circle at 150% 250%, transparent 0 4px, var(--guil-2) 4.2px 5px),
        linear-gradient(160deg, var(--papel), var(--papel-2));
    }
    /* dobra do livro */
    .dobra { position: absolute; top: 0; bottom: 0; left: 276px; width: 44px;
      background: linear-gradient(90deg, rgba(40, 52, 50, 0), var(--dobra) 46%, rgba(40, 52, 50, .08) 54%, rgba(40, 52, 50, 0)); }
    .dobra::after { content: ""; position: absolute; left: 22px; top: 0; bottom: 0; width: 1px; background: rgba(40, 52, 50, .22); }
    /* zona de leitura: barrinhas em duas linhas, como as letras da MRZ */
    .mrz { position: absolute; left: 110px; height: 5px; background:
        repeating-linear-gradient(90deg, rgba(28, 35, 45, .6) 0 2px, transparent 2px 3px, rgba(28, 35, 45, .6) 3px 4px, transparent 4px 6px, rgba(28, 35, 45, .6) 6px 7px, transparent 7px 9px); }
    .mrz.a { top: 84px; width: 150px; }
    .mrz.b { top: 91px; width: 168px; -webkit-mask: linear-gradient(90deg, #000 0 92%, transparent 92% 100%); }
    /* linha tracejada (campos) discreta no alto, à direita das etiquetas */
    .regua { position: absolute; left: 109px; top: 8px; width: 150px; height: 1px; background: repeating-linear-gradient(90deg, rgba(58, 74, 94, .35) 0 3px, transparent 3px 5px); }

    /* ---- Carimbos ---- */
    .carimbo { position: absolute; mix-blend-mode: multiply; opacity: .92; }
    .redondo { border: 1.4px solid currentColor; border-radius: 50%; }
    .redondo::before { content: ""; position: absolute; inset: 3px; border: 1.2px solid currentColor; border-radius: 50%; }
    .redondo svg { position: absolute; left: 50%; top: 50%; width: 46%; height: 46%; transform: translate(-50%, -50%); fill: currentColor; }
    .quadrado { border: 2px solid currentColor; border-radius: 3px; }
    .quadrado::before { content: ""; position: absolute; left: 4px; right: 4px; top: 50%; height: 2px; background: currentColor; box-shadow: 0 -5px 0 currentColor, 0 5px 0 currentColor; opacity: .75; }
    .vermelho { color: var(--vermelho); } .azul { color: var(--azul); } .roxo { color: var(--roxo); } .verde { color: var(--verde); }
    /* o que escapa da moldura: carimbo vermelho em cima do canto da foto */
    .c-entrada { left: 60px; top: 58px; width: 29px; height: 29px; transform: rotate(-12deg); opacity: .95; }
    .c-visto { left: 311px; top: 12px; width: 44px; height: 44px; transform: rotate(-8deg); }
    .c-quadro { left: 296px; top: 62px; width: 52px; height: 26px; transform: rotate(-6deg); }
    .c-clube { left: 352px; top: 42px; width: 36px; height: 36px; transform: rotate(8deg); opacity: .8; }

    /* ---- Moldura: quadro da foto ---- */
    .moldura { z-index: 5; border-radius: 3px; }
    .moldura .aro { position: absolute; inset: 0; border-radius: inherit; background: var(--quadro);
      border: 1px solid var(--quadro-linha); box-shadow: 0 1px 3px rgba(30, 40, 50, .4), 0 0 0 1px rgba(255, 255, 255, .5); }
    .moldura .aro::before { content: ""; position: absolute; inset: 1.5px; border-radius: inherit; border: 1px solid rgba(77, 101, 133, .45); }
    /* linhas de impressão finas, só na margem de 4 px (o interior fica liso) */
    .moldura .aro::after { content: ""; position: absolute; inset: 0; border-radius: inherit;
      background: repeating-linear-gradient(0deg, rgba(77, 101, 133, .14) 0 1px, transparent 1px 3px); }
    .moldura .miolo { position: absolute; left: 4px; top: 4px; width: 76px; height: 76px; border-radius: 0; background: var(--quadro); }
    .redonda .moldura .miolo { border-radius: 50%; }
    .redonda .moldura .aro::after { border-radius: 50%; }
    /* no círculo, o quadro vira medalhão: o cantinho do quadrado fica com o papel do quadro */
    .moldura .cantos { position: absolute; inset: 0; }
    .moldura .cantos i { position: absolute; width: 5px; height: 5px; border: 1.2px solid var(--quadro-linha); }
    .moldura .cantos i:nth-child(1) { left: -3px; top: -3px; border-width: 1.2px 0 0 1.2px; }
    .moldura .cantos i:nth-child(2) { right: -3px; top: -3px; border-width: 1.2px 1.2px 0 0; }
    .moldura .cantos i:nth-child(3) { left: -3px; bottom: -3px; border-width: 0 0 1.2px 1.2px; }
    .moldura .cantos i:nth-child(4) { right: -3px; bottom: -3px; border-width: 0 1.2px 1.2px 0; }
    .redonda .moldura .cantos { display: none; }
  </style>
</head>
<body>
  <div class="tudo">
    <div class="dobra"></div>
    <div class="regua"></div>
    <div class="mrz a"></div><div class="mrz b"></div>

    <!-- vistos -->
    <div class="carimbo redondo vermelho c-visto"><svg viewBox="0 0 24 24"><path d="M21 14.5v-2l-8-5V2.5a1.5 1.5 0 0 0-3 0v5l-8 5v2l8-2.5v5l-2 1.5V20l3.5-1 3.5 1v-1.5l-2-1.5v-5z" transform="rotate(90 12 12)"/></svg></div>
    <div class="carimbo quadrado azul c-quadro"></div>
    <div class="carimbo redondo verde c-clube"></div>

    <div class="moldura" id="moldura">
      <div class="aro"></div>
      <div class="cantos"><i></i><i></i><i></i><i></i></div>
      <!-- carimbo que escapa pelo canto: fica entre o aro e o interior (que continua liso) -->
      <div class="carimbo redondo vermelho c-entrada"></div>
      <div class="miolo"></div>
    </div>
  </div>
  <script src="_base.js"></script>
  <script>
    XB.pronto.then(function () { XB.pronto2(); });
  </script>
</body>
</html>
