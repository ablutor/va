<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Banner · Madrugada lo-fi</title>
  <!-- Madrugada lo-fi: parede listrada com luzinhas, o retrato emoldurado (madeira, passe-partout creme e luminária de latão),
       a janela da noite chuvosa à direita e o tampo da mesa embaixo. Cores iguais às do modelo. -->
  <link rel="stylesheet" href="_base.css">
  <style>
    :root, [data-cor="original"] {
      --w1: #1b1546; --w2: #241a57; --w3: #1a1240; --stripe: rgba(255,255,255,.028); --dots: rgba(200,180,255,.07);
      --s1: #0a0829; --s2: #25175a; --s3: #6a3a8c; --s4: #d56f8e; --c1: #3a2a78; --c2: #2a1d62; --c3: #190f42;
      --lj-b: #ff9ac8; --lj-c: #8fe3ff; --fr1: #4b3a74; --fr2: #2a1f4d; --frl: rgba(190,170,255,.28); --sill: #5c4a8a;
      --wd1: #8a5a3c; --wd2: #6e4630; --wd3: #4f3223; --wtop: #a06b48; --wf1: #5c3b2c; --wf2: #34211f; --leaf: #2a8a7a; --leaf2: #1f6a62;
    }
    [data-cor="masculino"] {
      --w1: #0a1634; --w2: #0f2048; --w3: #09132c; --stripe: rgba(190,220,255,.03); --dots: rgba(150,200,255,.08);
      --s1: #050a1e; --s2: #0b2050; --s3: #1c4a86; --s4: #6fb6d8; --c1: #1f3a78; --c2: #14285a; --c3: #0a1636;
      --lj-b: #8fe3ff; --lj-c: #ffffff; --fr1: #2c4a7a; --fr2: #16284c; --frl: rgba(150,200,255,.28); --sill: #3a5a8a;
      --wd1: #7d5638; --wd2: #62402c; --wd3: #47301f; --wtop: #946444; --wf1: #4f3427; --wf2: #2c1d1c;
    }
    [data-cor="feminino"] {
      --w1: #340f40; --w2: #4a1558; --w3: #2e0a38; --stripe: rgba(255,200,235,.03); --dots: rgba(255,170,220,.08);
      --s1: #1c0828; --s2: #5a1668; --s3: #c43f8a; --s4: #ffa78f; --c1: #5a2a70; --c2: #431e5a; --c3: #2a1040;
      --lj-b: #ffa6d0; --lj-c: #ffffff; --fr1: #7a3a78; --fr2: #4a1e4c; --frl: rgba(255,190,230,.3); --sill: #8a4a88;
    }
    [data-cor="feminino-2"] {
      --w1: #342472; --w2: #46328c; --w3: #32226a; --stripe: rgba(235,225,255,.035); --dots: rgba(220,200,255,.09);
      --s1: #1a1058; --s2: #4c3aa8; --s3: #a58af0; --s4: #f0d0ff; --c1: #5a48b0; --c2: #43358f; --c3: #2a206a;
      --lj-b: #d9c0ff; --lj-c: #ffffff; --fr1: #6a58b0; --fr2: #3a2d78; --frl: rgba(210,195,255,.3); --sill: #7a68c0;
    }
    html, body { background: var(--w3); }
    /* parede: listras verticais, pontinhos e escurecimento nas pontas */
    .tudo { background:
      repeating-linear-gradient(90deg, var(--stripe) 0 6px, transparent 6px 12px),
      linear-gradient(180deg, var(--w2), var(--w1) 55%, var(--w3)); }
    .tudo::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, var(--dots) 0 .7px, transparent 1px) 0 0 / 7px 7px; }
    .tudo::after { content: ""; position: absolute; inset: 0; background: radial-gradient(75% 130% at 22% 38%, rgba(255,196,130,.10), transparent 70%), linear-gradient(90deg, rgba(5,2,20,.35), transparent 30%, transparent 72%, rgba(5,2,20,.38)); pointer-events: none; }
    svg.cena { position: absolute; left: 0; top: 0; width: 380px; height: 100px; }
    /* o quadro: moldura de madeira, filete claro, e o passe-partout creme (plano) onde fica o avatar */
    .moldura { background: linear-gradient(145deg, #6a4529, #3b2415 55%, #52341e); border-radius: 2px;
      box-shadow: 0 7px 11px rgba(4,2,20,.55), 0 1px 2px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,205,150,.22), inset 0 0 0 2px rgba(0,0,0,.32); z-index: 3; }
    .moldura.redonda, .redonda .moldura { border-radius: 50%; }
    .moldura::before { content: ""; position: absolute; inset: 3px; border-radius: inherit; background: #eee4d0; box-shadow: inset 0 0 0 .6px rgba(0,0,0,.35), inset 0 1px 3px rgba(0,0,0,.28); }
    /* luminária de latão presa na moldura */
    .lamp { position: absolute; left: 31px; top: 0; width: 52px; height: 9px; z-index: 4; }
  </style>
</head>
<body>
  <div class="tudo">
    <svg class="cena" viewBox="0 0 380 100" id="cena">
      <defs>
        <linearGradient id="gCeu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--s1)"/><stop offset=".5" stop-color="var(--s2)"/><stop offset=".82" stop-color="var(--s3)"/><stop offset="1" stop-color="var(--s4)"/></linearGradient>
        <linearGradient id="gFr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--fr1)"/><stop offset="1" stop-color="var(--fr2)"/></linearGradient>
        <linearGradient id="gMesa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--wd1)"/><stop offset=".35" stop-color="var(--wd2)"/><stop offset="1" stop-color="var(--wd3)"/></linearGradient>
        <linearGradient id="gMesaF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--wf1)"/><stop offset="1" stop-color="var(--wf2)"/></linearGradient>
        <clipPath id="cJan"><rect x="241" y="16" width="104" height="66"/></clipPath>
        <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.2"/></filter>
      </defs>

      <!-- janela: céu, lua, prédios, chuva, vidraça -->
      <g clip-path="url(#cJan)">
        <rect x="241" y="16" width="104" height="66" fill="url(#gCeu)"/>
        <circle cx="325" cy="31" r="7.5" fill="#e6dcc8"/><circle cx="328" cy="29" r="6.6" fill="var(--s1)" opacity=".92"/>
        <g fill="#fff" opacity=".7"><circle cx="262" cy="26" r=".7"/><circle cx="283" cy="22" r=".6"/><circle cx="300" cy="29" r=".7"/><circle cx="309" cy="21" r=".5"/><circle cx="276" cy="36" r=".5"/></g>
        <g id="pred"></g>
        <g id="chuva" stroke="#cfd0ff" stroke-width=".5" opacity=".28"></g>
      </g>
      <rect x="239" y="14" width="108" height="70" fill="none" stroke="url(#gFr)" stroke-width="4"/>
      <rect x="239" y="14" width="108" height="70" fill="none" stroke="var(--frl)" stroke-width=".6" transform="translate(-1.8 -1.8) scale(1)" opacity="0"/>
      <path d="M293 16V82M241 49H345" stroke="url(#gFr)" stroke-width="2.4"/>
      <rect x="236" y="82" width="114" height="4" rx="1" fill="var(--sill)"/>
      <rect x="236" y="82" width="114" height=".8" fill="var(--frl)"/>

      <!-- folhas da planta, à direita (dentro da faixa útil) -->
      <g>
        <path d="M356 94C354 80 357 68 366 56C368 70 365 84 358 94Z" fill="var(--leaf)"/>
        <path d="M356 94C352 84 346 78 338 76C342 86 349 92 356 94Z" fill="var(--leaf2)"/>
        <path d="M356 94C357 84 360 76 366 56" stroke="rgba(0,0,0,.25)" stroke-width=".6" fill="none"/>
      </g>

      <!-- tampo da mesa -->
      <rect x="0" y="92" width="380" height="8" fill="url(#gMesaF)"/>
      <rect x="0" y="91" width="380" height="3" fill="url(#gMesa)"/>
      <rect x="0" y="91" width="380" height=".8" fill="var(--wtop)"/>

      <!-- fio de luzinhas: duas ondas no alto, sem passar por cima do quadro nem da janela -->
      <path id="fio" d="M104 0 Q150 14 196 3 T290 3 T372 2" fill="none" stroke="rgba(10,6,30,.75)" stroke-width=".7"/>
      <g id="luz"></g>
    </svg>
    <svg class="lamp" viewBox="0 0 52 9">
      <defs><linearGradient id="gLat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8c46a"/><stop offset=".55" stop-color="#b98a30"/><stop offset="1" stop-color="#6e4d16"/></linearGradient></defs>
      <path d="M17 9L21 4.6M35 9L31 4.6" stroke="url(#gLat)" stroke-width="1.2" stroke-linecap="round"/>
      <rect x="11" y="1.4" width="30" height="3.8" rx="1.9" fill="url(#gLat)"/>
      <rect x="13" y="1.8" width="26" height=".7" rx=".35" fill="#ffe9a8" opacity=".55"/>
    </svg>
    <div class="moldura" id="moldura"></div>
  </div>
  <script src="_base.js"></script>
  <script>
    XB.pronto.then(function (d) {
      var NS = "http://www.w3.org/2000/svg";
      function el(p, t, a) { var e = document.createElementNS(NS, t); for (var k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; }
      if (XB.redonda) document.getElementById("moldura").classList.add("redonda");
      // prédios (deterministas)
      var pred = document.getElementById("pred"), x = 241, cls = ["var(--c1)", "var(--c2)", "var(--c3)"], i = 0;
      var ws = [14, 11, 16, 12, 18, 13, 15, 10, 14];
      ws.forEach(function (w) {
        var h = 14 + ((i * 7) % 5) * 4 + (i % 2) * 3, y = 82 - h;
        el(pred, "rect", { x: x, y: y, width: w, height: h + 2, fill: cls[i % 3] });
        for (var jy = y + 3; jy < 80; jy += 4) for (var jx = x + 2; jx < x + w - 2; jx += 4) {
          if (((jx * 13 + jy * 7 + i) % 5) < 2) el(pred, "rect", { x: jx, y: jy, width: 1.6, height: 1.8, fill: (i + jy) % 3 ? "#ffc86b" : "var(--lj-b)", opacity: ".85" });
        }
        x += w; i++;
      });
      // chuva
      var ch = document.getElementById("chuva");
      for (var k = 0; k < 26; k++) { var cx = 241 + (k * 37) % 104, cy = 16 + (k * 23) % 60; el(ch, "line", { x1: cx, y1: cy, x2: cx - 1.6, y2: cy + 7 }); }
      // luzinhas ao longo do fio (pontos escolhidos à mão sobre a curva)
      var luz = document.getElementById("luz"), fio = document.getElementById("fio"), L = fio.getTotalLength();
      var cores = ["#ffc86b", "var(--lj-b)", "#ffe6a8", "var(--lj-c)"], n = 13;
      for (var b = 0; b < n; b++) {
        var p = fio.getPointAtLength(L * (0.04 + b * 0.92 / (n - 1)));
        el(luz, "circle", { cx: p.x, cy: p.y + 2.4, r: 3.4, fill: cores[b % 4], opacity: ".5", filter: "url(#glow)" });
        el(luz, "ellipse", { cx: p.x, cy: p.y + 2.2, rx: 1.4, ry: 2, fill: cores[b % 4] });
      }
      XB.pronto2();
    });
  </script>
</body>
</html>
