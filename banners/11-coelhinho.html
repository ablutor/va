<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Banner · Coelhinho</title>
  <!-- Banner do modelo 11 · Coelhinho (Fofinhos): fundo pastel com pegadas de coelho e moldura de cartão branco com orelhinhas
       (quadrada ou em aro redondo). O interior da moldura é liso. -->
  <link rel="stylesheet" href="_base.css">
  <style>
    :root { --bg: #efe2f3; --bg2: #f8effa; --card: #fffbfe; --ac: #b56fc0; --ac2: #ecd5f0; --pegada: #d9bde0; --orelha: #f3c6dc; }
    [data-cor="original"]   { --bg: #efe2f3; --bg2: #f8effa; --card: #fffbfe; --ac: #b56fc0; --ac2: #ecd5f0; --pegada: #d9bde0; --orelha: #f3c6dc; }
    [data-cor="masculino"]  { --bg: #dde9f4; --bg2: #edf4fa; --card: #fdfeff; --ac: #5f93c9; --ac2: #d2e4f4; --pegada: #b9d0e6; --orelha: #f2cbd4; }
    [data-cor="feminino"]   { --bg: #f9e3e8; --bg2: #fdf1f4; --card: #fffcfc; --ac: #e07895; --ac2: #f8d6de; --pegada: #ecc1cb; --orelha: #f6b9c8; }
    [data-cor="feminino-2"] { --bg: #ddf0e8; --bg2: #edf7f3; --card: #fdfffe; --ac: #4fae88; --ac2: #cdebdd; --pegada: #b5dccb; --orelha: #f4c7d3; }
    html, body { background: var(--bg); }
    .tudo { background: radial-gradient(ellipse 60% 120% at 40% 50%, var(--bg2), transparent 75%), var(--bg); }
    .pg { position: absolute; width: 15px; height: 15px; color: var(--pegada); }
    .pg svg { width: 100%; height: 100%; display: block; }
    /* orelhinhas: ficam atrás da moldura e só aparecem as pontas */
    .orelha { position: absolute; z-index: 2; width: 15px; height: 13px; top: 0.5px; border-radius: 50%; background: var(--card); box-shadow: 0 0 0 2px var(--ac2), 0 1px 3px color-mix(in srgb, var(--ac) 25%, transparent); }
    .orelha::after { content: ""; position: absolute; left: 3.5px; right: 3.5px; top: 3px; bottom: 3px; border-radius: 50%; background: var(--orelha); }
    .e1 { left: 31px; transform: rotate(-9deg); } .e2 { left: 71px; transform: rotate(10deg); }
    .redonda .orelha { z-index: 0; height: 24px; } .redonda .orelha::after { bottom: 9px; }
    .redonda .e1 { left: 25px; top: 2px; transform: rotate(-30deg); } .redonda .e2 { left: 77px; top: 2px; transform: rotate(30deg); }
    /* O avatar quadrado do xat não tem cantos redondos: o cartão arredonda só os 4 px que sobram em volta da foto, e os aros
       de fora crescem a partir daí (raio de fora = raio de dentro + espessura), para a curva acompanhar o canto reto da foto */
    .moldura { z-index: 1; border-radius: 4px; background: var(--card);
      box-shadow: 0 0 0 2.5px var(--ac2), 0 0 0 4px color-mix(in srgb, var(--card) 70%, transparent), 0 5px 12px color-mix(in srgb, var(--ac) 28%, transparent); }
    .moldura::before { content: ""; position: absolute; inset: 1px; border-radius: inherit; border: 1.5px dotted color-mix(in srgb, var(--ac) 45%, var(--card)); }
    .moldura.redonda, .redonda .moldura { border-radius: 50%; }
    .patinha { position: absolute; left: 95px; top: 79px; width: 14px; height: 14px; color: var(--ac); transform: rotate(14deg); }
    .redonda .patinha { left: 86px; top: 80px; }
    .patinha svg { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="pegada" viewBox="0 0 100 100"><g fill="currentColor"><ellipse cx="34" cy="30" rx="12" ry="25"/><ellipse cx="66" cy="30" rx="12" ry="25"/><circle cx="43" cy="76" r="10"/><circle cx="57" cy="92" r="8"/></g></symbol>
  </defs></svg>
  <div class="tudo" id="tudo">
    <div class="orelha e1"></div><div class="orelha e2"></div>
    <div class="moldura" id="moldura"></div>
    <div class="patinha"><svg viewBox="0 0 100 100"><use href="#pegada"/></svg></div>
  </div>
  <script src="_base.js"></script>
  <script>
    XB.pronto.then(function () {
      // rastro de pegadas: um coelhinho passando pelo lado direito (a zona das etiquetas fica quase limpa)
      var P = [[124,88,20,.5],[150,76,-8,.45],[178,90,16,.4],[218,72,-6,.9],[240,84,22,.9],[262,66,-10,1],[286,78,18,1],[308,56,-4,1],[332,66,20,1],[354,42,-8,1],[342,18,12,.9],[300,22,-14,.8],[262,14,8,.7]];
      var t = document.getElementById("tudo");
      P.forEach(function (p) {
        var d = document.createElement("div"); d.className = "pg";
        d.style.left = (p[0] - 7) + "px"; d.style.top = (p[1] - 7) + "px"; d.style.opacity = p[3];
        d.style.transform = "rotate(" + p[2] + "deg)";
        d.innerHTML = '<svg viewBox="0 0 100 100"><use href="#pegada"/></svg>';
        t.insertBefore(d, t.firstChild);
      });
      XB.pronto2();
    });
  </script>
</body>
</html>
