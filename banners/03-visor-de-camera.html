<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Banner · Visor de câmera</title>
  <!-- Banner do Visor de câmera: fundo liso do tema (sem foto: a do modelo é a da pessoa), cantos do visor, barra de nível embaixo e a moldura é o quadro de foco (AF) -->
  <link rel="stylesheet" href="_base.css">
  <link rel="stylesheet" href="../core/cores.css">
  <style>
    /* Mesmas cores do modelo (style.css) */
    :root, [data-cor="original"]   { --bg: #000; --ink: #fff; --ac: #9fff7a; --rec: #ff3b30; --barra: rgba(0, 0, 0, .55); }
    [data-cor="masculino"]  { --ac: #5ee7ff; }
    [data-cor="feminino"]   { --ac: #ff7ad9; }
    [data-cor="feminino-2"] { --ac: #ffd27a; }
    [data-cor^="pastel-"]   { --bg: var(--p-bg); --ink: var(--p-ink); --ac: var(--p-act); --rec: #d9443a; --barra: color-mix(in srgb, var(--p-bg2) 80%, transparent); }

    html, body { background: var(--bg); }
    /* sem foto de fundo: a do modelo é a da pessoa, e o banner não leva foto de gente. Só um clarão leve do lado direito */
    .tudo { background: radial-gradient(ellipse 60% 140% at 72% 50%, color-mix(in srgb, var(--ac) 7%, var(--bg)), var(--bg) 75%); }

    /* regra dos terços (só a linha da direita: as etiquetas ficam sobre um fundo limpo) */
    .terco { position: absolute; top: 0; bottom: 0; left: 253px; width: 1px; background: color-mix(in srgb, var(--ink) 16%, transparent); }
    /* cantos do visor à direita */
    .canto { position: absolute; width: 14px; height: 14px; border: 0 solid color-mix(in srgb, var(--ink) 85%, transparent); }
    .canto.a { right: 14px; top: 10px; border-top-width: 2px; border-right-width: 2px; }
    .canto.b { right: 14px; bottom: 14px; border-bottom-width: 2px; border-right-width: 2px; }
    /* ponto de REC e bateria */
    .rec { position: absolute; left: 114px; top: 9px; width: 6px; height: 6px; border-radius: 50%; background: var(--rec); box-shadow: 0 0 5px var(--rec); }
    .bateria { position: absolute; left: 322px; top: 14px; width: 21px; height: 8px; border: 1px solid var(--ink); border-radius: 1px; }
    .bateria::before { content: ""; position: absolute; left: 1px; top: 1px; bottom: 1px; width: 11px; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 3px); }
    .bateria::after { content: ""; position: absolute; right: -3px; top: 1px; width: 2px; height: 4px; background: var(--ink); }
    /* barra de baixo: nível de áudio e escala de exposição */
    .barra { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: var(--barra); border-top: 1px solid color-mix(in srgb, var(--ink) 14%, transparent); }
    .nivel { position: absolute; left: 218px; bottom: 1px; width: 50px; height: 5px;
      background: repeating-linear-gradient(90deg, var(--ac) 0 3px, transparent 3px 4px); -webkit-mask: linear-gradient(90deg, #000 0 64%, transparent 64%); mask: linear-gradient(90deg, #000 0 64%, transparent 64%); }
    .nivel2 { position: absolute; left: 218px; bottom: 1px; width: 50px; height: 5px; background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--ink) 30%, transparent) 0 3px, transparent 3px 4px); }
    .expo { position: absolute; left: 288px; bottom: 1px; width: 44px; height: 7px;
      background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--ink) 70%, transparent) 0 1px, transparent 1px 4px); -webkit-mask: linear-gradient(0deg, #000 0 100%); }
    .expo::after { content: ""; position: absolute; left: 21px; top: -1px; width: 2px; height: 9px; background: var(--ac); }

    /* moldura: o quadro de foco do visor. Plano preto em volta do avatar, filete da cor do foco e cantos mais grossos por fora */
    .moldura { background: var(--bg); border: 1.5px solid var(--ac); box-shadow: 0 0 0 1px color-mix(in srgb, var(--bg) 60%, transparent), 0 0 12px color-mix(in srgb, var(--ac) 28%, transparent); }
    .moldura::before { content: ""; position: absolute; inset: -4.5px; pointer-events: none; --c: var(--ac);
      background:
        linear-gradient(var(--c), var(--c)) 0 0 / 13px 2.5px, linear-gradient(var(--c), var(--c)) 0 0 / 2.5px 13px,
        linear-gradient(var(--c), var(--c)) 100% 0 / 13px 2.5px, linear-gradient(var(--c), var(--c)) 100% 0 / 2.5px 13px,
        linear-gradient(var(--c), var(--c)) 0 100% / 13px 2.5px, linear-gradient(var(--c), var(--c)) 0 100% / 2.5px 13px,
        linear-gradient(var(--c), var(--c)) 100% 100% / 13px 2.5px, linear-gradient(var(--c), var(--c)) 100% 100% / 2.5px 13px;
      background-repeat: no-repeat; }
    /* no avatar redondo os cantos viram quatro arcos nas diagonais */
    .moldura.redonda::before, .redonda .moldura::before { background: none; border: 2.5px solid var(--ac); border-radius: 50%; inset: -4.5px;
      -webkit-mask: conic-gradient(transparent 0 30deg, #000 30deg 60deg, transparent 60deg 120deg, #000 120deg 150deg, transparent 150deg 210deg, #000 210deg 240deg, transparent 240deg 300deg, #000 300deg 330deg, transparent 330deg);
      mask: conic-gradient(transparent 0 30deg, #000 30deg 60deg, transparent 60deg 120deg, #000 120deg 150deg, transparent 150deg 210deg, #000 210deg 240deg, transparent 240deg 300deg, #000 300deg 330deg, transparent 330deg); }
  </style>
</head>
<body>
  <div class="tudo">
    <div class="terco"></div>
    <div class="canto a"></div><div class="canto b"></div>
    <div class="rec"></div><div class="bateria"></div>
    <div class="barra"><div class="nivel2"></div><div class="nivel"></div><div class="expo"></div></div>
    <div class="moldura" id="moldura"></div>
  </div>
  <script src="_base.js"></script>
  <script>
    XB.pronto.then(function () { XB.pronto2(); });
  </script>
</body>
</html>
