<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Banner · Pikachu</title>
  <!-- Banner 380×100 do modelo Pikachu (família Fofinhos). Moldura em volta do avatar (84×84 em 15,6) que funciona quadrada e redonda. -->
  <link rel="stylesheet" href="_base.css">
  <style>
    :root,
    [data-cor="original"] { --bg: #fff4d2; --bg2: #fffcf0; --card: #fffefa; --ink: #4a3818; --ac: #e09a0c; --ac2: #fbe3a0; --pegada: #ecd296; --raio: #f6c21c; }
    html, body { background: var(--bg); }
    /* fundo: como o dos modelos, um brilho suave sobre a cor de base */
    .fundo { position: absolute; inset: 0;
      background: radial-gradient(ellipse 120px 80px at 57px 48px, var(--bg2), transparent 100%), radial-gradient(ellipse 260px 120px at 250px 40px, var(--bg2), transparent 100%), var(--bg); }
    .pegadas, .deco, .orna { position: absolute; left: 0; top: 0; width: 380px; height: 100px; overflow: visible; }
    .pegadas use { color: var(--pegada); opacity: .62; }
    html:not(.redonda) .r, .redonda .q { display: none; }
    /* moldura: papel do cartão, fio de cor por dentro e aro claro por fora; o interior fica liso */
    /* cantos: o avatar quadrado do xat tem quina reta, então o cartão arredonda só os 4 px em volta da foto (os aros de fora crescem daí) */
    .moldura { border-radius: 4px; background: var(--card);
      box-shadow: inset 0 0 0 2px var(--anel, var(--ac)), 0 0 0 2.5px var(--aro, var(--ac2)), 0 2px 5px color-mix(in srgb, var(--ac) 38%, transparent); }
    :root { --pelo: #fde22d; --pelo-sombra: #eab51a; --contorno: #1b1510; --bochecha: #ec1c17; --bochecha-luz: #ff7461; }
    .fundo { background: radial-gradient(ellipse 120px 80px at 57px 48px, var(--bg2), transparent 100%), radial-gradient(ellipse 280px 130px at 280px 50px, var(--bg2), transparent 100%), var(--bg); }
    .moldura { background: var(--card); border-radius: 4px;
      box-shadow: inset 0 0 0 3px var(--pelo), inset 0 0 0 4px var(--pelo-sombra), 0 0 0 1.4px var(--contorno), 0 0 0 4px var(--ac2), 0 2px 6px 2px color-mix(in srgb, var(--ac) 35%, transparent); }
    .raio { fill: var(--raio); }
    .raio-c { fill: var(--pelo); stroke: var(--contorno); stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .faisca { fill: var(--raio); }
    .bo { fill: var(--bochecha); stroke: #a60f0c; stroke-width: .8; }
  </style>
</head>
<body>
  <div class="tudo">
    <div class="fundo"></div>
    <svg class="pegadas" id="pegadas" viewBox="0 0 380 100"><defs><symbol id="pegada" viewBox="0 0 100 100"><g fill="currentColor"><path d="M50 50 C66 50 76 62 74 76 C72 88 60 90 50 88 C40 90 28 88 26 76 C24 62 34 50 50 50 Z"/><circle cx="20" cy="42" r="9"/><circle cx="38" cy="24" r="9.5"/><circle cx="62" cy="24" r="9.5"/><circle cx="80" cy="42" r="9"/></g></symbol>
      <symbol id="raio" viewBox="0 0 100 100"><path d="M58 0 L8 58 L44 58 L30 100 L92 36 L54 36 L74 0 Z"/></symbol>
      <symbol id="fa" viewBox="-50 -50 100 100"><path d="M0 -48 C4 -18 18 -4 48 0 C18 4 4 18 0 48 C-4 18 -18 4 -48 0 C-18 -4 -4 -18 0 -48Z"/></symbol></defs></svg>
    <svg class="orna" viewBox="0 0 380 100">
<use class="raio" href="#raio" x="236" y="10" width="18" height="26" opacity="0.9" transform="rotate(12 245.0 23.0)"/><use class="raio" href="#raio" x="262" y="52" width="14" height="20" opacity="0.75" transform="rotate(-10 269.0 62.0)"/><use class="raio" href="#raio" x="300" y="6" width="24" height="34" opacity="0.9" transform="rotate(8 312.0 23.0)"/><use class="raio" href="#raio" x="334" y="46" width="18" height="26" opacity="0.85" transform="rotate(-8 343.0 59.0)"/><use class="raio" href="#raio" x="358" y="8" width="12" height="18" opacity="0.7" transform="rotate(14 364.0 17.0)"/><use class="faisca" href="#fa" x="276.0" y="26.0" width="8" height="8" opacity="0.9"/><use class="faisca" href="#fa" x="314.5" y="58.5" width="7" height="7" opacity="0.8"/><use class="faisca" href="#fa" x="345.0" y="23.0" width="6" height="6" opacity="0.9"/><use class="faisca" href="#fa" x="243.0" y="53.0" width="6" height="6" opacity="0.8"/>
    </svg>
    <div class="moldura" id="moldura"></div>
    <svg class="orna" viewBox="0 0 380 100">
      <!-- só as bochechas vermelhas: no quadrado, uma em cada lateral, na altura das bochechas de um rosto -->
      <g class="q">
        <circle class="bo" cx="14" cy="60" r="5.2"/><circle cx="12.4" cy="58.3" r="1.5" fill="var(--bochecha-luz)"/>
        <circle class="bo" cx="100" cy="60" r="5.2"/><circle cx="98.4" cy="58.3" r="1.5" fill="var(--bochecha-luz)"/>
      </g>
      <g class="r">
        <circle class="bo" cx="26" cy="79" r="5.6"/><circle cx="24.3" cy="77.2" r="1.6" fill="var(--bochecha-luz)"/>
        <circle class="bo" cx="88" cy="79" r="5.6"/><circle cx="86.3" cy="77.2" r="1.6" fill="var(--bochecha-luz)"/>
      </g>
    </svg>
  </div>
  <script src="_base.js"></script>
  <script>
    // trilha de pegadinhas no lado direito e embaixo, longe das etiquetas do xat
    var P = [[116,84,-70,12],[132,78,-70,12],[148,86,-70,12],[164,79,-70,12],[180,87,-70,12],[196,80,-70,12],[216,86,-60,12]];
    document.getElementById("pegadas").insertAdjacentHTML("beforeend", P.map(function (p) {
      var s = p[3] || 14;
      return '<use href="#pegada" x="' + (-s / 2) + '" y="' + (-s / 2) + '" width="' + s + '" height="' + s + '" transform="translate(' + p[0] + ' ' + p[1] + ') rotate(' + p[2] + ')"/>';
    }).join(""));
    XB.pronto.then(function () { XB.pronto2(); });
  </script>
</body>
</html>
