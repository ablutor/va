<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Banner · Windows 98</title>
  <!-- Área de trabalho verde-água com duas janelas cinzas em relevo: o visualizador de imagens (a moldura do avatar,
       com a barra de título azul) e a janela de cópia de arquivos (pastas, folha voando e progresso). Sem textos nem logotipos. -->
  <link rel="stylesheet" href="_base.css">
  <style>
    :root,
    [data-cor="original"] {
      --area: #008080; --cinza: #c0c0c0; --luz: #fff; --luz-2: #dfdfdf; --sombra: #808080; --sombra-2: #0a0a0a;
      --tit-1: #000080; --tit-2: #1084d0; --player-1: #808080; --player-2: #b5b5b5;
      --progresso: #000080;
    }
    html, body { background: var(--area); }
    .tudo { background: var(--area); }
    .jan { position: absolute; background: var(--cinza);
      box-shadow: inset -1px -1px var(--sombra-2), inset 1px 1px var(--luz), inset -2px -2px var(--sombra), inset 1px 1px 0 1px var(--luz-2); }
    .fundo-afundado { box-shadow: inset 1px 1px var(--sombra), inset -1px -1px var(--luz), inset 2px 2px var(--sombra-2), inset -2px -2px var(--luz-2); }
    .tit { position: absolute; height: 6px; }
    .tit.azul { background: linear-gradient(90deg, var(--tit-1), var(--tit-2)); }
    .tit.cinza { background: linear-gradient(90deg, var(--player-1), var(--player-2)); }
    .tit i { position: absolute; top: 1px; width: 5px; height: 4px; background: var(--cinza);
      box-shadow: inset -1px -1px var(--sombra-2), inset 1px 1px var(--luz); }
    .tit i.ico { left: 2px; top: 1px; width: 4px; height: 4px; box-shadow: none; background: var(--luz-2); }

    /* ---- Moldura: o visualizador de imagens ---- */
    #jan-foto { left: 15px; top: 1px; width: 84px; height: 89px; }
    #jan-foto .tit { left: 2px; top: 2px; width: 80px; }
    #jan-foto .tit i:nth-of-type(2) { right: 2px; } #jan-foto .tit i:nth-of-type(3) { right: 8px; } #jan-foto .tit i:nth-of-type(4) { right: 14px; }
    /* campo afundado onde a imagem aparece (o avatar cobre o miolo cinza) */
    .campo { position: absolute; left: 3px; top: 8px; width: 78px; height: 78px; background: var(--cinza); border: 1px solid; border-color: var(--sombra) var(--luz) var(--luz) var(--sombra); box-shadow: inset 1px 1px var(--sombra-2); }
    .redonda .campo { border-radius: 50%; box-shadow: inset 1px 1px var(--sombra-2); }
    /* os cantos do quadrado, fora do círculo, ficam com relevo reto */
    .redonda .campo { background: radial-gradient(circle, var(--cinza) 0 100%); }

    /* ---- Janela de cópia de arquivos (como a "Copiando fotos..." do modelo): duas pastas e a folha voando entre elas,
       a barra de progresso em blocos e o botão Cancelar. Fica à direita, fora da zona das etiquetas do xat ---- */
    #jan-copia { left: 214px; top: 14px; width: 158px; height: 74px; }
    #jan-copia .tit { left: 2px; top: 2px; width: 154px; }
    #jan-copia .tit i:nth-of-type(2) { right: 2px; }
    .pasta { position: absolute; top: 18px; width: 20px; height: 14px; border-radius: 0 1px 1px 1px;
      background: linear-gradient(180deg, #fff3a0, #e8c84a); box-shadow: inset 0 0 0 1px #8a6d00; }
    .pasta::before { content: ""; position: absolute; left: 0; top: -3px; width: 8px; height: 4px; border-radius: 1px 1px 0 0; background: #e8c84a; box-shadow: inset 1px 1px 0 0 #8a6d00, inset -1px 0 0 0 #8a6d00; }
    .pasta.a { left: 10px; } .pasta.b { right: 10px; }
    /* a folha no meio do caminho, com o rastro pontilhado de onde veio */
    .folha { position: absolute; left: 82px; top: 12px; width: 10px; height: 13px; background: #fff; box-shadow: inset 0 0 0 1px #404040; transform: rotate(-14deg);
      clip-path: polygon(0 0, 70% 0, 100% 25%, 100% 100%, 0 100%); }
    .folha::after { content: ""; position: absolute; right: 0; top: 0; width: 3px; height: 3px; background: #c0c0c0; box-shadow: inset 1px -1px 0 0 #404040; }
    .rastro { position: absolute; left: 36px; top: 20px; width: 42px; height: 1px; background: repeating-linear-gradient(90deg, #404040 0 1px, transparent 1px 4px); transform: rotate(-10deg); transform-origin: 0 0; opacity: .6; }
    .progresso { position: absolute; left: 6px; top: 40px; width: 146px; height: 10px; background: #fff; }
    .progresso::before { content: ""; position: absolute; left: 2px; top: 2px; bottom: 2px; width: 88px; background: repeating-linear-gradient(90deg, var(--progresso) 0 6px, transparent 6px 8px); }
    .cancelar { position: absolute; right: 6px; top: 56px; width: 40px; height: 13px; background: var(--cinza);
      box-shadow: inset -1px -1px var(--sombra-2), inset 1px 1px var(--luz), inset -2px -2px var(--sombra), inset 2px 2px var(--luz-2); }
  </style>
</head>
<body>
  <div class="tudo">
    <div class="jan" id="jan-copia">
      <div class="tit cinza"><i class="ico"></i><i></i></div>
      <div class="pasta a"></div><div class="rastro"></div><div class="folha"></div><div class="pasta b"></div>
      <div class="progresso fundo-afundado"></div>
      <div class="cancelar"></div>
    </div>
    <div class="jan moldura-jan" id="jan-foto">
      <div class="tit azul"><i class="ico"></i><i></i><i></i><i></i></div>
      <div class="campo"></div>
    </div>
    <!-- a caixa .moldura marca a posição pedida pela base (nada é desenhado nela) -->
    <div class="moldura" style="pointer-events:none"></div>
  </div>
  <script src="_base.js"></script>
  <script>
    XB.pronto.then(function () { XB.pronto2(); });
  </script>
</body>
</html>
