<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Banner · Windows XP</title>
  <!-- Papel de parede de colina verde sob o céu azul, barra de tarefas azul com botão verde, uma janela de visualizador
       de imagens (é a moldura do avatar: borda azul de 4 px) e o Bloco de notas à direita (linhas do texto em traços). Sem textos nem logotipos. -->
  <link rel="stylesheet" href="_base.css">
  <style>
    :root,
    [data-cor="original"] {
      --papel-cor: #4f8ed8;
      --tit-1: #0a5fe8; --tit-2: #0058e6; --tit-3: #3a8cff; --borda-jan: #0831d9;
      --corpo-jan: #ece9d8;
      --barra-1: #245edb; --barra-2: #3f8cf3;
      --iniciar-1: #5eac56; --iniciar-2: #2f8a2f;
      --bandeja: #0f8ee9;
    }
    html, body { background: var(--papel-cor); }
    .tudo { background: var(--papel-cor) url("../modelos/ilustrados/32-windows-xp/bliss.webp") 0 -92px / 380px auto no-repeat; }

    /* barra de tarefas */
    .barra { position: absolute; left: 0; right: 0; top: 91px; height: 9px;
      background: linear-gradient(180deg, var(--barra-2) 0, var(--barra-1) 1.5px, var(--barra-1) 8px, #1941a5 100%); }
    .iniciar { position: absolute; left: -4px; top: 91px; width: 50px; height: 9px; border-radius: 0 5px 5px 0;
      background: linear-gradient(180deg, #7cc26f 0, var(--iniciar-1) 2px, var(--iniciar-2) 8px, #2a7a2a 100%); box-shadow: 1px 0 1px rgba(0, 0, 0, .35); }
    .iniciar::after { content: ""; position: absolute; left: 24px; top: 2.5px; width: 14px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .8); }
    .tarefa { position: absolute; top: 92px; height: 7px; border-radius: 1px; background: linear-gradient(180deg, #3c81f3, #1e52b7); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .22); }
    .bandeja { position: absolute; right: 0; top: 91px; width: 60px; height: 9px; background: linear-gradient(180deg, #19b9f3, var(--bandeja)); border-left: 1px solid #0b6fc0; }

    /* ---- Moldura: janela do visualizador (borda azul de 4 px em volta do avatar) ---- */
    .jan { position: absolute; border-radius: 4px 4px 1px 1px; filter: drop-shadow(1px 2px 2px rgba(0, 0, 0, .45)); }
    #jan-foto { left: 15px; top: 1px; width: 84px; height: 89px; }
    .jan .corpo { position: absolute; inset: 0; border-radius: inherit; background: var(--tit-2); box-shadow: inset 0 0 0 1px var(--borda-jan), inset 0 0 0 2px #2a7af0; }
    .jan .tit { position: absolute; left: 0; right: 0; top: 0; height: 9px; border-radius: 4px 4px 0 0;
      background: linear-gradient(180deg, var(--tit-3) 0%, var(--tit-1) 18%, var(--tit-2) 55%, var(--tit-1) 90%, #0a4bd0 100%); }
    .tit .ico { position: absolute; left: 4px; top: 2px; width: 5px; height: 5px; border-radius: 1px; background: #fff; opacity: .9; }
    .tit .bt { position: absolute; top: 1.5px; width: 6px; height: 6px; border: 1px solid #fff; border-radius: 1.5px; background: linear-gradient(135deg, #5c9bff, #1f5fe0); box-sizing: border-box; }
    .tit .bt.fec { background: linear-gradient(135deg, #f19a7c, #d8401c); }
    #jan-foto .bt:nth-of-type(1) { right: 14px; } #jan-foto .bt:nth-of-type(2) { right: 8px; } #jan-foto .bt:nth-of-type(3) { right: 2px; }
    /* área do cliente: o miolo plano na cor bege das janelas (o avatar cobre) */
    .miolo { position: absolute; left: 4px; top: 9px; width: 76px; height: 76px; background: var(--corpo-jan); box-shadow: 0 0 0 1px var(--borda-jan); }
    .redonda .miolo { border-radius: 50%; box-shadow: 0 0 0 1px rgba(255, 255, 255, .55), 0 0 0 2px var(--borda-jan); }

    /* ---- Bloco de notas (o sobre_mim.txt do modelo): menu bege e a folha branca com as linhas do texto em traços, sem letras ---- */
    #jan-notas { left: 222px; top: 5px; width: 160px; height: 82px; }
    #jan-notas .bt:nth-of-type(1) { right: 26px; } #jan-notas .bt:nth-of-type(2) { right: 20px; } #jan-notas .bt:nth-of-type(3) { right: 14px; }
    .menu { position: absolute; left: 3px; top: 9px; width: 154px; height: 7px; background: var(--corpo-jan); }
    .menu i { position: absolute; top: 2.5px; height: 1.5px; background: #6b6b6b; }
    .folha { position: absolute; left: 3px; top: 16px; width: 154px; height: 64px; background: #fff; box-shadow: inset 1px 1px #7f9db9, inset -1px -1px #7f9db9; }
    .folha i { position: absolute; left: 5px; height: 1.5px; background: #5a5a5a; }
    .folha b { position: absolute; width: 1px; height: 5px; background: #000; }
  </style>
</head>
<body>
  <div class="tudo">
    <div class="jan" id="jan-notas">
      <div class="corpo"></div>
      <div class="tit"><span class="ico"></span><i class="bt"></i><i class="bt"></i><i class="bt fec"></i></div>
      <div class="menu"><i style="left:4px;width:12px"></i><i style="left:20px;width:10px"></i><i style="left:34px;width:16px"></i><i style="left:54px;width:10px"></i><i style="left:68px;width:10px"></i></div>
      <div class="folha">
        <i style="top:5px;width:58px"></i><i style="top:10px;width:70px"></i><i style="top:15px;width:76px"></i><i style="top:20px;width:52px"></i>
        <i style="top:30px;width:128px"></i><i style="top:35px;width:96px"></i><b style="left:102px;top:33px"></b>
      </div>
    </div>

    <div class="barra"></div>
    <div class="tarefa" style="left:58px;width:52px"></div>
    <div class="tarefa" style="left:114px;width:52px;opacity:.7"></div>
    <div class="bandeja"></div>
    <div class="iniciar"></div>

    <div class="jan" id="jan-foto">
      <div class="corpo"></div>
      <div class="tit"><span class="ico"></span><i class="bt"></i><i class="bt"></i><i class="bt fec"></i></div>
      <div class="miolo"></div>
    </div>
    <div class="moldura" style="pointer-events:none"></div>
  </div>
  <script src="_base.js"></script>
  <script>
    XB.pronto.then(function () { XB.pronto2(); });
  </script>
</body>
</html>
