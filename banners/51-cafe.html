<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Banner · Café</title>
  <!-- Banner do modelo 51 · Café: a foto dos cafés vista de cima, escurecida à esquerda (zona das etiquetas), e o aro de caramelo
       com halo, como na foto de perfil do modelo. -->
  <link rel="stylesheet" href="_base.css">
  <style>
    :root { --c1: #2a1d16; --c2: #1c140f; --ink: #fff6ec; --ac: #d99a5b; --tinta: transparent; --tinta-op: 0; }
    [data-cor="original"]  { --c1: #2a1d16; --c2: #1c140f; --ink: #fff6ec; --ac: #d99a5b; --tinta: #2a1d16; --tinta-op: 0; }
    [data-cor="masculino"] { --c1: #1d1e21; --c2: #131416; --ink: #f3f1ec; --ac: #d4a85e; --tinta: #3a3b3f; --tinta-op: .62; }
    [data-cor="feminino"]  { --c1: #2c1a20; --c2: #1d1115; --ink: #fff2f4; --ac: #ec9fb0; --tinta: #a8506a; --tinta-op: .38; }
    html, body { background: var(--c2); }
    .tudo { background: var(--c2); }
    /* fundo desfocado (como o fundo do modelo) e, à direita, a foto nítida com os dois cafés */
    .desfoque { position: absolute; inset: -20px; background: url(../modelos/cenarios/51-cafe/cafe.jpg) 50% 40% / 520px auto; filter: blur(14px) brightness(.5) saturate(1.1); }
    .nitida { position: absolute; left: 0; top: 0; width: 380px; height: 100px; background: url(../modelos/cenarios/51-cafe/cafe.jpg) 80px -26px / 330px auto no-repeat;
      -webkit-mask-image: linear-gradient(90deg, transparent 0, transparent 170px, #000 250px); mask-image: linear-gradient(90deg, transparent 0, transparent 170px, #000 250px); }
    .tinta { position: absolute; inset: 0; background: var(--tinta); opacity: var(--tinta-op); mix-blend-mode: color; }
    .veu { position: absolute; inset: 0; background:
      linear-gradient(90deg, color-mix(in srgb, var(--c2) 80%, transparent) 0, color-mix(in srgb, var(--c2) 72%, transparent) 200px, transparent 300px),
      linear-gradient(180deg, rgba(0,0,0,.32), transparent 30%, transparent 70%, rgba(0,0,0,.45)); }
    /* aro: círculo/quadrado do tema, com halo suave */
    .moldura { border-radius: 6px; background: var(--c1);
      box-shadow: 0 0 0 2px var(--ac), 0 0 0 5px color-mix(in srgb, var(--ac) 22%, transparent), 0 6px 14px rgba(0,0,0,.55); }
    .moldura::before { content: ""; position: absolute; inset: 1px; border-radius: inherit; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ac) 35%, transparent); }
    .moldura.redonda, .redonda .moldura { border-radius: 50%; }
    /* detalhe: pontinho de brilho (como o do selo da foto do modelo), no canto do aro */
    .brilho { position: absolute; left: 96px; top: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--ac); box-shadow: 0 0 8px var(--ac); }
    .redonda .brilho { left: 83px; top: 15px; }
  </style>
</head>
<body>
  <div class="tudo">
    <div class="desfoque"></div><div class="nitida"></div><div class="tinta"></div><div class="veu"></div>
    <div class="moldura" id="moldura"></div><div class="brilho"></div>
  </div>
  <script src="_base.js"></script>
  <script>XB.pronto.then(function () { XB.pronto2(); });</script>
</body>
</html>
