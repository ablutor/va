<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Banner · Hora</title>
  <!-- Banner do modelo 42 · Hora: fundo liso, o anel do disco (trilho + arco de progresso na cor de destaque) em volta do avatar,
       marcas de hora do lado de fora. Sem mostrador à direita: a própria moldura já é o relógio. -->
  <link rel="stylesheet" href="_base.css">
  <style>
    :root { --bg: #e8e2d6; --ink: #2b2824; --mudo: #8a8478; --ac: #a3896a; }
    [data-cor="original"]  { --bg: #e8e2d6; --ink: #2b2824; --mudo: #8a8478; --ac: #a3896a; }
    [data-cor="masculino"] { --bg: #2a2c2e; --ink: #eceae6; --mudo: #9a9b9c; --ac: #b8b2a4; }
    [data-cor="feminino"]  { --bg: #ecdcd6; --ink: #3b2a28; --mudo: #96807b; --ac: #b98a80; }
    html, body { background: var(--bg); }
    .tudo { background: radial-gradient(ellipse 55% 130% at 80% 50%, color-mix(in srgb, var(--ink) 4%, transparent), transparent 80%); }
    .moldura { background: var(--bg); }
    .moldura svg { position: absolute; left: -6px; top: -6px; width: 96px; height: 96px; overflow: visible; }
    .trilho { fill: none; stroke: color-mix(in srgb, var(--ink) 30%, transparent); stroke-width: 3; }
    .prog { fill: none; stroke: var(--ac); stroke-width: 3; stroke-linecap: round; }
    .marca { stroke: color-mix(in srgb, var(--ink) 45%, transparent); stroke-linecap: round; }
  </style>
</head>
<body>
  <div class="tudo">
    <div class="moldura" id="moldura"><svg id="anel" viewBox="-6 -6 96 96"></svg></div>
  </div>
  <script src="_base.js"></script>
  <script>
    XB.pronto.then(function () {
      var NS = "http://www.w3.org/2000/svg";
      function el(pai, nome, at, cls) { var e = document.createElementNS(NS, nome); for (var k in at) e.setAttribute(k, at[k]); if (cls) e.setAttribute("class", cls); pai.appendChild(e); return e; }
      var mol = document.getElementById("moldura"); if (XB.redonda) mol.classList.add("redonda");
      var anel = document.getElementById("anel"), c = 42, i, a, ca, sa;

      // ---------- anel: trilho + arco de progresso (começa no topo, sentido horário) ----------
      if (XB.redonda) {
        el(anel, "circle", { cx: c, cy: c, r: 40.5 }, "trilho");
        el(anel, "circle", { cx: c, cy: c, r: 40.5, pathLength: 100, "stroke-dasharray": "34 66", transform: "rotate(-90 42 42)" }, "prog");
      } else {
        var d = "M42 2 H78 A4 4 0 0 1 82 6 V78 A4 4 0 0 1 78 82 H6 A4 4 0 0 1 2 78 V6 A4 4 0 0 1 6 2 H42 Z";
        el(anel, "path", { d: d }, "trilho");
        el(anel, "path", { d: d, pathLength: 100, "stroke-dasharray": "34 66" }, "prog");
      }
      // ---------- marcas de hora do lado de fora (12; as de 12, 3, 6 e 9 são mais longas) ----------
      for (i = 0; i < 12; i++) {
        a = (i * 30 - 90) * Math.PI / 180; ca = Math.cos(a); sa = Math.sin(a);
        var longa = i % 3 === 0, L = longa ? 3.6 : 2.2, p0, nx, ny;
        if (XB.redonda) { nx = ca; ny = sa; p0 = [c + ca * 44, c + sa * 44]; }
        else {
          var k = 42 / Math.max(Math.abs(ca), Math.abs(sa)), px = c + ca * k, py = c + sa * k;
          if (Math.abs(ca) > Math.abs(sa)) { nx = Math.sign(ca); ny = 0; } else { nx = 0; ny = Math.sign(sa); }
          p0 = [px + nx * 2, py + ny * 2];
        }
        el(anel, "line", { x1: p0[0], y1: p0[1], x2: p0[0] + nx * L, y2: p0[1] + ny * L, "stroke-width": longa ? 1.8 : 1.3 }, "marca");
      }

      XB.pronto2();
    });
  </script>
</body>
</html>
