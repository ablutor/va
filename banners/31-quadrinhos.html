<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Banner · Quadrinhos</title>
  <!-- Banner de 380×100: capa de gibi (raios de sol e retícula), moldura de quadro com borda preta e sombra de cor, balão com reticências. -->
  <link rel="stylesheet" href="_base.css">
  <style>
    :root,
    [data-cor="original"]    { --capa-1: #3a68e0; --capa-2: #1e4fd8; --acento: #e22730; }
    [data-cor="masculino"]   { --capa-1: #7d44dc; --capa-2: #6a2bd1; --acento: #22a44c; }
    [data-cor="masculino-2"] { --capa-1: #38393d; --capa-2: #17181c; --acento: #f3b404; }
    [data-cor="feminino"]    { --capa-1: #ff6ab2; --capa-2: #ff4fa2; --acento: #8e45ee; }
    :root { --papel: #fff8e6; --tinta: #111; --narracao: #ffff00; --amarelo: #ffdd3c; }

    html, body { background: var(--capa-2); }
    /* Raios de sol saindo do avatar, como na capa do modelo */
    .tudo { background: repeating-conic-gradient(from 3deg at 57px 48px, var(--capa-1) 0 7.5deg, var(--capa-2) 7.5deg 15deg); }
    /* Retícula de gibi (pontos), mais forte para a direita, calma onde ficam as etiquetas */
    .reticula { position: absolute; inset: 0; mix-blend-mode: multiply; opacity: .5;
      background: radial-gradient(circle, rgba(0, 0, 0, .55) 0 .9px, transparent 1.5px) 0 0 / 5px 5px;
      -webkit-mask-image: linear-gradient(90deg, transparent 0, transparent 38%, #000 82%);
              mask-image: linear-gradient(90deg, transparent 0, transparent 38%, #000 82%); }
    /* Bordas de quadro em cima e embaixo */
    .tudo::before, .tudo::after { content: ""; position: absolute; left: 0; right: 0; height: 3px; background: var(--tinta); z-index: 2; }
    .tudo::before { top: 0; } .tudo::after { bottom: 0; }

    /* Moldura: quadro com borda preta de 4 px, interior cor de papel e sombra dura na cor de acento */
    .moldura { background: var(--tinta); box-shadow: 0 0 0 2px var(--papel), 3px 3px 0 2px var(--acento); z-index: 5; }
    .moldura::before { content: ""; position: absolute; inset: 4px; background: var(--papel); border-radius: inherit; }
    .moldura svg { position: absolute; overflow: visible; }
    .estrela { left: 80px; top: -2px; width: 22px; height: 22px; }
    .redonda .estrela, .moldura.redonda .estrela { left: 73px; top: 3px; }
    .estrela polygon { fill: var(--amarelo); stroke: var(--tinta); stroke-width: 1.6; stroke-linejoin: miter; }
    .estrela circle { fill: var(--acento); }

    .balao { position: absolute; left: 266px; top: 26px; width: 72px; height: 48px; overflow: visible; filter: drop-shadow(2px 2px 0 rgba(0, 0, 0, .35)); }
    .balao .b { fill: #fff; stroke: var(--tinta); stroke-width: 2.6; stroke-linejoin: round; }
    .balao .p { fill: var(--tinta); }
    .mini { position: absolute; left: 236px; top: 16px; width: 24px; height: 24px; overflow: visible; }
    .mini polygon { fill: var(--amarelo); stroke: var(--tinta); stroke-width: 1.8; stroke-linejoin: miter; }
  </style>
</head>
<body>
  <div class="tudo"><div class="reticula"></div>
    <svg class="balao" viewBox="0 0 84 56">
      <path class="b" d="M6 22 C6 8 26 3 42 3 C62 3 78 10 78 24 C78 38 62 45 42 45 C37 45 33 44.5 29 43.5 L12 54 L19 41 C11 37 6 30 6 22 Z"/>
      <circle class="p" cx="28" cy="24" r="3.4"/><circle class="p" cx="42" cy="24" r="3.4"/><circle class="p" cx="56" cy="24" r="3.4"/>
    </svg>
    <svg class="mini" viewBox="-13 -13 26 26" id="mini"></svg>
    <div class="moldura" id="moldura"><svg class="estrela" viewBox="-11 -11 22 22" id="estrela"><circle r="2.3"/></svg></div>
  </div>
  <script src="_base.js"></script>
  <script>
    function estrela(n, re, ri) {
      var p = [];
      for (var i = 0; i < n * 2; i++) { var a = Math.PI * i / n - Math.PI / 2, r = i % 2 ? ri : re; p.push((r * Math.cos(a)).toFixed(2) + "," + (r * Math.sin(a)).toFixed(2)); }
      return '<polygon points="' + p.join(" ") + '"/>';
    }
    XB.pronto.then(function (d) {
      if (XB.redonda) document.getElementById("moldura").classList.add("redonda");
      document.getElementById("estrela").insertAdjacentHTML("afterbegin", estrela(10, 10, 5.4));
      document.getElementById("mini").innerHTML = estrela(8, 11, 5.5);
      XB.pronto2();
    });
  </script>
</body>
</html>
