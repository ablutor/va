<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Banner · Galeria</title>
  <!-- Banner da Galeria: parede de museu com luz de spot, rodapé e chão; o avatar é o quadro de moldura preta com passe-partout. Sem outras obras: a Galeria do xatspace só mostra fotos da pessoa, então nada de paisagem -->
  <link rel="stylesheet" href="_base.css">
  <style>
    /* Mesmas cores do modelo (style.css): só as quatro (a Galeria não tem pastéis) */
    :root, [data-cor="original"]   { --parede: #d8d3cb; --parede2: #cdc7be; --luz: #efebe4; --chao1: #8f877c; --chao2: #6f685f; --rodape: #b9b2a7; --ink: #1b1a18; --moldura: #1c1b19; --ponto: #c0392b; }
    [data-cor="masculino"]  { --parede: #c9d0c6; --parede2: #bcc4b8; --luz: #e6ebe3; --chao1: #6f7a6c; --chao2: #545e52; --rodape: #a3ac9f; --ink: #1a1e1a; --moldura: #1b1f1b; --ponto: #c0392b; }
    [data-cor="feminino"]   { --parede: #ecd6d3; --parede2: #e2c8c4; --luz: #f8ecea; --chao1: #a8857f; --chao2: #8a6a64; --rodape: #d0b2ad; --ink: #2a1a1c; --moldura: #2b1b1d; --ponto: #d6336c; }
    [data-cor="feminino-2"] { --parede: #dcd4e6; --parede2: #cfc5dc; --luz: #f0ebf6; --chao1: #8c7fa0; --chao2: #6e6283; --rodape: #bbb0c9; --ink: #1f1a28; --moldura: #201b29; --ponto: #c0392b; }
    :root { --papel: #fbfaf7; --linha: #ddd8cf; }

    html, body { background: var(--parede); }
    /* parede com o spot de luz sobre o quadro do avatar; escurece um pouco para a direita (as etiquetas do xat leem melhor) */
    .tudo { background: radial-gradient(ellipse 150px 130px at 58px 48px, var(--luz), transparent 100%), linear-gradient(90deg, var(--parede) 0, var(--parede2) 55%, color-mix(in srgb, var(--parede2) 88%, #000) 100%); }
    /* rodapé e chão */
    .chao { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: linear-gradient(180deg, var(--chao1), var(--chao2)); border-top: 2px solid var(--rodape); }

    .fio { position: absolute; width: 1px; background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--ink) 38%, transparent) 70%); }
    /* moldura: moldura preta de 3 px e 1 px de passe-partout em volta do avatar; fio de pendurar e sombra na parede */
    .moldura { background: var(--papel); box-shadow: 0 0 0 3px var(--moldura), 0 6px 9px 2px rgba(0, 0, 0, .3), 0 1px 3px 3px rgba(0, 0, 0, .12); }
    .moldura::before { content: ""; position: absolute; inset: -3px; border-radius: inherit; border: 1px solid rgba(255, 255, 255, .16); border-color: rgba(255, 255, 255, .2) rgba(255, 255, 255, .05) rgba(255, 255, 255, .05) rgba(255, 255, 255, .2); }
    .moldura.redonda::before, .redonda .moldura::before { border-radius: 50%; }
    .fio.f1 { left: 57px; top: 0; height: 6px; }
  </style>
</head>
<body>
  <div class="tudo">
    <div class="chao"></div>
    <div class="fio f1"></div>
    <div class="moldura" id="moldura"></div>
  </div>
  <script src="_base.js"></script>
  <script>
    XB.pronto.then(function (d) {
      XB.pronto2();
    });
  </script>
</body>
</html>
