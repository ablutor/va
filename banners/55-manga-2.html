<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Banner · Mangá 2</title>
  <!-- Banner de 380×100: folha de mangá em preto e branco; o avatar fica numa folha com linhas de foco (kakeami) e a moldura é um quadro preto grosso com sombra de acento
       e traços de ênfase; atrás das etiquetas, um quadro preto inclinado; à direita, um quadro inclinado com linhas de velocidade e um carimbo vermelho. -->
  <link rel="stylesheet" href="_base.css">
  <link rel="stylesheet" href="../core/cores.css">
  <style>
    :root { --papel: #fbf8f0; --caixa: #fffdf5; --tinta: #0b0b0b; --claro: #fff; --mancha: rgba(150, 120, 50, .16); }
    :root,
    [data-cor="original"]   { --ac: #e5242b; }
    [data-cor="masculino"]  { --ac: #1f6bff; }
    [data-cor="feminino"]   { --ac: #ff3d8b; }
    [data-cor="feminino-2"] { --ac: #8a3dff; }
    [data-cor^="pastel-"] { --papel: var(--p-bg2); --caixa: var(--p-papel); --tinta: var(--p-dk); --claro: var(--p-papel); --ac: var(--p-ac); --mancha: color-mix(in srgb, var(--p-ac) 22%, transparent); }

    html, body { background: var(--papel); }
    .tudo { background: var(--papel); }
    /* Textura de papel e leve escurecimento nas bordas, como na folha do modelo */
    .tudo::before { content: ""; position: absolute; inset: 0; z-index: 50; pointer-events: none; mix-blend-mode: multiply; opacity: .45;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .38  0 0 0 .55 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"); }
    .tudo::after { content: ""; position: absolute; inset: 0; z-index: 51; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, transparent 62%, var(--mancha) 100%); }

    svg.folha { position: absolute; left: 0; top: 0; width: 380px; height: 100px; overflow: visible; }
    .quadro { stroke: var(--tinta); stroke-width: 3; stroke-linejoin: miter; }
    .preto { fill: var(--tinta); }
    .branco { fill: var(--papel); }
    .linhas { fill: var(--tinta); }
    .fino { fill: none; stroke: var(--claro); stroke-width: .9; opacity: .55; }
    .ret { fill: var(--claro); opacity: .16; }
    .carimbo-c { fill: var(--ac); stroke: var(--tinta); stroke-width: 2.4; }
    .faixa-ac { fill: var(--ac); stroke: var(--tinta); stroke-width: 2.4; stroke-linejoin: miter; }

    /* Moldura: quadro preto grosso (4 px), interior cor de papel, sombra dura na cor de acento; traços de ênfase no canto */
    .moldura { background: var(--tinta); box-shadow: 3px 3px 0 var(--ac); z-index: 5; }
    .moldura::before { content: ""; position: absolute; inset: 4px; background: var(--caixa); border-radius: inherit; }
    .moldura svg { position: absolute; left: 0; top: 0; width: 84px; height: 84px; overflow: visible; }
    .moldura svg line { stroke: var(--tinta); stroke-width: 2.3; stroke-linecap: butt; }
    .moldura svg line.v { stroke: var(--ac); }
  </style>
</head>
<body>
  <div class="tudo">
    <svg class="folha" viewBox="0 0 380 100" id="folha">
      <defs>
        <clipPath id="cl1"><polygon points="107,-3 224,-3 206,103 104,103"/></clipPath>
        <clipPath id="cl2"><polygon points="234,-3 392,-3 392,103 216,103"/></clipPath>
        <pattern id="tela" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1.25" cy="1.25" r=".85" class="ret" style="opacity:1;fill:rgba(255,255,255,.2)"/><circle cx="3.75" cy="3.75" r=".85" style="fill:rgba(255,255,255,.2)"/></pattern>
      </defs>
      <g id="foco"></g>
      <polygon class="quadro preto" points="107,-3 224,-3 206,103 104,103"/>
      <g clip-path="url(#cl1)"><rect x="100" y="-5" width="130" height="110" fill="url(#tela)"/>
        <polygon class="fino" points="110,2 219,2 202,98 107,98" style="stroke-dasharray:none"/>
      </g>
      <polygon class="quadro branco" points="234,-3 392,-3 392,103 216,103"/>
      <g clip-path="url(#cl2)" id="vel"></g>
      <polygon class="quadro" style="fill:none" points="234,-3 392,-3 392,103 216,103"/>
    </svg>
    <div class="moldura" id="moldura">
      <svg viewBox="0 0 84 84" id="tracos"></svg>
    </div>
  </div>
  <script src="_base.js"></script>
  <script>
    var NS = "http://www.w3.org/2000/svg";
    function tri(cx, cy, a, r0, r1, w) {   // linha de velocidade: triângulo fino saindo do centro
      var ca = Math.cos(a), sa = Math.sin(a), px = -sa, py = ca;
      return [(cx + ca * r0 + px * w).toFixed(1) + "," + (cy + sa * r0 + py * w).toFixed(1), (cx + ca * r1).toFixed(1) + "," + (cy + sa * r1).toFixed(1), (cx + ca * r0 - px * w).toFixed(1) + "," + (cy + sa * r0 - py * w).toFixed(1)].join(" ");
    }
    XB.pronto.then(function (d) {
      if (XB.redonda) document.getElementById("moldura").classList.add("redonda");
      // traços de ênfase no canto de cima à direita da moldura (no círculo, sobre a curva a 45°)
      var px = XB.redonda ? 71.7 : 76, py = XB.redonda ? 12.3 : 4, t = "";
      (XB.redonda ? [-68, -45, -22] : [-62, -36, -10]).forEach(function (g, i) {
        var a = g * Math.PI / 180, r0 = 5.5, r1 = 12 - (i === 1 ? 0 : 1.5);
        t += '<line' + (i === 1 ? ' class="v"' : '') + ' x1="' + (px + r0 * Math.cos(a)).toFixed(1) + '" y1="' + (py + r0 * Math.sin(a)).toFixed(1) + '" x2="' + (px + r1 * Math.cos(a)).toFixed(1) + '" y2="' + (py + r1 * Math.sin(a)).toFixed(1) + '"/>';
      });
      document.getElementById("tracos").innerHTML = t;
      // linhas de foco atrás do avatar (aparecem só em volta da moldura)
      var f = document.getElementById("foco"), h = "";
      for (var i = 0; i < 44; i++) {
        var a = i * 2 * Math.PI / 44 + .03, l = 8 + ((i * 7) % 5) * 3.4, w = .55 + ((i * 3) % 4) * .12;
        h += '<polygon class="linhas" points="' + tri(57, 48, a, 46, 46 + l, w * 1.3) + '"/>';
      }
      f.innerHTML = h;
      // linhas de velocidade no quadro da direita, convergindo para o centro livre
      var v = document.getElementById("vel"); h = "";
      for (var j = 0; j < 72; j++) {
        var b = j * 2 * Math.PI / 72 + .02, r1 = 70 + ((j * 11) % 7) * 5, ww = .5 + ((j * 5) % 5) * .22;
        h += '<polygon class="linhas" points="' + tri(322, 52, b, 24 + ((j * 3) % 4) * 3, r1, ww * 1.6) + '"/>';
      }
      h += '<circle cx="322" cy="52" r="14" class="carimbo-c"/><circle cx="322" cy="52" r="8.5" fill="none" stroke="var(--tinta)" stroke-width="1.6"/>';
      v.innerHTML = h;
      XB.pronto2();
    });
  </script>
</body>
</html>
