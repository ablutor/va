<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Banner · Panda</title>
  <!-- Banner 380×100 do modelo Panda (família Fofinhos). Moldura em volta do avatar (84×84 em 15,6) que funciona quadrada e redonda. -->
  <link rel="stylesheet" href="_base.css">
  <style>
    :root,
    [data-cor="original"] { --bg: #e8f4ea; --bg2: #f8fcf8; --card: #fdfffd; --ink: #263d2c; --ac: #4f9e62; --ac2: #cfe8d3; --pegada: #bcd9c1; }
    [data-cor="masculino"] { --bg: #e8ecf1; --bg2: #f8f9fb; --card: #fdfeff; --ink: #28323f; --ac: #5f7894; --ac2: #d3dce6; --pegada: #bcc7d3; }
    [data-cor="feminino"] { --bg: #fbecee; --bg2: #fffafa; --card: #fffcfc; --ink: #4a2f35; --ac: #db7d93; --ac2: #f7d5dc; --pegada: #ecc3cc; }
    [data-cor="feminino-2"] { --bg: #f0ebf8; --bg2: #fcfaff; --card: #fefdff; --ink: #362b4a; --ac: #9277c9; --ac2: #e1d7f2; --pegada: #cfc2e6; }
    html, body { background: var(--bg); }
    /* fundo: como o dos modelos, um brilho suave sobre a cor de base */
    .fundo { position: absolute; inset: 0;
      background: radial-gradient(ellipse 120px 80px at 57px 48px, var(--bg2), transparent 100%), radial-gradient(ellipse 260px 120px at 250px 40px, var(--bg2), transparent 100%), var(--bg); }
    .pegadas, .deco, .orna { position: absolute; left: 0; top: 0; width: 380px; height: 100px; overflow: visible; }
    .pegadas use { color: var(--pegada); opacity: .62; }
    html:not(.redonda) .r, .redonda .q { display: none; }
    /* moldura: papel do cartão, fio de cor por dentro e aro claro por fora; o interior fica liso */
    /* cantos: o avatar quadrado do xat tem quina reta, então o cartão arredonda só os 4 px em volta da foto (os aros de fora crescem daí) */
    .moldura { border-radius: 4px; background: var(--card);
      box-shadow: inset 0 0 0 2px var(--anel, var(--ac)), 0 0 0 2.5px var(--aro, var(--ac2)), 0 2px 5px color-mix(in srgb, var(--ac) 38%, transparent); }
    :root { --mancha: #2b2830; --mancha-luz: #4c4752; --almofada: #e9b9c3; --bambu: #8cc477; --bambu-claro: #b3dba1; --bambu-escuro: #5f9a4c; }
    .caule { fill: var(--bambu); }
    .caule-l { fill: var(--bambu-claro); }
    .no { fill: none; stroke: var(--bambu-escuro); stroke-width: 1.4; stroke-linecap: round; }
    .fl { fill: var(--bambu-claro); } .fl2 { fill: var(--bambu); } .fl3 { fill: var(--bambu-escuro); }
    .bambu { opacity: .85; }
    .moldura { box-shadow: inset 0 0 0 2px var(--ac), 0 0 0 1.2px var(--ac2), 0 2px 5px color-mix(in srgb, var(--ac) 38%, transparent); }
    .redonda .moldura { box-shadow: inset 0 0 0 2px var(--ac), 0 0 0 2.5px var(--ac2), 0 2px 5px color-mix(in srgb, var(--ac) 38%, transparent); }
  </style>
</head>
<body>
  <div class="tudo">
    <div class="fundo"></div>

    <svg class="orna" viewBox="0 0 380 100">
      <defs><g id="orelha"><circle r="9" fill="var(--mancha)"/><ellipse cx="-1.2" cy="-2.2" rx="5.2" ry="3.6" fill="var(--mancha-luz)" opacity=".7" transform="rotate(-30)"/></g></defs>
      <g class="q"><use href="#orelha" transform="translate(24 9.3) scale(.95)"/><use href="#orelha" transform="translate(90 9.3) scale(.95)"/></g>
<g class="bambu"><rect class="caule" x="259.0" y="-2" width="6" height="104" rx="2.727272727272727"/><rect class="caule-l" x="260.0" y="-2" width="1.5" height="104" rx="1"/><path class="no" d="M259.0 18 h6"/><path class="no" d="M259.0 46 h6"/><path class="no" d="M259.0 74 h6"/></g><g class="bambu"><rect class="caule" x="287.75" y="22" width="4.5" height="80" rx="2.0454545454545454"/><rect class="caule-l" x="288.75" y="22" width="1.125" height="80" rx="1"/><path class="no" d="M287.75 40 h4.5"/><path class="no" d="M287.75 62 h4.5"/><path class="no" d="M287.75 84 h4.5"/></g><g class="bambu"><rect class="caule" x="330.5" y="-2" width="7" height="72" rx="3.1818181818181817"/><rect class="caule-l" x="331.5" y="-2" width="1.75" height="72" rx="1"/><path class="no" d="M330.5 14 h7"/><path class="no" d="M330.5 38 h7"/><path class="no" d="M330.5 58 h7"/></g><g class="bambu"><rect class="caule" x="355.75" y="30" width="4.5" height="72" rx="2.0454545454545454"/><rect class="caule-l" x="356.75" y="30" width="1.125" height="72" rx="1"/><path class="no" d="M355.75 48 h4.5"/><path class="no" d="M355.75 70 h4.5"/><path class="no" d="M355.75 90 h4.5"/></g><path class="fl" transform="translate(265 46) rotate(-35) scale(1)" d="M0 0 C6 -4.5 15 -4 22 0 C15 4 6 4.5 0 0Z"/><path class="fl2" transform="translate(259 74) rotate(205) scale(0.9)" d="M0 0 C6 -4.5 15 -4 22 0 C15 4 6 4.5 0 0Z"/><path class="fl2" transform="translate(293 62) rotate(-25) scale(0.85)" d="M0 0 C6 -4.5 15 -4 22 0 C15 4 6 4.5 0 0Z"/><path class="fl3" transform="translate(287 40) rotate(210) scale(0.8)" d="M0 0 C6 -4.5 15 -4 22 0 C15 4 6 4.5 0 0Z"/><path class="fl" transform="translate(337 38) rotate(-30) scale(1)" d="M0 0 C6 -4.5 15 -4 22 0 C15 4 6 4.5 0 0Z"/><path class="fl2" transform="translate(331 58) rotate(200) scale(0.9)" d="M0 0 C6 -4.5 15 -4 22 0 C15 4 6 4.5 0 0Z"/><path class="fl3" transform="translate(361 70) rotate(-28) scale(0.85)" d="M0 0 C6 -4.5 15 -4 22 0 C15 4 6 4.5 0 0Z"/><path class="fl" transform="translate(355 48) rotate(205) scale(0.85)" d="M0 0 C6 -4.5 15 -4 22 0 C15 4 6 4.5 0 0Z"/>
    </svg>
    <div class="moldura" id="moldura"></div>
    <svg class="orna" viewBox="0 0 380 100">
      <g class="r">
        <use href="#orelha" transform="translate(57 48) rotate(-42) translate(0 -46.5)"/><use href="#orelha" transform="translate(57 48) rotate(42) translate(0 -46.5)"/>
      </g>
    </svg>
  </div>
  <script src="_base.js"></script>
  <script>
    // trilha de pegadinhas no lado direito e embaixo, longe das etiquetas do xat
    var P = [[116,86,-70,12],[136,80,-60,12],[156,88,-72,12],[176,81,-62,12],[196,88,-70,12],[216,80,-62,12],[236,88,-72,12]];
    document.getElementById("pegadas").insertAdjacentHTML("beforeend", P.map(function (p) {
      var s = p[3] || 14;
      return '<use href="#pegada" x="' + (-s / 2) + '" y="' + (-s / 2) + '" width="' + s + '" height="' + s + '" transform="translate(' + p[0] + ' ' + p[1] + ') rotate(' + p[2] + ')"/>';
    }).join(""));
    XB.pronto.then(function () { XB.pronto2(); });
  </script>
</body>
</html>
