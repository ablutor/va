<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Banner · Cartão-postal</title>
  <!-- Banner de 380×100 para a janelinha do perfil no xat.
       Os dados do cliente ficam em DADOS (no fim do arquivo); gerar-banner.mjs tira o GIF e a imagem estática. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Special+Elite&family=Inter:wght@600&display=swap" rel="stylesheet">
  <style>
    :root { --bg2: #34404a; --bg3: #151a1e; --papel: #f4efe4; --ink: #26303a; --pm: #283c78; --linha: #b8ad99; --sombra: rgba(0, 0, 0, .5); }
    html, body { margin: 0; width: 380px; height: 100px; overflow: hidden; background: var(--papel); }
    body { position: relative; }

    /* O banner preenche os 380×100 de ponta a ponta. À esquerda fica a paisagem da frente do cartão-postal; no perfil do
       xat, o avatar (a foto da pessoa) e o nome ("Online Member") são desenhados por cima dela.
       Medido em prints do perfil: o xat mostra o banner ampliado em 5% e corta uns 9 px de cada lado (a faixa útil é de
       x=9 a x=371), e o avatar ocupa 76×76 px do banner, a 19 px da esquerda e a 10 px do topo. O banner não leva a foto da
       pessoa: só desenha o selo postal (moldura branca com furos, 4 px de margem) em volta de onde o avatar aparece. */
    .tudo { position: absolute; inset: 0; }
    .foto { position: absolute; left: 0; top: 0; width: 200px; height: 100px; background: #4a4f55 center 26% / cover no-repeat; filter: brightness(1.12) saturate(1.1); }
    .selo { position: absolute; left: 15px; top: 6px; width: 84px; height: 84px; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .4)); transform-origin: 50% 50%; overflow: visible; }

    /* Lado direito: papel e mensagem. O carimbo fica no lado do selo (abaixo). */
    .verso { position: absolute; left: 200px; top: 0; width: 180px; height: 100px; background: var(--papel); color: var(--ink); font-family: "Special Elite", monospace; box-shadow: -3px 0 7px var(--sombra); }
    .msg { position: absolute; left: 16px; top: 14px; width: 150px; font-size: 9px; line-height: 12.4px; white-space: pre; }
    /* O carimbo fica junto do selo, encostado na quina de baixo e na direita dele. O texto fica sobre a foto, fora da
       moldura branca, por isso em tom claro. Abaixo das etiquetas do xat. */
    .carimbo { --pm: var(--papel); filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .6)); position: absolute; left: 91px; top: 51px; width: 49px; height: 49px; transform-origin: 50% 50%; }
    .carimbo svg { width: 100%; height: 100%; overflow: visible; }
    .carimbo text { text-shadow: none; }

    /* ?v=paisagem: a paisagem ocupa o banner inteiro e a frase vai por cima dela, em tom claro */
    .paisagem .foto { width: 380px; }
    .paisagem .foto::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(12, 8, 6, 0) 0, rgba(12, 8, 6, 0) 186px, rgba(12, 8, 6, .5) 240px, rgba(12, 8, 6, .56) 380px); }
    .paisagem .verso { --ink: #fff; --linha: rgba(255, 255, 255, .45); background: transparent; box-shadow: none; text-shadow: 0 1px 3px rgba(0, 0, 0, .7); }

    /* soSelo (nos dados do cliente): só a paisagem e o selo, sem a frase, sem o carimbo e sem o escurecimento do texto */
    .so-selo .foto::after, .so-selo .verso, .so-selo .carimbo { display: none; }

    /* ?previa=1: simula o avatar e as etiquetas que o xat desenha por cima (só para mostrar no site e avaliar o desenho) */
    #xat { display: none; }
    .previa #xat { display: block; }
    #xat .avatar { position: absolute; left: 19px; top: 10px; width: 76px; height: 76px; background: 50% 12% / cover no-repeat; }
    #xat .etiqueta { position: absolute; left: 109px; padding: 0 5px; border-radius: 3px; background: rgba(105, 105, 105, .62); color: #fff; font: 13.3px/19px Arial, Helvetica, sans-serif; white-space: nowrap; text-shadow: 0 0 2px rgba(0, 0, 0, .4); }
    #xat .nome { top: 20px; }
    #xat .status { top: 46px; font-size: 11.4px; line-height: 18px; }
  </style>
</head>
<body>
  <div class="tudo" id="tudo">
    <div class="foto" id="paisagem"></div>
    <svg class="selo" id="selo" viewBox="0 0 84 84"><defs><mask id="furos"><rect width="84" height="84" fill="#fff"/><g id="furosG" fill="#000"></g></mask></defs><rect width="84" height="84" fill="#fff" mask="url(#furos)"/></svg>
    <div class="carimbo" id="carimbo">
      <svg viewBox="0 0 38 38" fill="none">
          <circle cx="19" cy="19" r="17.4" fill="rgba(12, 8, 6, .42)" stroke="var(--pm)" stroke-width="1.4" />
          <g id="pmTexto" fill="#fff" font-family="Inter, sans-serif" font-weight="800" text-anchor="middle"></g>
        </svg>
    </div>
    <div class="verso" id="verso">
      <div class="msg" id="msg"></div>
    </div>
    <div id="xat"><div class="avatar" id="avatar"></div><div class="etiqueta nome" id="xatNome"></div><div class="etiqueta status">Online Member</div></div>
  </div>

<script>
  // Dados de cada cliente (?c=nome no endereço; sem ele vale o exemplo do site). Fotos com caminho a partir desta pasta.
  // cor: paleta do carimbo, do cartão e do fundo, como no modelo. mensagem: o que é digitado no verso (quebre as linhas
  // com \n); fonte e linha ajustam frases maiores. nascimento (ano-mês-dia) vai no carimbo; sem ele, a data de hoje.
  var CORES = {
    "original":     { bg2: "#34404a", bg3: "#151a1e", papel: "#f4efe4", ink: "#26303a", pm: "#283c78", linha: "#b8ad99", sombra: "rgba(0,0,0,.5)" },
    "pastel-areia": { bg2: "#f9f4ee", bg3: "#efe7dc", papel: "#fdfbf8", ink: "#3a2f22", pm: "#90714b", linha: "#d6cab8", sombra: "rgba(70,48,24,.34)" }
  };
  var CLIENTES = {
    marina: {
      cor: "original", nome: "Marina", sobrenome: "Costa", local: "Recife", instagram: "marina.costa", soSelo: true,
      paisagem: "../clientes/exemplo/igreja.jpg", paisagemY: 58, paisagemYTotal: 58,
      mensagem: "Sou feita de mar,\ncafé e dias de sol.", fonte: 10.4, linha: 14,
      retrato: "../clientes/exemplo/perfil-feminino.jpg", retratoPos: "50% 22%"
    },
    albert: {
      cor: "pastel-areia", nome: "Albert", sobrenome: "Alves", local: "Rio de Janeiro", instagram: "albert.aalves",
      semData: true, soSelo: true,
      paisagem: "../../meus_exclusivos/publicado/xatspace-cartao-postal/fotos/fundo.jpg", paisagemY: 55, paisagemYTotal: 62,
      mensagem: "“A coisa mais bonita que você\npode fazer por alguém é\npoupá-lo do seu julgamento.”",
      fonte: 8.8, linha: 12.4,
      retrato: "../../meus_exclusivos/publicado/xatspace-cartao-postal/fotos/perfil.jpg", retratoPos: "50% 13%"
    }
  };
  var cliente = new URLSearchParams(location.search).get("c") || "marina";
  var DADOS = CLIENTES[cliente];
  var tema = CORES[DADOS.cor];
  Object.keys(tema).forEach(function (k) { document.documentElement.style.setProperty("--" + k, tema[k]); });
  var CICLO = 5;      // segundos de uma volta do GIF
  var T_ESTATICA = 4; // instante usado na imagem estática (cartão completo)

  var $ = function (id) { return document.getElementById(id); };
  var MESES = ["JAN", "FEV", "MAR", "ABR", "MAI", "JUN", "JUL", "AGO", "SET", "OUT", "NOV", "DEZ"];
  var hoje = new Date();

  if (DADOS.fonte) { $("msg").style.fontSize = DADOS.fonte + "px"; $("msg").style.lineHeight = (DADOS.linha || DADOS.fonte * 1.4) + "px"; }
  $("paisagem").style.backgroundImage = "url('" + DADOS.paisagem + "')";
  var paisagem = new URLSearchParams(location.search).get("v") === "paisagem";
  if (paisagem) document.documentElement.classList.add("paisagem");
  if (DADOS.soSelo) document.documentElement.classList.add("so-selo");
  $("paisagem").style.backgroundPosition = "center " + (paisagem ? (DADOS.paisagemYTotal || 50) : (DADOS.paisagemY || 26)) + "%";

  // Furos do selo postal: círculos vazados ao longo das quatro bordas (deixam a paisagem aparecer atrás)
  (function () {
    var NS = "http://www.w3.org/2000/svg", g = $("furosG"), passo = 84 / 18;
    for (var i = 0; i < 18; i++) {
      var c = passo / 2 + i * passo;
      [[c, 0], [c, 84], [0, c], [84, c]].forEach(function (xy) {
        var f = document.createElementNS(NS, "circle");
        f.setAttribute("cx", xy[0]); f.setAttribute("cy", xy[1]); f.setAttribute("r", 1.55);
        g.appendChild(f);
      });
    }
  })();

  // Prévia: o avatar e o nome que o xat desenharia por cima do banner
  if (new URLSearchParams(location.search).get("previa")) {
    document.documentElement.classList.add("previa");
    $("avatar").style.backgroundImage = "url('" + DADOS.retrato + "')";
    $("avatar").style.backgroundPosition = DADOS.retratoPos || "50% 12%";
    $("xatNome").textContent = DADOS.nome;
  }


  // A mensagem fica no meio da altura do banner; a conta usa o texto inteiro, para não pular enquanto é digitada
  (function () { var h = parseFloat(getComputedStyle($("msg")).lineHeight) * DADOS.mensagem.split("\n").length; $("msg").style.top = ((100 - h) / 2) + "px"; })();

  var rampa = function (t, a, b) { return Math.min(1, Math.max(0, (t - a) / (b - a))); };
  var suave = function (x) { return x * x * (3 - 2 * x); };

  // Desenha o banner no instante t (em segundos, 0 a CICLO). Sem relógio: cada quadro do GIF é um t exato.
  window.render = function (t) {
    t = ((t % CICLO) + CICLO) % CICLO;
    var sai = 1 - suave(rampa(t, 4.6, 5));

    // O banner dá um tranco quando o selo bate
    var tranco = Math.sin(Math.PI * rampa(t, 2, 2.22));
    $("tudo").style.transform = "translateY(" + (1.2 * tranco) + "px)";

    // Mensagem digitada
    var texto = DADOS.mensagem, n = Math.floor(rampa(t, 0.35, 1.95) * texto.length);
    $("msg").textContent = texto.slice(0, n);
    $("msg").style.opacity = sai;

    // Selo: cai e assenta
    var ps = suave(rampa(t, 2, 2.25));
    $("selo").style.opacity = Math.min(1, rampa(t, 2, 2.08) * 1) * sai;
    $("selo").style.transform = "rotate(" + (-2 * (1 - ps)) + "deg) scale(" + (1 + 0.35 * (1 - ps)) + ")";

    // Carimbo do correio
    var pc = suave(rampa(t, 2.35, 2.62));
    $("carimbo").style.opacity = pc * sai;
    $("carimbo").style.transform = "rotate(" + (-10 * (1 - pc)) + "deg) scale(" + (1 + 0.4 * (1 - pc)) + ")";
  };
  window.CICLO = CICLO;
  window.T_ESTATICA = T_ESTATICA;
  // O carimbo é medido com a fonte já carregada, para o texto caber no círculo
  function montarCarimbo() {
  // Carimbo: cidade (em duas linhas se for longa, como "RIO DE / JANEIRO") e data, cada linha encolhida até caber no círculo
    var nasc = /^(\d{4})-(\d{2})-(\d{2})$/.exec(DADOS.nascimento || "");
    var data = nasc ? Number(nasc[3]) + " " + MESES[Number(nasc[2]) - 1] + " " + nasc[1]
                    : hoje.getDate() + " " + MESES[hoje.getMonth()] + " " + hoje.getFullYear();
    var cidade = DADOS.local.toUpperCase(), partes = cidade.split(" ");
    if (cidade.length > 9 && partes.length > 1) {
      var corte = 1, melhor = 99;
      for (var k = 1; k < partes.length; k++) {
        var d = Math.abs(partes.slice(0, k).join(" ").length - partes.slice(k).join(" ").length);
        if (d < melhor) { melhor = d; corte = k; }
      }
      partes = [partes.slice(0, corte).join(" "), partes.slice(corte).join(" ")];
    } else { partes = [cidade]; }
    // semData: só a cidade, com as linhas do mesmo tamanho e o bloco centralizado no círculo
    var linhasCarimbo = DADOS.semData ? partes : partes.concat([data]);
    var soCidade = !!DADOS.semData, n = linhasCarimbo.length;
    var passo = soCidade ? 8.4 : (n > 2 ? 5.6 : 7.2), tamBase = soCidade ? 7 : 5;
    var y0 = soCidade ? 18 - (n - 1) * passo / 2 + tamBase * 0.36 : 19 - (n - 1) * passo / 2 + 1.4;
    var els = linhasCarimbo.map(function (t, i) {
      var el = document.createElementNS("http://www.w3.org/2000/svg", "text");
      el.setAttribute("x", 19); el.setAttribute("y", y0 + i * passo);
      el.setAttribute("letter-spacing", ".2");
      el.textContent = t;
      $("pmTexto").appendChild(el);
      var max = soCidade ? 29.5 : (i === 0 || i === n - 1 ? 25 : 29), tam = (!soCidade && i === n - 1) ? 4.2 : tamBase;
      el.setAttribute("font-size", tam);
      while (el.getComputedTextLength() > max && tam > 2.6) { tam -= 0.2; el.setAttribute("font-size", tam.toFixed(1)); }
      return el;
    });
    if (soCidade) {
      // todas as linhas no menor tamanho que coube, para ficarem iguais
      var menor = Math.min.apply(null, els.map(function (el) { return parseFloat(el.getAttribute("font-size")); }));
      els.forEach(function (el, i) { el.setAttribute("font-size", menor); el.setAttribute("y", 18 - (n - 1) * passo / 2 + menor * 0.36 + i * passo); });
    }
  }
  window.pronto = document.fonts.ready.then(function () { montarCarimbo(); render(T_ESTATICA); return true; });
</script>
</body>
</html>
