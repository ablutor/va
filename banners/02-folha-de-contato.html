<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Banner · Folha de contato</title>
  <!-- Banner da Folha de contato: uma tira de filme com furos, fotos nos quadros e o quadro do avatar circulado a caneta vermelha -->
  <link rel="stylesheet" href="_base.css">
  <link rel="stylesheet" href="../core/cores.css">
  <style>
    /* Mesmas cores do modelo (style.css) */
    :root, [data-cor="original"]   { --bg: #141312; --bg2: #1f1d1b; --bg3: #0c0b0a; --filme: #1a1410; --ink: #ece6dc; --ac: #e08a3c; --caneta: #d6322b; }
    [data-cor="masculino"]  { --bg: #121410; --bg2: #1c1f19; --bg3: #0a0c09; --filme: #151a12; --ink: #e4e8dc; --ac: #b5c46a; --caneta: #e0402e; }
    [data-cor="feminino"]   { --bg: #171214; --bg2: #231b1e; --bg3: #0e0a0b; --filme: #1c1215; --ink: #f3e6e8; --ac: #e79bb0; --caneta: #ff5c8a; }
    [data-cor="feminino-2"] { --bg: #160b0e; --bg2: #241115; --bg3: #0c0507; --filme: #1d0b10; --ink: #f4e4e0; --ac: #f0b6a8; --caneta: #ff6f91; }
    [data-cor^="pastel-"]   { --bg: var(--p-bg); --bg2: var(--p-bg2); --bg3: var(--p-bg); --filme: var(--p-dk); --ink: var(--p-ink); --ac: var(--p-ac); --caneta: var(--p-act); }

    html, body { background: var(--bg); }
    .tudo { background: radial-gradient(ellipse 80% 120% at 50% 40%, var(--bg2), var(--bg3) 85%); }

    /* a tira de filme: base escura de ponta a ponta, com furos em cima e embaixo */
    .tira { position: absolute; left: 0; right: 0; top: 4px; height: 92px; background: var(--filme); box-shadow: 0 0 0 1px color-mix(in srgb, var(--ac) 16%, transparent); }
    .furos { position: absolute; left: 0; right: 0; height: 5px; background: repeating-linear-gradient(90deg, transparent 0 4px, var(--bg3) 4px 9px, transparent 9px 14px); border-radius: 1px; -webkit-mask: none; }
    .furos { background-image: radial-gradient(ellipse 3.6px 2.6px at 50% 50%, var(--bg3) 96%, transparent 100%); background-size: 11px 5px; background-repeat: repeat-x; background-position: 3px 0; }
    .furos.a { top: 4px; } .furos.b { bottom: 4px; }
    /* risco laranja da borda do filme (a marcação impressa) */
    .borda { position: absolute; left: 0; right: 0; height: 1px; background: color-mix(in srgb, var(--ac) 40%, transparent); }
    .borda.a { top: 13px; } .borda.b { bottom: 13px; }
    [data-cor^="pastel-"] .tira { box-shadow: 0 2px 8px rgba(40, 50, 70, .25); }

    /* quadros do filme, à direita, com fotos do cliente */
    .quadro { position: absolute; top: 18px; width: 70px; height: 62px; background: #333 center / cover no-repeat; box-shadow: 0 0 0 1px rgba(0, 0, 0, .5); }
    .quadro.q1 { left: 214px; filter: grayscale(1) contrast(1.1); }
    .quadro.q2 { left: 290px; filter: saturate(.75) contrast(1.05); }
    .quadro.q3 { left: 366px; filter: grayscale(1) contrast(1.1); }
    /* o X de caneta no segundo quadro */
    .xis { position: absolute; left: 330px; top: 9px; width: 14px; height: 14px; z-index: 2; }
    .xis::before, .xis::after { content: ""; position: absolute; left: 6px; top: -1px; width: 2px; height: 16px; background: var(--caneta); border-radius: 1px; transform: rotate(44deg); }
    .xis::after { transform: rotate(-48deg); }

    /* moldura: o quadro escolhido. Fica na cor do filme, com a borda laranja, e o círculo de caneta em volta */
    .moldura { background: var(--filme); box-shadow: 0 0 0 1px var(--ac), 0 2px 7px rgba(0, 0, 0, .5); }
    [data-cor^="pastel-"] .moldura { box-shadow: 0 0 0 1px var(--p-ac), 0 2px 7px rgba(30, 40, 60, .35); }
    .moldura::before, .moldura::after { content: ""; position: absolute; pointer-events: none; }
    .moldura::before { inset: -3px; border: 2px solid var(--caneta); border-radius: 13% 10% 14% 9% / 10% 14% 9% 13%; transform: rotate(-1.4deg); }
    .moldura::after  { inset: -4px; border: 1.5px solid var(--caneta); border-color: transparent var(--caneta) var(--caneta) transparent; border-radius: 10% 14% 11% 15% / 14% 10% 15% 11%; transform: rotate(2.2deg); opacity: .9; }
    .moldura.redonda::before, .redonda .moldura::before { border-radius: 50% 47% 51% 48% / 48% 51% 47% 50%; transform: rotate(-3deg); }
    .moldura.redonda::after, .redonda .moldura::after { border-radius: 48% 51% 47% 52% / 51% 47% 52% 48%; transform: rotate(5deg); }
  </style>
</head>
<body>
  <div class="tudo">
    <div class="tira"></div>
    <div class="furos a"></div><div class="furos b"></div>
    <div class="borda a"></div><div class="borda b"></div>
    <div class="quadro q1" id="q1"></div><div class="quadro q2" id="q2"></div><div class="quadro q3" id="q3"></div>
    <div class="xis"></div>
    <div class="moldura" id="moldura"></div>
  </div>
  <script src="_base.js"></script>
  <script>
    XB.pronto.then(function (d) {
      // três paisagens fixas e diferentes (nunca fotos de pessoa): o banner é igual para qualquer cliente
      var fotos = ["../clientes/exemplo/montanhas.jpg", "../clientes/exemplo/estrada.jpg", "../clientes/exemplo/lago.jpg"];
      ["q1", "q2", "q3"].forEach(function (id, i) { document.getElementById(id).style.backgroundImage = "url('" + fotos[i] + "')"; });
      XB.pronto2();
    });
  </script>
</body>
</html>
