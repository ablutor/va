<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Banner · Pinguim</title>
  <!-- Banner do modelo 12 · Pinguim (Fofinhos): fundo de gelo com neve caindo e pegadas de pinguim, moldura de cartão de gelo
       com montinhos de neve em cima e a ponta do cachecol na quina. O interior da moldura é liso. -->
  <link rel="stylesheet" href="_base.css">
  <style>
    :root { --bg: #e5f1fa; --bg2: #f8fcff; --card: #fdfeff; --ink: #263a52; --ac: #4b92d4; --ac2: #d2e6f6; --pegada: #b3c8da; --neve: #ffffff; --floco: color-mix(in srgb, var(--ac) 35%, #fff); }
    [data-cor="original"]   { --bg: #e5f1fa; --bg2: #f8fcff; --card: #fdfeff; --ink: #263a52; --ac: #4b92d4; --ac2: #d2e6f6; --pegada: #b3c8da; }
    [data-cor="masculino"]  { --bg: #e1eeee; --bg2: #f5fbfb; --card: #fcfefe; --ink: #1b2d47; --ac: #23878f; --ac2: #c9e5e5; --pegada: #a6c3c7; }
    [data-cor="feminino"]   { --bg: #fbe9f0; --bg2: #fff9fb; --card: #fffcfd; --ink: #4b2c3a; --ac: #de6f98; --ac2: #f8d2df; --pegada: #e8bccb; }
    [data-cor="feminino-2"] { --bg: #eee9fa; --bg2: #fbf9ff; --card: #fdfcff; --ink: #3a2f55; --ac: #9277cf; --ac2: #e1d7f5; --pegada: #c8bce2; }
    :root { --gelo: color-mix(in srgb, var(--ac2) 70%, #fff); --gelo-borda: color-mix(in srgb, var(--ac) 42%, var(--ac2)); }
    html, body { background: var(--bg); }
    .tudo { background: radial-gradient(ellipse 60% 120% at 40% 50%, var(--bg2), transparent 75%), var(--bg); }
    .n { position: absolute; border-radius: 50%; background: var(--neve); box-shadow: 0 0 2px color-mix(in srgb, var(--ac) 25%, transparent); }
    .n.f { background: var(--floco); box-shadow: none; }
    .pg { position: absolute; width: 14px; height: 14px; color: var(--pegada); }
    .pg svg { width: 100%; height: 100%; display: block; }
    /* neve acumulada no pé do banner, do lado direito */
    .monte { position: absolute; bottom: -9px; box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--ac) 20%, var(--ac2)); border-radius: 50%; background: radial-gradient(ellipse at 45% 25%, #fff 55%, var(--gelo)); filter: drop-shadow(0 -1px 2px color-mix(in srgb, var(--ac) 14%, transparent)); }
    /* montinhos de neve em cima da moldura (como o do cartão do modelo) */
    .neve { position: absolute; z-index: 2; border-radius: 50%; background: radial-gradient(ellipse at 40% 25%, #fff 55%, var(--gelo)); box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--ac) 38%, var(--ac2)); }
    .n1 { left: 26px; top: 1px; width: 40px; height: 12px; } .n2 { left: 62px; top: 3px; width: 24px; height: 9px; }
    .redonda .n1 { left: 39px; top: 1px; width: 34px; height: 11px; } .redonda .n2 { left: 68px; top: 5px; width: 18px; height: 8px; transform: rotate(22deg); }
    /* cantos: o avatar quadrado do xat tem quina reta, então o cartão arredonda só os 4 px em volta da foto (os aros de fora crescem daí) */
    .moldura { z-index: 1; border-radius: 4px; background: var(--card);
      border: 2px solid var(--gelo-borda); box-shadow: 0 3px 0 var(--gelo-borda), 0 8px 14px color-mix(in srgb, var(--ac) 25%, transparent); }
    .moldura::before { content: ""; position: absolute; inset: -1px; border-radius: inherit; box-shadow: inset 0 0 0 2px color-mix(in srgb, #fff 80%, transparent); }
    .moldura.redonda, .redonda .moldura { border-radius: 50%; }
    /* ponta do cachecol, na quina de baixo */
    .cachecol { position: absolute; z-index: 2; left: 93px; top: 78px; width: 11px; height: 19px; border-radius: 3px 3px 5px 5px; transform: rotate(-9deg); background: linear-gradient(180deg, var(--ac) 0 28%, color-mix(in srgb, var(--ac) 78%, #fff) 28% 44%, var(--ac) 44% 72%, color-mix(in srgb, var(--ac) 78%, #fff) 72% 100%); box-shadow: 0 1px 2px rgba(0,0,0,.25); }
    .redonda .cachecol { left: 83px; top: 77px; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="pegada" viewBox="0 0 100 100"><g fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round"><path d="M50 66 L50 16"/><path d="M50 66 L22 30"/><path d="M50 66 L78 30"/></g><ellipse cx="50" cy="76" rx="11" ry="13" fill="currentColor"/></symbol>
  </defs></svg>
  <div class="tudo" id="tudo">
    <div class="monte" style="left:236px;width:90px;height:20px"></div>
    <div class="monte" style="left:300px;width:110px;height:24px"></div>
    <div class="monte" style="left:196px;width:60px;height:14px"></div>
    <div class="neve n1"></div><div class="neve n2"></div>
    <div class="moldura" id="moldura"></div>
    <div class="cachecol"></div>
  </div>
  <script src="_base.js"></script>
  <script>
    XB.pronto.then(function () {
      var t = document.getElementById("tudo");
      // floquinhos de neve: [x, y, tamanho, floco?]
      [[118,8,3,0],[140,74,2.5,1],[160,90,3.5,0],[184,10,2.5,1],[210,34,3.5,0],[226,12,2.5,1],[246,50,3,1],[262,22,4,0],[284,8,2.5,0],[300,60,3,1],[318,28,3.5,0],[336,12,2.5,1],[350,48,4,0],[364,26,2.5,1],[232,68,2.5,0],[278,80,2.5,1],[340,76,3,0]].forEach(function (f) {
        var d = document.createElement("div"); d.className = "n" + (f[3] ? " f" : "");
        d.style.cssText = "left:" + (f[0] - f[2]) + "px;top:" + (f[1] - f[2]) + "px;width:" + f[2] * 2 + "px;height:" + f[2] * 2 + "px";
        t.insertBefore(d, t.firstChild);
      });
      // pegadas de pinguim em fila, do lado direito
      [[222,58,-14,.9],[252,44,12,.9],[284,54,-12,1],[314,40,14,1],[344,50,-10,1],[366,34,12,.8]].forEach(function (p) {
        var d = document.createElement("div"); d.className = "pg";
        d.style.cssText = "left:" + (p[0] - 7) + "px;top:" + (p[1] - 7) + "px;opacity:" + p[3] + ";transform:rotate(" + p[2] + "deg)";
        d.innerHTML = '<svg viewBox="0 0 100 100"><use href="#pegada"/></svg>';
        t.insertBefore(d, t.firstChild);
      });
      XB.pronto2();
    });
  </script>
</body>
</html>
