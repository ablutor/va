<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Banner · Varal</title>
  <!-- Banner de 380×100: fundo em degradê, fio com luzinhas e pregadores; a moldura é um polaroid preso por um pregador, e dois polaroids pequenos (paisagens) pendurados à direita. -->
  <link rel="stylesheet" href="_base.css">
  <link rel="stylesheet" href="../core/cores.css">
  <style>
    :root,
    [data-cor="original"]   { --bg1: #f3e3cc; --bg2: #e4c9a4; --fio: #7a5a3c; --luz: #ffd45e; --papel: #fffdf8; --pregador: #c9893a; --pino: #e5707a; }
    [data-cor="masculino"]  { --bg1: #1d2740; --bg2: #0f1626; --fio: #8fa3c7; --luz: #ffd877; --papel: #f7f4ec; --pregador: #b98a4e; --pino: #d9625f; }
    [data-cor="feminino"]   { --bg1: #fbe1e7; --bg2: #f1bfcf; --fio: #9a5a6b; --luz: #ffe08a; --papel: #fffafb; --pregador: #d98a86; --pino: #e56b8a; }
    [data-cor="feminino-2"] { --bg1: #ebe2fa; --bg2: #cdbdf0; --fio: #6f5a9a; --luz: #fff0a8; --papel: #fefcff; --pregador: #b49be0; --pino: #9a6bf0; }
    [data-cor^="pastel-"]   { --bg1: var(--p-bg2); --bg2: var(--p-bg); --fio: var(--p-act); --luz: #ffe28a; --papel: var(--p-papel); --pregador: var(--p-claro); --pino: var(--p-act); }

    html, body { background: var(--bg2); }
    .tudo { background: linear-gradient(180deg, var(--bg1), var(--bg2)); }
    .fios { position: absolute; left: 0; top: 0; width: 380px; height: 100px; overflow: visible; }
    .fio { fill: none; stroke: var(--fio); stroke-width: 1.2; opacity: .85; }
    .luzes-fio { fill: none; stroke: var(--luz); stroke-width: 1.2; opacity: .8; }
    .halo { fill: var(--luz); opacity: .3; }
    .luz { fill: var(--luz); }

    /* Pregador de madeira */
    .preg { position: absolute; width: 7px; height: 14px; border-radius: 1.5px; background: var(--pregador); box-shadow: inset 0 0 0 .6px rgba(0, 0, 0, .14), 0 1px 2px rgba(0, 0, 0, .25); }
    .preg::after { content: ""; position: absolute; left: 50%; top: 5px; width: 1px; height: 5px; margin-left: -.5px; background: rgba(0, 0, 0, .25); }

    /* Moldura: polaroid de papel, com o pregador no topo. Redondo vira um polaroid em círculo. */
    .moldura { background: var(--papel); box-shadow: 0 3px 7px rgba(0, 0, 0, .26), 0 0 0 .5px rgba(0, 0, 0, .06); z-index: 5; }
    .moldura .preg { left: 38.5px; top: -6px; }

    .mini { position: absolute; padding: 3px 3px 0; width: 34px; height: 44px; background: var(--papel); box-shadow: 0 3px 6px rgba(0, 0, 0, .24); transform-origin: 50% 0; }
    .mini .ft { width: 100%; height: 28px; background: #888 center / cover; filter: saturate(.95); }
    .mini .preg { left: 13.5px; top: -7px; width: 6px; height: 12px; }
    .m1 { left: 244px; top: 12px; transform: rotate(-4deg); }
    .m2 { left: 312px; top: 17px; transform: rotate(3.5deg); }
  </style>
</head>
<body>
  <div class="tudo">
    <svg class="fios" viewBox="0 0 380 100" id="fios">
      <path class="fio" id="f1" d="M -6 11 Q 25 6 57 5 Q 152 22 260 8 Q 322 16 392 10"/>
      <path class="luzes-fio" id="f2" d="M -6 13 Q 25 8 57 7 Q 152 24 260 10 Q 322 18 392 12"/>
    </svg>
    <div class="mini m1"><div class="ft" style="background-image:url('../clientes/exemplo/carro.jpg'); background-position: 50% 40%"></div><i class="preg"></i></div>
    <div class="mini m2"><div class="ft" style="background-image:url('../clientes/exemplo/baloes.jpg'); background-position: 50% 60%"></div><i class="preg"></i></div>
    <div class="moldura" id="moldura"><i class="preg"></i></div>
  </div>
  <script src="_base.js"></script>
  <script>
    XB.pronto.then(function (d) {
      if (XB.redonda) document.getElementById("moldura").classList.add("redonda");
      // Luzinhas ao longo do fio amarelo (posições medidas sobre o próprio caminho)
      var NS = "http://www.w3.org/2000/svg", path = document.getElementById("f2"), g = document.getElementById("fios"), L = path.getTotalLength();
      for (var x = 12; x < 380; x += 29) {
        // acha o ponto do caminho com essa coordenada x
        var lo = 0, hi = L; for (var k = 0; k < 24; k++) { var m = (lo + hi) / 2; (path.getPointAtLength(m).x < x) ? lo = m : hi = m; }
        var p = path.getPointAtLength(lo);
        if (Math.abs(x - 57) < 8) continue;   // o pregador do polaroid
        [["halo", 4.6], ["luz", 2]].forEach(function (c) {
          var e = document.createElementNS(NS, "circle"); e.setAttribute("class", c[0]);
          e.setAttribute("cx", p.x.toFixed(1)); e.setAttribute("cy", (p.y + 1.5).toFixed(1)); e.setAttribute("r", c[1]); g.appendChild(e);
        });
      }
      XB.pronto2();
    });
  </script>
</body>
</html>
