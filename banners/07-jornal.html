<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Banner · Jornal</title>
  <!-- Papel-jornal com pontinhos, fios duplos de cabeçalho e colunas em "texto falso"; a moldura é uma caixa de foto
       com filete duplo e sombra seca, carimbada no canto. -->
  <link rel="stylesheet" href="_base.css">
  <link rel="stylesheet" href="../core/cores.css">
  <style>
    :root, [data-cor="original"] { --mesa: #2b2a27; --papel: #efe9dc; --ink: #1a1916; --carimbo: #bb2222; }
    [data-cor="masculino"]  { --mesa: #1d232c; --papel: #eef0ee; --ink: #1b2a44; --carimbo: #bb2222; }
    [data-cor="feminino"]   { --mesa: #2c1f22; --papel: #f7e8e6; --ink: #3a1a24; --carimbo: #d6336c; }
    [data-cor="feminino-2"] { --mesa: #221e2b; --papel: #efeaf5; --ink: #2a2140; --carimbo: #7a4fc7; }
    [data-cor^="pastel-"]   { --mesa: var(--p-bg); --papel: var(--p-papel); --ink: var(--p-ink); --carimbo: var(--p-act); }
    html, body { background: var(--mesa); }

    /* papel de ponta a ponta, com pontinhos */
    .tudo { background-color: var(--papel); background-image: radial-gradient(color-mix(in srgb, var(--ink) 7%, transparent) 1px, transparent 1px); background-size: 3px 3px; }
    /* sombra leve de dobra e do jornal sobre a mesa (nas pontas, que o xat corta) */
    .tudo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.10), transparent 14px, transparent 366px, rgba(0,0,0,.10)); pointer-events: none; }

    /* fios duplos de cabeçalho e de rodapé, do lado direito da moldura */
    .fio { position: absolute; left: 108px; right: 0; height: 5px; border-top: 3px solid var(--ink); border-bottom: 1px solid var(--ink); }
    .fio.cima { top: 5px; }
    .fio.baixo { bottom: 5px; transform: scaleY(-1); }
    .fio.cima::before, .fio.baixo::before { content: ""; position: absolute; left: 0; top: -3px; }

    /* colunas de texto falso, à direita (nenhuma letra) */
    .col { position: absolute; top: 22px; bottom: 22px; width: 52px; }
    .col i { display: block; height: 2px; margin-bottom: 4.2px; background: color-mix(in srgb, var(--ink) 30%, transparent); }
    .col i.t { height: 5px; margin-bottom: 4px; background: color-mix(in srgb, var(--ink) 72%, transparent); }
    .col i.c { width: 70%; }
    .reg { position: absolute; top: 18px; bottom: 18px; width: 1px; background: color-mix(in srgb, var(--ink) 35%, transparent); }
    .carimbo { position: absolute; left: 308px; top: 48px; width: 38px; height: 38px; border: 2px solid var(--carimbo); border-radius: 50%; transform: rotate(-12deg); opacity: .8; }
    .carimbo::before { content: ""; position: absolute; inset: 3px; border: 1px solid var(--carimbo); border-radius: 50%; }
    .carimbo::after { content: ""; position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; background: var(--carimbo); clip-path: polygon(50% 0, 62% 36%, 100% 38%, 70% 60%, 80% 100%, 50% 76%, 20% 100%, 30% 60%, 0 38%, 38% 36%); }

    /* moldura: caixa de foto de jornal, filete duplo e sombra seca; vale para quadrado e círculo */
    .moldura { background: var(--papel); border: 2px solid var(--ink); border-radius: 0;
      box-shadow: 0 0 0 2px var(--papel), 0 0 0 3px var(--ink), 4px 4px 0 3px color-mix(in srgb, var(--ink) 28%, transparent); }
    .moldura.redonda, .redonda .moldura { border-radius: 50%; }
  </style>
</head>
<body>
  <div class="tudo">
    <div class="fio cima"></div><div class="fio baixo"></div>
    <div class="col" style="left:218px"><i class="t"></i><i class="t c"></i><i></i><i></i><i></i><i class="c"></i><i></i><i></i><i class="c"></i></div>
    <div class="reg" style="left:277px"></div>
    <div class="col" style="left:286px; width:40px"><i></i><i></i><i class="c"></i><i></i></div>
    <div class="carimbo"></div>
    <div class="moldura" id="moldura"></div>
  </div>
  <script src="_base.js"></script>
  <script>
    XB.pronto.then(function () { XB.pronto2(); });
  </script>
</body>
</html>
