<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Banner · Livro aberto</title>
  <!-- Banner do Livro aberto: só o marcador de fita sobre o fundo pastel do modelo (sem o livro); o avatar fica num rótulo de papel com a borda da cor da capa -->
  <link rel="stylesheet" href="_base.css">
  <link rel="stylesheet" href="../core/cores.css">
  <style>
    /* Mesmas cores do modelo (style.css) */
    :root, [data-cor="masculino"]  { --bg: #f3f7fb; --bg2: #f3f7fb; --bg3: #e2eaf3; --claro: #22324a; --papel: #fbfaf7; --dobra: #e2e0da; --dobra2: #dedcd5; --ac: #2f4f7a; --fita: #1d2f4d; --fita2: #2c4670; }
    [data-cor="feminino"]   { --bg: #fbf3f5; --bg2: #fbf3f5; --bg3: #f1e0e6; --claro: #3d2630; --papel: #fdf8f7; --dobra: #ead9d6; --dobra2: #e6d5d2; --ac: #b5577a; --fita: #8a2f52; --fita2: #a8436a; }
    [data-cor="feminino-2"] { --bg: #f7f4fb; --bg2: #f7f4fb; --bg3: #e8e2f2; --claro: #2e2640; --papel: #faf8fc; --dobra: #e1dbe8; --dobra2: #ddd6e4; --ac: #7a5ca8; --fita: #4e3a78; --fita2: #654d96; }
    [data-cor^="pastel-"]   { --bg: var(--p-bg2); --bg2: var(--p-bg2); --bg3: var(--p-bg); --papel: var(--p-papel);
      --dobra: color-mix(in srgb, var(--p-papel) 90%, var(--p-ink)); --dobra2: color-mix(in srgb, var(--p-papel) 89%, var(--p-ink));
      --ac: var(--p-act); --fita: color-mix(in srgb, var(--p-ac) 55%, var(--p-ink)); --fita2: var(--p-act); --claro: var(--p-ink); }
    :root { --capa: color-mix(in srgb, var(--fita) 70%, #140d0a); }

    html, body { background: var(--bg); }
    .tudo { background: radial-gradient(ellipse 70% 120% at 50% 40%, var(--bg2), var(--bg3) 85%); }
    [data-cor^="pastel-"] .tudo { background: var(--p-bg); }

    /* o marcador de fita, de cetim, pendurado da borda de cima com o pé cortado em V */
    .fita { position: absolute; left: 292px; top: 0; width: 18px; height: 88px; background: linear-gradient(90deg, var(--fita), var(--fita2) 45%, var(--fita) 80%, var(--fita2));
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 86%, 0 100%); filter: drop-shadow(2px 2px 2px rgba(30, 30, 50, .25)); }
    .fita::after { content: ""; position: absolute; left: 3px; right: 3px; top: 0; bottom: 0; border-left: 1px solid rgba(255, 255, 255, .18); border-right: 1px solid rgba(0, 0, 0, .12); }
    [data-cor^="pastel-"] .fita { background: linear-gradient(90deg, var(--p-act), var(--p-ac) 45%, var(--p-act) 80%, var(--p-ac)); }

    /* moldura: rótulo de papel com a borda da cor da capa e um filete fino dentro */
    .moldura { background: var(--papel); box-shadow: 0 0 0 3px var(--capa), 0 3px 8px rgba(30, 30, 50, .28); }
    .moldura::before { content: ""; position: absolute; inset: 1.5px; border: 1px solid var(--ac); border-radius: inherit; opacity: .85; }
  </style>
</head>
<body>
  <div class="tudo">
    <div class="fita"></div>
    <div class="moldura" id="moldura"></div>
  </div>
  <script src="_base.js"></script>
  <script>
    XB.pronto.then(function (d) {
      XB.pronto2();
    });
  </script>
</body>
</html>
