<!doctype html>
<html lang="pt-BR" class="xs-pronto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xatspaces · datas comemorativas</title>
<link rel="stylesheet" href="../core/base.css">
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--fundo, #120a24); display: grid; place-items: center; overflow: hidden; }
  .cena { display: block; width: min(1100px, 94vw); height: auto; filter: drop-shadow(0 24px 50px rgba(0, 0, 0, .35)); }
</style>
</head>
<body>
<svg class="cena" viewBox="0 0 1100 680" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../core/config.js"></script>
<script src="base.js"></script>
<script src="temas.js"></script>
<script src="versoes.js"></script>
<script>
  const nome = new URLSearchParams(location.search).get("tema") || "halloween";
  const tema = TEMAS[nome];
  document.title = "xatspaces · " + tema.titulo;
  document.body.style.setProperty("--fundo", tema.pagina);
  document.querySelector(".cena").innerHTML = montaCena(tema);

  // a estrelinha de sempre, nas cores do tema
  const selo = document.createElement("a");
  selo.className = "xs-marca";
  selo.href = XATSPACE_CONFIG.link;
  selo.target = "_blank";
  selo.rel = "noopener";
  selo.title = selo.ariaLabel = XATSPACE_CONFIG.convite;
  selo.style.cssText = `--xs-marca-fundo:${tema.selo.fundo};--xs-marca-cor:${tema.selo.cor};--xs-marca-destaque:${tema.selo.destaque}`;
  selo.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c.6 4.6 2.9 6.9 7.5 7.5-4.6.6-6.9 2.9-7.5 7.5-.6-4.6-2.9-6.9-7.5-7.5 4.6-.6 6.9-2.9 7.5-7.5z"/><path d="M19 15.5c.3 1.9 1.1 2.7 3 3-1.9.3-2.7 1.1-3 3-.3-1.9-1.1-2.7-3-3 1.9-.3 2.7-1.1 3-3z" opacity=".6"/></svg>' +
    '<span class="xs-marca__t"></span>';
  selo.querySelector(".xs-marca__t").textContent = XATSPACE_CONFIG.convite;
  document.body.appendChild(selo);
</script>
</body>
</html>
